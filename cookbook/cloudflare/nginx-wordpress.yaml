# ==================== cookbook/cloudflare/nginx-wordpress.yaml ===========================
#
#   nginx + WordPress probe paths + Cloudflare automated IP banning.
#
# ========================================================================================

# ── SOURCES ──────────────────────────────────────────────────────────────────────────────
streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-cf

# ── PROCESSORS: Scoring ─────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50
  ban_threshold: 75
  observation_window: "300s"
  decay: "0"

# ── PROCESSORS: Detectors ───────────────────────────────────────────────────────────────
detectors:

  probe:
    enabled: true
    score: 25
    paths:
      - /wp-login.php
      - /wp-admin/
      - /wp-admin/admin-ajax.php
      - /wp-config.php
      - /wp-config.php.bak
      - /wp-config.php.old
      - /wp-config.php~
      - /xmlrpc.php
      - /wp-json/wp/v2/users
      - /?rest_route=/wp/v2/users
      - /wp-content/plugins/
      - /wp-content/themes/
      - /wp-content/uploads/
      - /wp-admin/install.php
      - /wp-admin/upgrade.php
      - /wp-includes/

  bruteforce:
    enabled: true
    min_requests: 10
    ratio_threshold: 0.6
    score: 30

  crawler:
    enabled: true
    min_sequential: 5
    score: 20

  noasset:
    enabled: true
    min_page_requests: 3
    asset_ratio_threshold: 0.1
    score: 20

  rate:
    enabled: true
    window: "60s"
    threshold: 100
    score: 25

  useragent:
    enabled: true
    scanner_score: 40
    grabber_score: 20
    automation_score: 15
    empty_ua_score: 30
    extra_scanner_patterns: []
    extra_grabber_patterns: []
    extra_automation_patterns: []

  overflow:
    enabled: true
    max_url_length: 2048
    score: 30

  badbot:
    enabled: true
    score: 60
    check_ua: true
    check_referrer: false

# ── PROCESSORS: Whitelist ───────────────────────────────────────────────────────────────
whitelist:
  custom:
    ips: []
    cidrs: []
    ua_substrings: []

# ── chain_guard: proxy chain integrity check (disabled by default) ──────────────────────
# chain_guard:
#   enabled: true
#   warnings_log: /var/log/arxsentinel/warnings.log

# ── EXECUTORS ───────────────────────────────────────────────────────────────────────────
executors:
  - name: cf-ban
    type: cloudflare
    sources:
      - name: sentinel-cf
    config:
      api_token: "YOUR_CF_API_TOKEN"
      account_id: "YOUR_CF_ACCOUNT_ID"
      list_name: "arxsentinel_blocklist"
      min_level: "THREAT"
      ttl: "24h"
      batch_size: 100
      flush_interval: "10s"