# ==================== cookbook/cloudflare/nginx-wordpress.yaml ===========================
#
#   nginx + WordPress probe paths + Cloudflare automated IP banning.
#
# ========================================================================================

scoring:
  alert_threshold: 50
  ban_threshold: 75
  observation_window: 5m
  decay: 0

detectors:
  probe:
    paths:
      - /wp-login.php
      - /wp-admin/
      - /wp-admin/admin-ajax.php
      - /wp-config.php
      - /wp-config.php.bak
      - /wp-config.php.old
      - /wp-config.php~
      - /xmlrpc.php
      - /wp-json/wp/v2/users
      - /?rest_route=/wp/v2/users
      - /wp-content/plugins/
      - /wp-content/themes/
      - /wp-content/uploads/
      - /wp-admin/install.php
      - /wp-admin/upgrade.php
      - /wp-includes/

streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-cf

executors:
  - name: cf-ban
    type: cloudflare
    sources:
      - name: sentinel-cf
    config:
      api_token: "YOUR_CF_API_TOKEN"
      account_id: "YOUR_CF_ACCOUNT_ID"
      list_name: "arxsentinel_blocklist"
      min_level: "THREAT"
      ttl: "24h"
      batch_size: 100
      flush_interval: "10s"