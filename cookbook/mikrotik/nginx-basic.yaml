# ====================== cookbook/mikrotik/nginx-basic.yaml ==============================
#
#   nginx combined log + MikroTik automated address list banning.
#   Dual output: threats.log (Fail2Ban fallback) + sentinel-threat (MikroTik executor).
#
# ========================================================================================

# ── SOURCES ──────────────────────────────────────────────────────────────────────────────
streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-mt

# ── PROCESSORS: Scoring ─────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50
  ban_threshold: 75
  observation_window: "300s"
  decay: "0"

# ── PROCESSORS: Detectors ───────────────────────────────────────────────────────────────
detectors:

  probe:
    enabled: true
    score: 25

  bruteforce:
    enabled: true
    min_requests: 10
    ratio_threshold: 0.6
    score: 30

  crawler:
    enabled: true
    min_sequential: 5
    score: 20

  noasset:
    enabled: true
    min_page_requests: 3
    asset_ratio_threshold: 0.1
    score: 20

  rate:
    enabled: true
    window: "60s"
    threshold: 100
    score: 25

  useragent:
    enabled: true
    scanner_score: 40
    grabber_score: 20
    automation_score: 15
    empty_ua_score: 30
    extra_scanner_patterns: []
    extra_grabber_patterns: []
    extra_automation_patterns: []

  overflow:
    enabled: true
    max_url_length: 2048
    score: 30

  badbot:
    enabled: true
    score: 60
    check_ua: true
    check_referrer: false

# ── PROCESSORS: Whitelist ───────────────────────────────────────────────────────────────
whitelist:
  custom:
    ips: []
    cidrs: []
    ua_substrings: []

# ── chain_guard: proxy chain integrity check (disabled by default) ──────────────────────
# chain_guard:
#   enabled: true
#   warnings_log: /var/log/arxsentinel/warnings.log

# ── EXECUTORS ───────────────────────────────────────────────────────────────────────────
executors:
  - name: mikrotik-ban
    type: mikrotik
    sources:
      - name: sentinel-mt
    config:
      host: "YOUR_MIKROTIK_HOST"
      port: 443
      username: "YOUR_USERNAME"
      password: "YOUR_PASSWORD"
      sentinel_id: "sentinel-1"
      list_name: "arxsentinel_blocklist"
      min_level: "THREAT"
      ttl: "24h"
      batch_size: 10
      flush_interval: "30s"