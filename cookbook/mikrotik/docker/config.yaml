# ================== cookbook/mikrotik/docker/config.yaml ================================
#
#   ArxSentinel config for Docker Compose with MikroTik executor.
#   Reads nginx access log from shared Docker volume.
#
# =======================================================================================

scoring:
  alert_threshold: 50
  ban_threshold: 75
  observation_window: 5m
  decay: 0

streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-mt

executors:
  - name: mikrotik-ban
    type: mikrotik
    sources:
      - name: sentinel-mt
    config:
      host: "YOUR_MIKROTIK_HOST"
      port: 443
      username: "YOUR_USERNAME"
      password: "YOUR_PASSWORD"
      sentinel_id: "sentinel-1"
      list_name: "arxsentinel_blocklist"
      min_level: "THREAT"
      ttl: "24h"
      batch_size: 10
      flush_interval: "30s"