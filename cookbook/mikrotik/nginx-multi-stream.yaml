# ==================== cookbook/mikrotik/nginx-multi-stream.yaml ==========================
#
#   Two nginx vhosts, both feeding THREAT events to a shared MikroTik executor.
#
# ========================================================================================

scoring:
  alert_threshold: 50
  ban_threshold: 75
  observation_window: 5m
  decay: 0

streams:
  - name: frontend
    inputs:
      - type: file
        path: /var/log/nginx/frontend.access.log
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-mt
  - name: api
    inputs:
      - type: file
        path: /var/log/nginx/api.access.log
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-mt

executors:
  - name: mikrotik-ban
    type: mikrotik
    sources:
      - name: sentinel-mt
    config:
      host: "YOUR_MIKROTIK_HOST"
      port: 443
      username: "YOUR_USERNAME"
      password: "YOUR_PASSWORD"
      sentinel_id: "sentinel-1"
      list_name: "arxsentinel_blocklist"
      min_level: "THREAT"
      ttl: "24h"
      batch_size: 10
      flush_interval: "30s"