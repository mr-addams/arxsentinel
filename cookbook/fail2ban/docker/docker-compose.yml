# ====================== cookbook/fail2ban/docker/docker-compose.yml ======================
#
#   ArxSentinel sidecar + nginx, shared volume for log access.
#   Threat log flows to Fail2Ban on the host via bind mount.
#
#   Quick start:
#     mkdir -p /var/log/arxsentinel && chown 65532:65532 /var/log/arxsentinel
#     docker compose up -d
#
# ========================================================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_logs:/var/log/nginx
    restart: unless-stopped

  arxsentinel:
    image: ghcr.io/mr-addams/arxsentinel:latest
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - /var/log/arxsentinel:/var/log/arxsentinel
      - ./config.yaml:/etc/arxsentinel/config.yaml:ro
    ports:
      - "127.0.0.1:9117:9117"
    restart: unless-stopped

volumes:
  nginx_logs: