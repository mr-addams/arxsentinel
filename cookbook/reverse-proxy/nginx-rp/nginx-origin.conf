# nginx origin config for use behind nginx reverse proxy.
#
# The upstream nginx sets X-Forwarded-For. ngx_http_realip_module reads the
# header and replaces $remote_addr with the real client IP.
# arxsentinel reads $remote_addr from the access log — the correct IP.

http {
    # Trust the upstream nginx address.
    # Docker Compose network: use 172.16.0.0/12.
    # Same-host deployment: use 127.0.0.1.
    # Production: replace with your actual proxy IP/CIDR.
    set_real_ip_from  172.16.0.0/12;

    # The upstream nginx sets X-Forwarded-For via proxy_add_x_forwarded_for.
    real_ip_header    X-Forwarded-For;

    # Walk the XFF chain to find the first non-trusted address — real client IP.
    real_ip_recursive on;

    # ── Standard combined format + $remote_addr ────────────────────────────────
    # arxsentinel "combined" profile reads the last field as the real client IP.
    # After realip processing, $remote_addr holds the real client IP.
    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$remote_addr"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            # Your application backend
            proxy_pass http://127.0.0.1:3000;
        }
    }
}

# ── Cloudflare snippet ──────────────────────────────────────────────────────────
#
# If this nginx sits directly behind Cloudflare (no other proxy in between):
# use CF-Connecting-IP header instead of X-Real-IP.
#
# Add to your server block:
#
#   set_real_ip_from  103.21.244.0/22;   # and all other Cloudflare CIDR ranges
#   real_ip_header    CF-Connecting-IP;
#   real_ip_recursive off;
#
# Generate set_real_ip_from lines automatically:
#   sudo scripts/update-cloudflare-ips.sh /etc/nginx/cloudflare-real-ip.conf
#   # Then add to nginx.conf: include /etc/nginx/cloudflare-real-ip.conf;
#
# Why CF-Connecting-IP and not X-Forwarded-For:
#   X-Forwarded-For can be spoofed by clients before the request reaches Cloudflare.
#   CF-Connecting-IP is set by Cloudflare's edge and cannot be injected by clients.
