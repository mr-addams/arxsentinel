# nginx reverse-proxy (upstream) config for use with arxsentinel.
#
# This nginx instance sits in front of the origin nginx.
# It forwards the real client IP to the origin via X-Forwarded-For.

http {
    upstream origin {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name example.com;

        # ssl_certificate / ssl_certificate_key — configure as needed

        location / {
            proxy_pass http://origin;

            # $proxy_add_x_forwarded_for appends $remote_addr to any existing
            # X-Forwarded-For. The origin reads the real client IP from this chain.
            proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  Host               $host;
        }
    }
}
