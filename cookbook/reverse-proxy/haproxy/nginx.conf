# nginx origin config for use behind HAProxy.
#
# HAProxy sets X-Forwarded-For via "option forwardfor". ngx_http_realip_module
# reads the header and replaces $remote_addr with the real client IP.
# arxsentinel reads $remote_addr from the access log — the correct IP.

http {
    # Trust the HAProxy address.
    # Docker Compose network: use 172.16.0.0/12.
    # Same-host deployment: use 127.0.0.1.
    # Production: replace with your actual proxy IP/CIDR.
    set_real_ip_from  172.16.0.0/12;

    # HAProxy sets X-Forwarded-For via "option forwardfor".
    real_ip_header    X-Forwarded-For;

    # Walk the XFF chain to find the first non-trusted address — real client IP.
    real_ip_recursive on;

    # Log format: combined fields + $remote_addr as the last field (real client IP
    # after realip module processing). arxsentinel "combined" profile reads this field.
    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$remote_addr"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            # Your application backend
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
