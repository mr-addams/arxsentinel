# ====================== cookbook/openwrt/nginx-basic.yaml ===============================
#
#   nginx combined log + OpenWrt automated ipset banning via ubus/UCI firewall.
#   Dual output: threats.log (Fail2Ban fallback) + sentinel-threat (OpenWrt executor).
#
#   OpenWrt prerequisites (run once on the router):
#     # 1. Make sure the ubus bridge is installed on uhttpd — many base images
#     #    ship uhttpd without it. POST /ubus returning 404 means the module
#     #    is missing:
#     opkg update
#     opkg install uhttpd-mod-ubus
#     /etc/init.d/uhttpd restart
#
#     # 2. Verify the rpcd core objects are available (root has access out of
#     #    the box on stock builds):
#     ubus list | grep -E '^(uci|rc|session)$'
#
#     # 3. Declare a NAMED ipset section in the firewall UCI config and a
#     #    drop rule referencing it. The section name is the value of
#     #    `ipset_name` in the executor config below — they must match.
#     #    An anonymous section (firewall.@ipset[N]) is NOT addressable by
#     #    name and every add_list call would fail with "not found".
#     uci set firewall.arxsentinel_blocklist=ipset
#     uci set firewall.arxsentinel_blocklist.name='arxsentinel_blocklist'
#     uci set firewall.arxsentinel_blocklist.match='src_ip'
#     uci add_list firewall.arxsentinel_blocklist.entry='1.2.3.4'   # seed; plugin manages thereafter
#     uci set firewall.drop_blocklist=rule
#     uci set firewall.drop_blocklist.name='Drop-blocklist'
#     uci set firewall.drop_blocklist.src='wan'
#     uci set firewall.drop_blocklist.dest='*'
#     uci set firewall.drop_blocklist.ipset='arxsentinel_blocklist'
#     uci set firewall.drop_blocklist.target='DROP'
#     uci commit firewall
#     /etc/init.d/firewall reload
#
#     # 4. Use an account with read/write access to the firewall UCI config.
#     #    On a stock image, 'root' works. On a hardened build, ensure the
#     #    ACL files in /usr/share/rpcd/acl.d/ grant the chosen user access
#     #    to the uci and rc core objects.
#
#   For HTTPS (when /ubus is fronted by a TLS reverse proxy or LuCI is on HTTPS):
#     - set scheme: "https" and port: 443 in the executor config below
#     - the standard Go HTTP transport validates certs against the system
#       trust store; for a private CA, use the standard SSL_CERT_FILE /
#       SSL_CERT_DIR env vars (the plugin has no ca_file knob).
#
# ========================================================================================

# ── SOURCES ──────────────────────────────────────────────────────────────────────────────
streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban
      - type: sentinel-threat
        name: sentinel-owrt

# ── PROCESSORS: Scoring ─────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50   # score ≥ N → WARN event; int, 1..(ban_threshold-1), default: 50
  ban_threshold: 75     # score ≥ N → THREAT + executor action; int, >(alert_threshold), default: 80
  observation_window: "300s"  # score accumulation window; duration: "60s"|"5m"|"1h", default: "300s"
  decay: "0"            # score decay toward end of window; "linear" | "0" (no decay), default: "linear"

# ── PROCESSORS: Detectors ───────────────────────────────────────────────────────────────
detectors:

  probe:
    enabled: true     # enable/disable; bool, default: true
    score: 25         # points added per probe request; int, 1..100+, default: 25

  bruteforce:
    enabled: true       # enable/disable; bool, default: true
    min_requests: 10    # minimum total requests before activating; int, ≥1, default: 10
    ratio_threshold: 0.6  # fraction of 404 responses to trigger; float, 0.0..1.0, default: 0.6
    score: 30           # points added on trigger; int, 1..100+, default: 30

  crawler:
    enabled: true       # enable/disable; bool, default: true
    min_sequential: 5   # min sequential numeric URLs to trigger; int, ≥2, default: 5
    score: 20           # points added on trigger; int, 1..100+, default: 20

  noasset:
    enabled: true               # enable/disable; bool, default: true
    min_page_requests: 3        # min HTML page requests before activating; int, ≥1, default: 3
    asset_ratio_threshold: 0.1  # max fraction of asset requests to still trigger; float, 0.0..1.0, default: 0.1
    score: 20                   # points added on trigger; int, 1..100+, default: 20

  rate:
    enabled: true    # enable/disable; bool, default: true
    window: "60s"    # time window for counting requests; duration: "30s"|"60s"|"5m", default: "60s"
    threshold: 100   # max requests per window before trigger; int, ≥1, default: 100
    score: 25        # points added on trigger; int, 1..100+, default: 25

  useragent:
    enabled: true                  # enable/disable; bool, default: true
    scanner_score: 40              # points for scanner UA (Nuclei, sqlmap, Nikto...); int, 1..100+, default: 40
    grabber_score: 20              # points for grabber UA (HTTrack, wget, Scrapy...); int, 1..100+, default: 20
    automation_score: 15           # points for automation UA (python-requests, aiohttp...); int, 1..100+, default: 15
    empty_ua_score: 30             # points for missing User-Agent header; int, 1..100+, default: 30
    extra_scanner_patterns: []     # additional scanner UA substrings (case-insensitive); list of strings
    extra_grabber_patterns: []     # additional grabber UA substrings; list of strings
    extra_automation_patterns: []  # additional automation UA substrings; list of strings

  overflow:
    enabled: true        # enable/disable; bool, default: true
    max_url_length: 2048 # URL length limit; int, ≥64, default: 2048
    score: 30            # points added on trigger; int, 1..100+, default: 30

  badbot:
    enabled: true        # enable/disable community bad-bot blocklist matching; bool, default: true
    score: 60            # points added on match; int, 1..100+, default: 60
    check_ua: true       # match against bad-bot UA list; bool, default: true
    check_referrer: false  # match against bad referrer list; bool, default: false

# ── PROCESSORS: Whitelist ───────────────────────────────────────────────────────────────
whitelist:
  custom:
    ips: []                  # trusted individual IPs; list of strings: ["1.2.3.4", "5.6.7.8"]
    cidrs: []                # trusted IP ranges; list of strings: ["10.0.0.0/8", "192.168.0.0/16"]
    ua_substrings: []        # trusted UA substrings (case-insensitive); list of strings: ["MyMonitor/", "healthcheck"]
    paths: []             # skip scoring for these URL prefixes; example: ["/ws", "/health", "/api/internal"]

# ── chain_guard: proxy chain integrity check (disabled by default) ──────────────────────
# chain_guard:
#   enabled: true
#   warnings_log: /var/log/arxsentinel/warnings.log

# ── EXECUTORS ───────────────────────────────────────────────────────────────────────────
executors:
  - name: openwrt-ban
    type: openwrt
    sources:
      - name: sentinel-owrt
    config:
      host: "YOUR_OPENWRT_HOST"   # adjust to your router address (hostname or IP)
      port: 80                    # uhttpd-mod-ubus port; int, default: 80
      scheme: "http"              # "http" or "https"; string, default: "http"
      username: "root"            # adjust to your rpcd user with write access to firewall UCI
      password: "YOUR_PASSWORD"   # replace with your router password
      ipset_name: "arxsentinel_blocklist"  # UCI section identifier of the ipset (firewall.<ipset_name>=ipset); string, REQUIRED
      ttl: "24h"                  # ban lifetime; duration, REQUIRED (> 0, plugin owns expiry tracking)
      session_timeout: "5m"       # ubus_rpc_session token lifetime; duration, default: 5m
      batch_size: 10              # max IPs per batch before flush; int, ≥1, default: 10
      flush_interval: "30s"       # max delay before flushing partial batch; duration, default: 30s
      min_level: "THREAT"         # minimum threat level to act on; "INFO"|"WARN"|"THREAT", default: "THREAT"
      dedup_window: "0"           # skip re-banning an IP within this window after a successful add; duration, "0" disables; default: "0"
