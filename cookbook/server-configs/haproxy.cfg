# HAProxy configuration for ArxSentinel integration.
#
# ArxSentinel's "haproxy-http" profile parses a custom log-format that extends
# the standard httplog fields with a captured User-Agent header. This is required
# for the badbot detector to match UA patterns from the community blocklist.
#
# The log-format replicates the "option httplog" field layout and appends the
# captured UA as the last quoted field. Old-style logs without the UA field are
# also accepted — the profile treats it as optional.
#
# HAProxy logs to stdout (format raw) in this example; a separate process (e.g.
# run.sh / docker logs, or a log shipper) writes the stream to a file for sentinel.
# To use syslog instead, replace `log stdout format raw local0 info` with
# `log /dev/log local0 info` and add an rsyslog rule (see comment at the bottom).

global
    log stdout len 8192 format raw local0 info
    maxconn 50000
    user haproxy
    group haproxy
    daemon
    # tune.http.logurilen: raise URL length limit in log lines so the overflow
    # detector (URLs > 2048 chars) is captured without truncation.
    tune.http.logurilen 4096

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:80
    # Capture User-Agent into slot 0 at request phase — always available in log-format.
    # Using http-request capture avoids the "req.fhdr in log-format" reliability error
    # in HAProxy 3.x (req.fhdr may not be available at logging time).
    http-request capture req.hdr(user-agent) len 200
    # Custom log-format: replicates "option httplog" field layout and appends the
    # captured UA as the last quoted field.
    # Resulting line format:
    #   10.0.0.1:54321 [01/Jun/2024:12:34:56 +0000] http-in~ backend/server 0/0/2/8/10
    #                  200 1234 - - ---- 5/4/0/1/0 0/0 "GET / HTTP/1.1" "Mozilla/5.0"
    log-format "%ci:%cp [%trl] %ft %b/%s %Tq/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}r \"%[capture.req.hdr(0)]\""
    default_backend web-servers

backend web-servers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# ── rsyslog: write HAProxy logs to a file (alternative to stdout) ─────────────────────
#
# Replace `log stdout format raw local0 info` in global with `log /dev/log local0 info`,
# then create /etc/rsyslog.d/49-haproxy.conf:
#
#   $AddUnixListenSocket /dev/log
#   if $programname == 'haproxy' then {
#       action(type="omfile" file="/var/log/haproxy/access.log"
#              fileCreateMode="0640" fileOwner="haproxy")
#       stop
#   }
#
# Restart rsyslog: systemctl restart rsyslog
# Point sentinel at: general.log_file: /var/log/haproxy/access.log
