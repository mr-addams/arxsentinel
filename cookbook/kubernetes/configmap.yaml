# ArxSentinel ConfigMap — config for Kubernetes deployment.
# stdout JSON sink: threats flow into your log aggregator (Loki, Datadog, etc.).
# Replace with a file sink if running Fail2Ban on the node.
apiVersion: v1
kind: ConfigMap
metadata:
  name: arxsentinel-config
  namespace: monitoring
data:
  config.yaml: |
    scoring:
      alert_threshold: 50
      ban_threshold: 80
      observation_window: 300s
      decay: linear

    streams:
      - name: main
        inputs:
          - type: file
            path: /var/log/nginx/access.log
            parser: combined
        outputs:
          - type: file
            path: /var/log/arxsentinel/threats.log
            format: fail2ban

    metrics:
      enabled: true
      listen_addr: ":9117"