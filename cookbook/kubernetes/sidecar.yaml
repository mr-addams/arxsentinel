# ArxSentinel sidecar example — runs alongside the app container in the same Pod.
# Both containers share a log directory via emptyDir.
# Use this when you cannot use DaemonSet (e.g., managed K8s without node log access).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-arxsentinel
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-with-arxsentinel
  template:
    metadata:
      labels:
        app: nginx-with-arxsentinel
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9117"
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/nginx

        - name: arxsentinel
          image: ghcr.io/mr-addams/arxsentinel:latest
          args: ["-config", "/etc/arxsentinel/config.yaml"]
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - name: metrics
              containerPort: 9117
          livenessProbe:
            httpGet:
              path: /health
              port: 9117
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: shared-logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: config
              mountPath: /etc/arxsentinel
              readOnly: true
            # Uncomment to use internal CA cert for MikroTik executor:
            # - name: mikrotik-ca
            #   mountPath: /etc/arxsentinel/ca
            #   readOnly: true

      volumes:
        - name: shared-logs
          emptyDir: {}
        - name: config
          configMap:
            name: arxsentinel-config
        # Uncomment to mount internal CA cert for MikroTik executor:
        # - name: mikrotik-ca
        #   configMap:
        #     name: mikrotik-ca
