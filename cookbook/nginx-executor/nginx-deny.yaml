# ================== cookbook/nginx-executor/nginx-deny.yaml ============================
#
#   nginx combined log + nginx blocklist executor (deny format).
#   Threat IPs are written as `deny <ip>;` lines and nginx is reloaded.
#
#   This is the deny-format variant of nginx-basic.yaml.
#   Use it when you want a straightforward per-location block with no
#   geo{} map plumbing (no $is_blocked variable shared with upstream).
#
#   Add to your nginx.conf — include the file INSIDE a server {} or
#   location {} block, next to other allow/deny directives:
#
#     server {
#         listen 80;
#
#         location / {
#             include /etc/nginx/conf.d/arxsentinel_deny.list;
#             deny all;
#         }
#     }
#
#   State file (TTL persistence) is independent of file_format and works
#   identically — it stores IP and addedAt timestamp in JSON.
#
#   Do NOT mix geo and deny formats across reloads: pick one and stick to it.
#
# =======================================================================================

# ── SOURCES ──────────────────────────────────────────────────────────────────────────────
streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log   # threat log for Fail2Ban; string, default: /var/log/arxsentinel/threats.log
        format: fail2ban                     # output format; "fail2ban"|"plain", default: "fail2ban"
      - type: sentinel-threat
        name: sentinel-cf

# ── PROCESSORS: Scoring ─────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50         # score ≥ N → WARN event; int, 1..(ban_threshold-1), default: 50
  ban_threshold: 75           # score ≥ N → THREAT + executor action; int, >(alert_threshold), default: 75
  observation_window: "300s"  # score accumulation window; duration: "60s"|"5m"|"1h", default: "300s"
  decay: "0"                  # score decay toward end of window; "linear"|"0" (no decay), default: "0"

# ── PROCESSORS: Detectors ───────────────────────────────────────────────────────────────
detectors:

  probe:
    enabled: true           # enable probe detector; bool, default: true
    score: 25                # score added per detection; int, 1..100, default: 25

  bruteforce:
    enabled: true              # enable bruteforce detector; bool, default: true
    min_requests: 10            # min failed requests to trigger; int, ≥1, default: 10
    ratio_threshold: 0.6        # min fail/success ratio; float 0..1, default: 0.6
    score: 30                   # score added per detection; int, 1..100, default: 30

  crawler:
    enabled: true              # enable crawler detector; bool, default: true
    min_sequential: 5           # min sequential requests to same page; int, ≥1, default: 5
    score: 20                   # score added per detection; int, 1..100, default: 20

  noasset:
    enabled: true                 # enable noasset detector; bool, default: true
    min_page_requests: 3           # min page requests without assets; int, ≥1, default: 3
    asset_ratio_threshold: 0.1     # max allowed asset/page ratio; float 0..1, default: 0.1
    score: 20                      # score added per detection; int, 1..100, default: 20

  rate:
    enabled: true          # enable rate detector; bool, default: true
    window: "60s"           # rate measurement window; duration, default: "60s"
    threshold: 100          # max requests within window; int, ≥1, default: 100
    score: 25               # score added per detection; int, 1..100, default: 25

  useragent:
    enabled: true                    # enable useragent detector; bool, default: true
    scanner_score: 40                # score when UA matches scanner pattern; int, 1..100, default: 40
    grabber_score: 20                # score when UA matches grabber pattern; int, 1..100, default: 20
    automation_score: 15             # score when UA matches automation pattern; int, 1..100, default: 15
    empty_ua_score: 30               # score when UA is empty; int, 1..100, default: 30
    extra_scanner_patterns: []       # extra regex patterns for scanner detection; list of strings, default: []
    extra_grabber_patterns: []       # extra regex patterns for grabber detection; list of strings, default: []
    extra_automation_patterns: []    # extra regex patterns for automation detection; list of strings, default: []

  overflow:
    enabled: true           # enable overflow detector; bool, default: true
    max_url_length: 2048    # URL length threshold; int, ≥1, default: 2048
    score: 30               # score added per detection; int, 1..100, default: 30

  badbot:
    enabled: true          # enable badbot detector; bool, default: true
    score: 60               # score when known badbot detected; int, 1..100, default: 60
    check_ua: true          # detect by user-agent; bool, default: true
    check_referrer: false   # detect by referrer; bool, default: false

# ── PROCESSORS: Whitelist ───────────────────────────────────────────────────────────────
whitelist:
  custom:
    ips: []              # trusted individual IPs; list of strings: ["1.2.3.4", "5.6.7.8"]
    cidrs: []            # trusted IP ranges; list of strings: ["10.0.0.0/8", "192.168.0.0/16"]
    ua_substrings: []    # trusted UA substrings (case-insensitive); list of strings: ["MyMonitor/", "healthcheck"]
    paths: []          # skip scoring for these URL prefixes; example: ["/ws", "/health", "/api/internal"]

# ── chain_guard: proxy chain integrity check (disabled by default) ──────────────────────
# chain_guard:
#   enabled: true
#   warnings_log: /var/log/arxsentinel/warnings.log

# ── EXECUTORS ───────────────────────────────────────────────────────────────────────────
executors:
  - name: nginx-blocklist
    type: nginx
    sources:
      - name: sentinel-cf
    config:
      list_file: /etc/nginx/conf.d/arxsentinel_deny.list
      state_file: /var/lib/arxsentinel/nginx-state.json
      file_format: deny           # on-disk line syntax; "geo" → "<ip> 1;" (nginx geo{} map), "deny" → "deny <ip>;" (nginx allow/deny), default: "geo"
      min_level: "THREAT"          # minimum threat level to act on; "INFO"|"WARN"|"THREAT", default: "THREAT"
      ttl: "24h"                   # auto-unban after this duration (0 = no auto-unban); duration, default: "24h"
      batch_size: 10               # IPs per batch write; int, ≥1, default: 10
      flush_interval: "30s"        # max delay before flushing partial batch; duration, default: "30s"
      reload_cmd: "nginx -s reload" # command to reload nginx after list update; string