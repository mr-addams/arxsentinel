# ========================== Distributed NCS — mixed-routing: detector ==================
# One detector PROCESS, TWO independent pipelines. Each pipeline receives from its own
# collector's queue name and forwards to its own executor's queue name/peer — the mixed
# routing decision is made once, at config time (which pipeline this traffic entered
# through), not per-event at runtime. This is the pattern to reach for when different
# sources need different RESPONSE mechanisms (here: web-tier bans via nginx, auth/network-
# tier bans via a router's address-list) even though both are scored the same way.
#
# Before starting, replace the two peer placeholders with the real executor hosts.

transport:
  enabled: true
  identity: /etc/arxsentinel/node.key
  known_nodes: /etc/arxsentinel/known-nodes
  listen: "0.0.0.0:4097"
  pairing_secret: "CHANGE-ME-shared-mesh-secret"  # SAME value on every node in this mesh, exchanged out-of-band
  peers:
    - host: "nginx-executor.example.net:4097"
      fingerprint: ""
    - host: "mikrotik-executor.example.net:4097"
      fingerprint: ""

streams:
  - name: detector
    pipelines:
      - name: web
        inputs:
          - type: sentinel
            addr: ncs://edge-web
            mode: raw
            queue:
              type: transport
              mode: recv
        outputs:
          - type: sentinel-threat
            name: scored-web
            queue:
              type: transport
              mode: send
              peer: "nginx-executor.example.net:4097"

      - name: auth
        inputs:
          - type: sentinel
            addr: ncs://edge-auth
            mode: raw
            queue:
              type: transport
              mode: recv
        outputs:
          - type: sentinel-threat
            name: scored-auth
            queue:
              type: transport
              mode: send
              peer: "mikrotik-executor.example.net:4097"
