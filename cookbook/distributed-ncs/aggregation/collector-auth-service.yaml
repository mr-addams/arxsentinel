# ========================== Distributed NCS — aggregation: collector (auth service) ====
# See collector-nginx-edge.yaml for the full explanation — same pattern, different log
# source. Forwards onto the SAME "edge-raw" queue name on the detector as every other
# collector in this scenario.

transport:
  enabled: true
  identity: /etc/arxsentinel/node.key
  known_nodes: /etc/arxsentinel/known-nodes
  listen: "0.0.0.0:4097"
  pairing_secret: "CHANGE-ME-shared-mesh-secret"  # SAME value on every node in this mesh, exchanged out-of-band
  peers:
    - host: "detector.example.net:4097"
      fingerprint: ""

streams:
  - name: collector-auth-service
    pipelines:
      - name: raw
        raw_forward: true
        inputs:
          - type: file
            path: /var/log/auth-service/access.log
            parser: combined
        outputs:
          - type: sentinel-threat
            name: edge-raw
            format: raw-line
            queue:
              type: transport
              mode: send
              peer: "detector.example.net:4097"
