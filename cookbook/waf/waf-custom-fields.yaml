# ====================== cookbook/waf/waf-custom-fields.yaml ===================
#
#   WAF recipe with a CUSTOM field extension.
#   Pipeline: nginx combined log → WAF (with custom http.tls_version field) → stdout.
#
#   Use case: you want to drop requests that arrived over deprecated TLS versions
#   (TLS 1.0 / 1.1). The standard http.* namespace (manifest.go) does not expose
#   TLS metadata, so this recipe shows the two-step extension pattern:
#
#     1. Declare the new field in the WAF plugin's manifest (Go code).
#     2. Answer the field in the resolver's resolveHTTP switch (Go code).
#
#   After the two Go changes (no ruleset.go edit needed — auto-discovery via
#   builder.FromManifest registers the new field), the field is available as
#   `http.tls_version` in any rule expression.
#
# =======================================================================================

# ── Go code changes (PR description, not files in the recipe) ───────────────────────
#
# Step 1 — pkg/processorplugins/waf/manifest.go — add one entry to Manifest.Produces:
#
#     Produces: []plugin.FieldDecl{
#         // ... existing 12 fields ...
#
#         // Custom field: TLS handshake version negotiated by the client.
#         {Name: "tls_version", Type: plugin.TypeString},
#     }
#
# Step 2 — pkg/processorplugins/waf/resolver.go — add one case to the resolveHTTP switch:
#
#     case "tls_version":
#         return rule.NewString(entry.TLSVersion), true
#
# After these two changes:
#   - The new field is type-checked at compile time (string).
#   - `http.tls_version` is available in any rule expression.
#   - The new field auto-registers via builder.FromManifest (no ruleset.go change).
#   - FieldDecl vs. resolveHTTP drift is caught by resolver_test.go (recommended).
#
# =======================================================================================

# ── Streams ───────────────────────────────────────────────────────────────────────────
streams:
  - name: waf-tls-gate
    inputs:
      - type: file
        path: /var/log/nginx/access.log
        parser: combined

    processors:
      - plugin: waf
        params:
          waf_config:
            rules:

              # 1. Pass healthchecks (standard http.* — works out of the box).
              - name: pass_healthcheck
                expression: 'http.path eq "/healthz"'
                action: pass

              # 2. CUSTOM FIELD: drop clients negotiating deprecated TLS 1.0 / 1.1.
              #
              # >>> THIS RULE REQUIRES the Go-side extension documented above <<<
              # >>> (manifest.go Produces + resolver.go resolveHTTP case).       <<<
              #
              # Until the Go changes land, the WAF plugin will reject this rule
              # at startup with "field http.tls_version is not in the active
              # scheme [unknown_field]". After the Go changes, the rule compiles
              # and is evaluated at line rate.
              #
              # Value semantics (post-handshake):
              #   - "TLSv1.0" / "TLSv1.1" → drop
              #   - "TLSv1.2" / "TLSv1.3" → passthrough
              #   - "" (missing)          → resolver returns unmatched, rule doesn't fire
              - name: drop_legacy_tls
                expression: 'http.tls_version eq "TLSv1.0" or http.tls_version eq "TLSv1.1"'
                action: drop

              # 3. CUSTOM FIELD: tag TLS 1.2 sessions with weak client cipher
              # (illustrative — depends on what the parser populates in the
              # custom field's payload). Same Go-side requirement as #2.
              - name: tag_weak_cipher
                expression: 'http.tls_version eq "TLSv1.2" and http.user_agent contains "curl/7."'
                action: tag

              # 4. Standard SQL injection — uses standard http.* field, no
              # custom extension required. Verifies the rule surface still works
              # alongside the custom-field rules.
              - name: block_sql_injection
                expression: 'http.raw_uri matches "(?i)(union[^+]*select|drop[^+]+table|or[^+]+1=1)"'
                action: drop

    outputs:
      - type: stdout    # print to stdout for debugging the new field
        format: json    # json | fail2ban; default: fail2ban

# ── Scoring ──────────────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50
  ban_threshold: 80
  observation_window: "300s"
  decay: "linear"

# ── Detectors ────────────────────────────────────────────────────────────────────────
detectors:

  probe:
    enabled: true
    score: 25
    paths:
      - "/.env"
      - "/.git/config"
      - "/wp-config.php"

  bruteforce:
    enabled: true
    min_requests: 10
    ratio_threshold: 0.6
    score: 30

  crawler:
    enabled: true
    min_sequential: 5
    score: 20

  noasset:
    enabled: true
    min_page_requests: 3
    asset_ratio_threshold: 0.1
    score: 20

  rate:
    enabled: true
    window: "60s"
    threshold: 100
    score: 25

  useragent:
    enabled: true
    scanner_score: 40
    grabber_score: 20
    automation_score: 15
    empty_ua_score: 30
    extra_scanner_patterns: []
    extra_grabber_patterns: []
    extra_automation_patterns: []

  overflow:
    enabled: true
    max_url_length: 2048
    score: 30

  badbot:
    enabled: true
    score: 60
    check_ua: true
    check_referrer: false

# ── Whitelist ────────────────────────────────────────────────────────────────────────
whitelist:
  custom:
    ips: []      # trusted individual IPs; list of strings
    cidrs: []    # trusted IP ranges; list of strings
    ua_substrings: []  # trusted UA substrings; list of strings
    paths: ["/healthz", "/.well-known/"]
