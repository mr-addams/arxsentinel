  #     batch_size: 10
  #     flush_interval: 30s
  #     reload_cmd: "nginx -s reload"
  #     dedup_window: "5m"              # skip re-banning same IP within this window; 0 = disabled

# ── inputs: universal log source syntax / универсальный синтаксис источников ────────────
#
# Alternative to general.log_file — supports multiple sources, stdin, and exec plugins.
# Used at top level (applies to implicit single-stream) or inside streams[].
# Альтернатива general.log_file — поддерживает несколько источников, stdin, exec-плагины.
#
# inputs:
#   - type: file
#     path: /var/log/nginx/access.log
#     parser: combined        # combined | json | regex; default: parser.log_format
#   - type: stdin             # read from stdin (e.g. pipe from journalctl -f)
#     parser: combined
#   - type: exec              # exec plugin: binary writes log lines to stdout
#     exec: /usr/local/lib/arxsentinel/plugins/my-source.sh
#     parser: json
#   - type: syslog            # network syslog receiver (RFC 3164 / RFC 5424)
#     addr: udp://0.0.0.0:5514  # scheme encodes transport: udp | tcp | unixgram | unix
#     parser: combined        # optional; inherits parser.log_format if omitted
#     # Nginx: access_log syslog:server=127.0.0.1:5514,facility=local7,tag=nginx combined;
#
#   # HTTP/HTTPS source — push mode (receive logs from vendors)
#   - type: http
#     addr: "http://0.0.0.0:8888"
#     protocol: plain
#
#   # Cloudflare Logpush (gzip NDJSON, ownership challenge handled automatically)
#   - type: http
#     addr: "http://0.0.0.0:8889"
#     protocol: cloudflare
#
#   # AWS Firehose HTTP endpoint (base64-encoded records, JSON ACK)
#   - type: http
#     addr: "http://0.0.0.0:8890"
#     protocol: firehose
#
#   # GCP Pub/Sub push (base64 message.data, 204 ACK)
#   - type: http
#     addr: "http://0.0.0.0:8891"
#     protocol: pubsub
#
#   # Loki push API (streams[].values[][], 204 ACK, protobuf rejected with 415)
#   - type: http
#     addr: "http://0.0.0.0:8892"
#     protocol: loki
#
#   # OTLP HTTP logs (resourceLogs[].logRecords[], 200 + partialSuccess)
#   - type: http
#     addr: "http://0.0.0.0:8893"
#     protocol: otlp
#
#   # Azure Monitor data export (JSON array, optional gzip)
#   - type: http
#     addr: "http://0.0.0.0:8894"
#     protocol: azure
#
#   # Splunk HEC (concatenated JSON objects, Success ACK)
#   - type: http
#     addr: "http://0.0.0.0:8895"
#     protocol: splunk
#
#   # NDJSON push with field extraction
#   - type: http
#     addr: "http://0.0.0.0:8896"
#     protocol: ndjson
#     envelope_field: message
#     token: "your-secret-token"
#
#   # HTTP pull mode — poll a remote endpoint every 30s
#   - type: http
#     mode: pull
#     url: "http://log-aggregator:9000/export"
#     protocol: plain
#     pull_interval: 30s
#
#   # HTTPS push with TLS
#   - type: http
#     addr: "https://0.0.0.0:8443"
#     protocol: plain
#     tls_cert: /etc/arxsentinel/tls/server.crt
#     tls_key: /etc/arxsentinel/tls/server.key

  # Sentinel (NCS) input — reads ThreatEvent from the in-process Named Channel Switch.
  # Sentinel-вход — читает ThreatEvent из Named Channel Switch того же процесса.
  #
  # Use case: pipeline A pushes ThreatEvents into the NCS via a `sentinel-threat`
  # sink (see outputs: below), pipeline B reads them back via this source. The two
  # YAML files can be one process, two streams[] blocks, or two separate daemons
  # that share the same NCS queue name.
  # Сценарий: pipeline A пушит ThreatEvent в NCS через sink `sentinel-threat`
  # (см. outputs: ниже), pipeline B читает их обратно через этот source. Два YAML
  # могут быть одним процессом, двумя streams[], или двумя отдельными демонами
  # с общим именем NCS-очереди.
  #
  # The address scheme `ncs://<queue-name>` MUST match the `name:` field of a
  # `sentinel-threat` sink that is registered first (pipeline startup registers
  # sinks before constructing sources, and the wiring validator rejects dangling
  # queues at startup).
  # Схема адреса `ncs://<queue-name>` ОБЯЗАНА совпадать с полем `name:` уже
  # зарегистрированного sink'а `sentinel-threat` (startup регистрирует sink'и
  # до source'ов, и валидатор wiring отвергает висячие очереди).
  #
  # - type: sentinel
  #   addr: ncs://inter-pipeline
  #
  # Cross-node variant (Distributed NCS, see transport: above): add `mode: raw` to
  # decode a raw-forwarded (unscored) *parser.LogEntry instead of a ThreatEvent, and
  # `queue: {type: transport, mode: recv}` to receive it from a remote node's transport
  # mesh instead of a local in-process sink. Full example: cookbook/distributed-ncs/.
  # Кросс-нодовый вариант (Distributed NCS, см. transport: выше): добавить `mode: raw`
  # для декодирования raw-forward (нескорированного) *parser.LogEntry вместо ThreatEvent,
  # и `queue: {type: transport, mode: recv}` для приёма от удалённого узла через
  # transport-сетку вместо локального in-process sink'а. Полный пример:
  # cookbook/distributed-ncs/.
  # - type: sentinel
  #   addr: ncs://edge-raw
  #   mode: raw
  #   queue:
  #     type: transport
  #     mode: recv

# ── outputs: universal threat sink syntax / универсальный синтаксис приёмников ──────────
#
# Alternative to output.threat_log — supports multiple sinks, stdout, and exec plugins.
# Used at top level or inside streams[].
# Альтернатива output.threat_log — поддерживает несколько приёмников, stdout, exec-плагины.
#
# outputs:
#   - type: file
#     path: /var/log/arxsentinel/threats.log
#     format: fail2ban        # fail2ban | json
#   - type: stdout            # print to stdout (useful for piping or debugging)
#     format: json
#   - type: sentinel-threat   # feed THREAT events to an executor via Named Channel Switch
#     name: sentinel-cf       # must match executor sources[].name above
#   # When a separate `sentinel` source reads from the SAME NCS name (see inputs:
#   # above, `type: sentinel`, `addr: ncs://<name>`), the two YAMLs form a
#   # pipeline-to-pipeline bridge: pipeline A writes ThreatEvents here, pipeline B
#   # reads them via its `sentinel` source and runs them through its own chain.
#   # Когда отдельный source `sentinel` читает из той же NCS-очереди (см. inputs:
#   # выше, `type: sentinel`, `addr: ncs://<name>`), два YAML образуют мост
#   # pipeline-to-pipeline: pipeline A пишет ThreatEvent сюда, pipeline B читает
#   # их через свой `sentinel` source и пропускает через свою цепочку.
#   - type: exec              # exec plugin: events written as JSON to plugin stdin
#     exec: /usr/local/lib/arxsentinel/plugins/my-sink.sh
#
# Cross-node raw-forward variant (Distributed NCS): pair `format: raw-line` on a
# `sentinel-threat` sink with `raw_forward: true` on the pipeline (below, under
# streams[].pipelines[]) and `queue: {type: transport, mode: send, peer: <host>}` —
# the pipeline parses each line but does NOT score it locally; the bare
# *parser.LogEntry is forwarded over the transport mesh to a remote node's own
# detector chain. Full example: cookbook/distributed-ncs/.
# Кросс-нодовый raw-forward вариант (Distributed NCS): сочетание `format: raw-line`
# на sink'е `sentinel-threat` с `raw_forward: true` на pipeline (ниже, в
# streams[].pipelines[]) и `queue: {type: transport, mode: send, peer: <host>}` —
# pipeline парсит строку, но НЕ скорит её локально; голый *parser.LogEntry
# пробрасывается через transport-сетку в детекторную цепочку удалённого узла.
# Полный пример: cookbook/distributed-ncs/.
#   - type: sentinel-threat
#     name: edge-raw
#     format: raw-line
#     queue:
#       type: transport
#       mode: send
#       peer: "node-b.example.net:4097"

# ── streams: multi-stream mode / мультистрим-режим ───────────────────────────────────────
#
# Use streams: when monitoring multiple independent log sources.
# Mutually exclusive with general.log_file — remove general.log_file when using streams.
# Each stream has isolated scoring, state, and output.
# Используй streams: для мониторинга нескольких независимых источников.
#
# streams:
#
#   # ── Simple stream: single source → single sink ────────────────────────────────
#   # Auto-wraps inputs/outputs into one pipeline internally.
#   - name: nginx
#     inputs:
#       - type: file
#         path: /var/log/nginx/access.log
#         parser: combined
#     outputs:
#       - type: file
#         path: /var/log/arxsentinel/nginx-threats.log
#         format: fail2ban
#
#   # ── Advanced stream: explicit pipelines with shared IP state ──────────────────
#   # Use pipelines: when you need per-source detector tuning or shared scoring.
#   # tracker_group: pipelines with the same group name share one IP score tracker.
#   - name: frontend
#     pipelines:
#       - name: api
#         tracker_group: frontend       # share IP state with "static" pipeline
#         inputs:
#           - type: file
#             path: /var/log/nginx/api.access.log
#             parser: combined
#         outputs:
#           - type: file
#             path: /var/log/arxsentinel/frontend-threats.log
#             format: fail2ban
#         detectors:
#           rate:
#             enabled: true
#             threshold: 200            # higher limit for API traffic
#           probe:
#             enabled: true
#       - name: static
#         tracker_group: frontend       # same group → shared IP scoring with "api"
#         inputs:
#           - type: file
#             path: /var/log/nginx/static.access.log
#             parser: combined
#         outputs:
#           - type: file
#             path: /var/log/arxsentinel/frontend-threats.log
#             format: fail2ban
#         detectors:
#           rate:
#             enabled: false            # static assets generate high rates — disable
#           probe:
#             enabled: true
#
#   # ── Exec plugin stream: external source and sink via plugin binary ─────────────
#   # Use when your log format is not supported by built-in parsers.
#   - name: custom-app
#     inputs:
#       - type: exec
#         exec: /usr/local/lib/arxsentinel/plugins/app-log-source.sh
#         parser: json
#     outputs:
#       - type: exec
#         exec: /usr/local/lib/arxsentinel/plugins/custom-sink.sh
