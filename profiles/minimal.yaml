# Profile: minimal — log aggregation only, no security plugins.
# Subset of the 12 blank-import transports; arx-core only.
name: minimal
description: "Minimal arxsentinel build — syslog/stdin sources and stdout sink for log aggregation."
plugins:
  executors:
    - name: cloudflare
      module: arxsentinel
  detectors:
    - name: probe
    - name: rate
    - name: bruteforce
    - name: overflow
  sources:
    - name: syslog
      module: arx-core
    - name: stdin
      module: arx-core
  sinks:
    - name: stdout
      module: arx-core
