version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: nginx-sentinel
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      # Инъекция версии из git-тега; -s -w убирают debug-символы (меньше бинарник).
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: nginx-sentinel-deb
    package_name: nginx-sentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/nginx-sentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: MIT
    formats:
      - deb

    dependencies:
      - fail2ban

    recommends:
      - nginx

    # bindir: куда горелизер кладёт сам бинарник из секции builds
    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/postinst
      preremove:   packaging/scripts/prerm
      postremove:  packaging/scripts/postrm

    contents:
      # Пример конфига — apt не перезапишет при апгрейде (type: config)
      - src: config.yaml
        dst: /etc/nginx-sentinel/config.yaml.example
        type: config

      # Systemd юнит с путём /usr/bin/ (отличается от deploy/ где /usr/local/bin/)
      - src: packaging/nginx-sentinel.service
        dst: /lib/systemd/system/nginx-sentinel.service

      # Fail2Ban — конфиги помечены как config чтобы apt предлагал merge при изменениях
      - src: deploy/fail2ban/filter.d/nginx-sentinel.conf
        dst: /etc/fail2ban/filter.d/nginx-sentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/nginx-sentinel.conf
        dst: /etc/fail2ban/jail.d/nginx-sentinel.conf
        type: config

      # Logrotate
      - src: deploy/logrotate/nginx-sentinel
        dst: /etc/logrotate.d/nginx-sentinel
        type: config

release:
  github:
    owner: mr-addams
    name: nginx-sentinel
  # .deb артефакты nfpm горелизер добавляет в релиз автоматически — extra_files не нужен.

checksum:
  name_template: "checksums.txt"
