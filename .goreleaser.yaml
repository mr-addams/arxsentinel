version: 2

before:
  hooks:
    - go mod tidy

builds:
  - binary: arxsentinel
    main: ./cmd/arxsentinel
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      # Injects version from git tag; -s -w strip debug symbols to reduce binary size.
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: arxsentinel-deb
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: MIT
    formats:
      - deb

    recommends:
      - nginx
      - fail2ban

    # bindir: installation path for the binary produced by the builds section.
    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/postinst
      preremove:   packaging/scripts/prerm
      postremove:  packaging/scripts/postrm

    contents:
      # .example is a reference file — always overwritten on upgrade (unlike the real config).
      - src: config.nginx-example.yaml
        dst: /etc/arxsentinel/config.yaml.example

      # Systemd unit uses /usr/bin/ (differs from deploy/ scripts which use /usr/local/bin/).
      - src: packaging/arxsentinel.service
        dst: /lib/systemd/system/arxsentinel.service

      # type: config causes apt to offer a merge prompt when these files are modified locally.
      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

  - id: arxsentinel-rpm
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: MIT
    formats:
      - rpm

    recommends:
      - nginx
      - fail2ban

    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/rpm/postinst
      preremove:   packaging/scripts/rpm/prerm
      postremove:  packaging/scripts/rpm/postrm

    contents:
      - src: config.nginx-example.yaml
        dst: /etc/arxsentinel/config.yaml.example

      # RPM/systemd convention: /usr/lib/systemd/system/ (not /lib/)
      - src: packaging/arxsentinel.service
        dst: /usr/lib/systemd/system/arxsentinel.service

      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

  - id: arxsentinel-pacman
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: MIT
    formats:
      - archlinux

    recommends:
      - nginx
      - fail2ban

    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/arch/postinst
      preremove:   packaging/scripts/arch/prerm
      postremove:  packaging/scripts/arch/postrm

    contents:
      - src: config.nginx-example.yaml
        dst: /etc/arxsentinel/config.yaml.example

      # Arch Linux systemd convention: /usr/lib/systemd/system/
      - src: packaging/arxsentinel.service
        dst: /usr/lib/systemd/system/arxsentinel.service

      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

dockers_v2:
  - dockerfile: deploy/container/docker/Dockerfile.goreleaser
    images:
      - "ghcr.io/mr-addams/arxsentinel"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # extra_files are copied into the build context preserving their relative path from the project root.
    # Required because dockers_v2 uses a temp dir (not project root) as the build context.
    extra_files:
      - deploy/container/docker/config.docker.yaml
    labels:
      "org.opencontainers.image.title": "arxsentinel"
      "org.opencontainers.image.description": "nginx access log analyzer with Fail2Ban integration"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .Commit }}"
      "org.opencontainers.image.source": "https://github.com/mr-addams/arxsentinel"
      "org.opencontainers.image.licenses": "MIT"

release:
  github:
    owner: mr-addams
    name: arxsentinel
  prerelease: auto
  replace_existing_artifacts: true
  # nfpm .deb artifacts are attached to the release automatically — extra_files not needed.

checksum:
  name_template: "checksums.txt"
