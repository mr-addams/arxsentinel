version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: arxsentinel
    # id: explicit so the archives: entry can reference this build by name.
    # goreleaser uses the binary name as the default id when id: is absent;
    # making it explicit pins the reference for the FreeBSD-side archives filter.
    binary: arxsentinel
    main: ./cmd/arxsentinel
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
      - riscv64
      - 386
    goarm:
      - "7"
    env:
      - CGO_ENABLED=0
    ldflags:
      # Injects version from git tag; -s -w strip debug symbols to reduce binary size.
      - -s -w -X main.version={{.Version}}

  # ── FreeBSD builds (Flow 090, DECISIONS.md Decision 2) ──────────────────────────
  # Separate entry (NOT extension of the Linux entry) so per-OS divergence is
  # isolated. Never riscv64 (Go toolchain does not support freebsd/riscv64 —
  # tribal knowledge from Flows 088/089). No goarm field — FreeBSD/arm uses
  # a single hard-float target, no softp/hardp selection knob.
  - id: arxsentinel-freebsd
    binary: arxsentinel
    main: ./cmd/arxsentinel
    goos:
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}

nfpms:
  - id: arxsentinel-deb
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: Elastic-2.0
    formats:
      - deb

    recommends:
      - nginx
      - fail2ban

    # bindir: installation path for the binary produced by the builds section.
    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/postinst
      preremove:   packaging/scripts/prerm
      postremove:  packaging/scripts/postrm

    contents:
      # Default quick-start config (nginx → fail2ban, simplest setup)
      - src: cookbook/fail2ban/nginx-basic.yaml
        dst: /etc/arxsentinel/config.yaml.example
      # Full cookbook: all ready-to-use recipes
      - src: cookbook/
        type: tree
        dst: /usr/share/arxsentinel/
      # Full reference with all configuration options
      - src: cookbook/config.reference.yaml
        dst: /etc/arxsentinel/config.reference.yaml

      # Systemd unit uses /usr/bin/ (differs from deploy/ scripts which use /usr/local/bin/).
      - src: packaging/arxsentinel.service
        dst: /lib/systemd/system/arxsentinel.service

      # type: config causes apt to offer a merge prompt when these files are modified locally.
      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

  - id: arxsentinel-rpm
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: Elastic-2.0
    formats:
      - rpm

    recommends:
      - nginx
      - fail2ban

    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/rpm/postinst
      preremove:   packaging/scripts/rpm/prerm
      postremove:  packaging/scripts/rpm/postrm

    contents:
      # Default quick-start config (nginx → fail2ban, simplest setup)
      - src: cookbook/fail2ban/nginx-basic.yaml
        dst: /etc/arxsentinel/config.yaml.example
      # Full cookbook: all ready-to-use recipes
      - src: cookbook/
        type: tree
        dst: /usr/share/arxsentinel/
      # Full reference with all configuration options
      - src: cookbook/config.reference.yaml
        dst: /etc/arxsentinel/config.reference.yaml

      # RPM/systemd convention: /usr/lib/systemd/system/ (not /lib/)
      - src: packaging/arxsentinel.service
        dst: /usr/lib/systemd/system/arxsentinel.service

      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

  - id: arxsentinel-pacman
    package_name: arxsentinel
    vendor: mr-addams
    homepage: https://github.com/mr-addams/arxsentinel
    maintainer: mr.addams <mr.addams@gmail.com>
    description: nginx access log analyzer with automatic Fail2Ban integration
    license: Elastic-2.0
    formats:
      - archlinux

    recommends:
      - nginx
      - fail2ban

    bindir: /usr/bin

    scripts:
      postinstall: packaging/scripts/arch/postinst
      preremove:   packaging/scripts/arch/prerm
      postremove:  packaging/scripts/arch/postrm

    contents:
      # Default quick-start config (nginx → fail2ban, simplest setup)
      - src: cookbook/fail2ban/nginx-basic.yaml
        dst: /etc/arxsentinel/config.yaml.example
      # Full cookbook: all ready-to-use recipes
      - src: cookbook/
        type: tree
        dst: /usr/share/arxsentinel/
      # Full reference with all configuration options
      - src: cookbook/config.reference.yaml
        dst: /etc/arxsentinel/config.reference.yaml

      # Arch Linux systemd convention: /usr/lib/systemd/system/
      - src: packaging/arxsentinel.service
        dst: /usr/lib/systemd/system/arxsentinel.service

      - src: deploy/fail2ban/filter.d/arxsentinel.conf
        dst: /etc/fail2ban/filter.d/arxsentinel.conf
        type: config

      - src: deploy/fail2ban/jail.d/arxsentinel.conf
        dst: /etc/fail2ban/jail.d/arxsentinel.conf
        type: config

      - src: deploy/logrotate/arxsentinel
        dst: /etc/logrotate.d/arxsentinel
        type: config

# ── archives (Flow 090, DECISIONS.md Decision 3) ─────────────────────────────────
# Two entries: (1) linux-archive explicitly pins the Linux tar.gz behaviour that
# was previously implicit goreleaser-default; (2) freebsd-archive adds the
# FreeBSD tar.gz with bundled install.sh + rc.d script + cookbook/config sample.
# The Linux entry exists to make git-diff audit possible: the post-change dist/
# Linux archive checksums MUST match the pre-change baseline byte-for-byte
# (control snapshot at .tmp/090-control-snapshot.txt).
archives:
  # linux-archive — explicit pin of the previous implicit behaviour.
  # Verbatim name_template = goreleaser implicit default (verified via the
  # control snapshot's filenames: arxsentinel_<version>_linux_<arch>.tar.gz).
  # No files: extra — same single-binary tarball the implicit default produced.
  - id: linux-archive
    ids:
      - arxsentinel
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}{{ if not (eq .Amd64 \"v1\") }}{{ .Amd64 }}{{ end }}"
    formats:
      - tar.gz

  # freebsd-archive — bundles install.sh + rc.d script + cookbook/config.
  # NO nfpm-equivalent on FreeBSD (goreleaser nfpm supports only deb/rpm/apk/
  # archlinux — pkg is not in the list). tar.gz + install.sh is the only
  # realistic goreleaser-native path (DECISIONS.md Decision 3).
  - id: freebsd-archive
    ids:
      - arxsentinel-freebsd
    name_template: "{{ .ProjectName }}_{{ .Version }}_freebsd_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      # install.sh + rc.d script bundled at archive root with explicit dst
      # filenames (goreleaser treats dst: "." as a literal directory name and
      # ends up flattening duplicates — verified empirically in a previous
      # iteration. Using explicit destination filenames is the safe path.)
      - src: packaging/freebsd/install.sh
        dst: install.sh
      - src: packaging/freebsd/arxsentinel.rc
        dst: arxsentinel.rc
      # Cookbook + reference config — bundled at the paths install.sh expects.
      # install.sh looks at `./cookbook/nginx-basic.yaml` (flattened from
      # cookbook/fail2ban/nginx-basic.yaml in the repo tree — the archive
      # carries one-level-flattened cookbook to keep the installer's relative
      # path expectations stable).
      - src: cookbook/fail2ban/nginx-basic.yaml
        dst: cookbook/nginx-basic.yaml
      - src: cookbook/config.reference.yaml
        dst: config.reference.yaml

dockers_v2:
  - dockerfile: deploy/container/docker/Dockerfile.goreleaser
    images:
      - "ghcr.io/mr-addams/arxsentinel"
    tags:
      - "{{ .Tag }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/arm/v7
    # Disable provenance attestation: buildx adds it by default, and GHCR renders
    # it as a spurious "unknown/unknown" platform entry in the package page.
    flags:
      - "--provenance=false"
    # extra_files are copied into the build context preserving their relative path from the project root.
    # Required because dockers_v2 uses a temp dir (not project root) as the build context.
    extra_files:
      - deploy/container/docker/config.docker.yaml
    labels:
      "org.opencontainers.image.title": "arxsentinel"
      "org.opencontainers.image.description": "nginx access log analyzer with Fail2Ban integration"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .Commit }}"
      "org.opencontainers.image.source": "https://github.com/mr-addams/arxsentinel"
      "org.opencontainers.image.licenses": "Elastic-2.0"

release:
  github:
    owner: mr-addams
    name: arxsentinel
  prerelease: auto
  replace_existing_artifacts: true
  # nfpm .deb artifacts are attached to the release automatically — extra_files not needed.

checksum:
  name_template: "checksums.txt"
