services:

  # blocklist-server: nginx serving pattern files fetched from real upstream sources.
  # Reuses nginx:latest (already pulled for other services — no extra Docker Hub pull).
  # blocklist/ is created by run.sh before docker compose up; mounted read-only here.
  # nginx default config serves files from /usr/share/nginx/html at the root path.
  # Sentinels run on the host, so port 8090 is exposed on localhost.
  blocklist-server:
    image: nginx:latest
    ports:
      - "8090:80"
    volumes:
      - ./blocklist:/usr/share/nginx/html:ro

  # php-fpm: processes .php requests forwarded from nginx.
  php-fpm:
    image: php:8-fpm-alpine
    volumes:
      - ./webapp:/var/www/html:ro

  # Backend: nginx serves real 200/404 responses with static + PHP content.
  # Also acts as upstream for traefik, caddy, and haproxy.
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/var/www/html:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php-fpm

  apache:
    image: httpd:latest
    ports:
      - "8082:80"
    volumes:
      - ./configs/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./logs/apache:/var/log/apache2

  traefik:
    image: traefik:latest
    ports:
      - "8083:80"
    volumes:
      - ./configs/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik-routes.yml:/etc/traefik/routes.yml:ro
      - ./logs/traefik:/var/log/traefik
    depends_on:
      - nginx
      - apache-proxy
      - traefik-backend
      - caddy-backend
      - haproxy-backend
      - litespeed-backend

  caddy:
    build:
      context: .
      dockerfile: dockerfiles/Caddy.Dockerfile
    ports:
      - "8084:80"
    volumes:
      - ./configs/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs/caddy:/var/log/caddy
    depends_on:
      - nginx
      - apache-proxy
      - traefik-backend
      - caddy-backend
      - haproxy-backend
      - litespeed-backend

  haproxy:
    image: haproxy:latest
    ports:
      - "8085:80"
    volumes:
      - ./configs/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx
      - apache-proxy
      - traefik-backend
      - caddy-backend
      - haproxy-backend
      - litespeed-backend
    # stdout captured by run.sh → logs/haproxy/access.log

  # nginx-rp: nginx acting as a reverse proxy (4th proxy for proxy-chain tests).
  # Routes /backend-<name>/ to each trusted backend; sets X-Forwarded-For.
  nginx-rp:
    image: nginx:latest
    ports:
      - "8086:80"
    volumes:
      - ./configs/nginx-rp.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx
      - apache-proxy
      - traefik-backend
      - caddy-backend
      - haproxy-backend
      - litespeed-backend

  # litespeed: OpenLiteSpeed serving the webapp.
  # OLS docker template uses /var/www/vhosts/localhost/html as docRoot and writes
  # access logs to logs/localhost.access.log — no config override needed.
  # PHP is served via the built-in lsphp LSAPI handler.
  litespeed:
    image: litespeedtech/openlitespeed:latest
    ports:
      - "8087:80"
    volumes:
      - ./webapp:/var/www/vhosts/localhost/html:ro
      - ./logs/litespeed:/usr/local/lsws/logs

  # ── Proxy-chain backends ───────────────────────────────────────────────────────────────
  # Each backend trusts X-Forwarded-For from the Docker proxy subnet (172.16.0.0/12)
  # and logs the real attacker IP.

  # apache-proxy: Apache with mod_remoteip — %h resolves to the XFF client IP.
  apache-proxy:
    image: httpd:latest
    volumes:
      - ./configs/httpd-proxy.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./logs/apache-proxy:/var/log/apache2

  # traefik-backend: Traefik with forwardedHeaders.trustedIPs — logs real client IP in CLF.
  traefik-backend:
    image: traefik:latest
    volumes:
      - ./configs/traefik-backend.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik-backend-routes.yml:/etc/traefik/routes.yml:ro
      - ./logs/traefik-proxy:/var/log/traefik
    depends_on:
      - nginx

  # caddy-backend: Caddy logging X-Forwarded-For header as client IP field in CLF.
  caddy-backend:
    build:
      context: .
      dockerfile: dockerfiles/Caddy.Dockerfile
    volumes:
      - ./configs/Caddyfile-backend:/etc/caddy/Caddyfile:ro
      - ./logs/caddy-proxy:/var/log/caddy
    depends_on:
      - nginx

  # haproxy-backend: HAProxy with custom log-format using XFF instead of %ci.
  # stdout captured by run.sh → logs/haproxy-proxy/access.log
  haproxy-backend:
    image: haproxy:latest
    volumes:
      - ./configs/haproxy-backend.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - nginx

  # litespeed-backend: OpenLiteSpeed with useIpInHeader enabled so the access log
  # records the real attacker IP from X-Forwarded-For, not the proxy container IP.
  # Dockerfile patches /usr/local/lsws/conf/httpd_config.conf at build time.
  litespeed-backend:
    build:
      context: .
      dockerfile: dockerfiles/LiteSpeedBackend.Dockerfile
    volumes:
      - ./webapp:/var/www/vhosts/localhost/html:ro
      - ./logs/litespeed-proxy:/usr/local/lsws/logs

  # ── Chain guard test infrastructure ───────────────────────────────────────────────────

  # cloudflare-sim: simulates Cloudflare edge node behavior.
  # Replaces X-Forwarded-For with $remote_addr (Cloudflare replaces, not appends).
  # Adds CF-Connecting-IP header. Routes to backends and existing proxies.
  #
  # Attached to both networks so that:
  #   - backends/proxies reach it via the default compose network (172.18.0.0/16)
  #   - CF attacker containers use cf_ext_net (10.88.0.0/24) whose IPs fall outside
  #     the trusted 172.16.0.0/12 range — backends then correctly identify the
  #     attacker IP rather than falling back to cloudflare-sim's IP.
  cloudflare-sim:
    image: nginx:latest
    ports:
      - "8089:80"
    volumes:
      - ./configs/nginx-cf-sim.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - cf_ext_net
    depends_on:
      - nginx
      - apache-proxy
      - traefik-backend
      - caddy-backend
      - haproxy-backend
      - litespeed-backend
      - traefik
      - caddy
      - haproxy
      - nginx-rp
      - nginx-bare

  # cf-api-mock: simulates Cloudflare API for integration test of CF executor.
  cf-api-mock:
    build:
      context: ./cf-api-mock
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    networks:
      - default

  # ros-api-mock: simulates MikroTik RouterOS REST API for integration test of ROS executor.
  ros-api-mock:
    build:
      context: ./ros-api-mock
      dockerfile: Dockerfile
    ports:
      - "8093:8080"
    networks:
      - default

  # ubus-api-mock: simulates OpenWrt uhttpd-mod-ubus JSON-RPC endpoint for integration
  # test of the openwrt executor. Exposes POST /ubus (session.login, uci.*, rc.init),
  # GET /recorded-items (recorded entries + call counters) and POST /reset.
  ubus-api-mock:
    build:
      context: ./ubus-api-mock
      dockerfile: Dockerfile
    ports:
      - "8094:8080"
    networks:
      - default

  # nginx-bare: nginx without real_ip extraction — logs the proxy IP, not the attacker IP.
  # Used for the "broken chain" test: cloudflare-sim IP appears as client in access log.
  # The chain_guard cloudflare-leak check must fire on these entries.
  nginx-bare:
    image: nginx:latest
    volumes:
      - ./configs/nginx-bare.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/var/www/html:ro
      - ./logs/nginx-bare:/var/log/nginx

  # bogon-injector: simulates an uncontrolled proxy that injects a bogon IP in X-Forwarded-For.
  # Routes all traffic to nginx-bogon-victim with XFF forced to 10.0.0.1.
  bogon-injector:
    image: nginx:latest
    volumes:
      - ./configs/nginx-bogon-injector.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nginx-bogon-victim

  # nginx-bogon-victim: nginx that trusts XFF from Docker subnet.
  # When bogon-injector sets XFF=10.0.0.1, this server logs 10.0.0.1 as client IP.
  # The chain_guard bogon check must fire on these entries.
  nginx-bogon-victim:
    image: nginx:latest
    volumes:
      - ./configs/nginx-bogon-victim.conf:/etc/nginx/nginx.conf:ro
      - ./webapp:/var/www/html:ro
      - ./logs/nginx-bogon-victim:/var/log/nginx

networks:
  # cf_ext_net: isolated subnet for CF attacker containers.
  # 10.88.0.0/24 is outside the trusted proxy range (172.16.0.0/12), so backends
  # using real_ip_recursive correctly identify attacker IPs instead of falling back
  # to cloudflare-sim's IP when every address in the XFF chain is "trusted".
  cf_ext_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.0.0/24
