events {}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx-bogon-victim: nginx that trusts X-Forwarded-For from the Docker bridge subnet.
    #
    # set_real_ip_from covers 172.16.0.0/12 — the Docker bridge range where bogon-injector
    # lives. When bogon-injector sets XFF=10.0.0.1, ngx_http_realip_module replaces
    # $remote_addr with 10.0.0.1 and that gets logged in the access log.
    #
    # The bogon-victim sentinel sees 10.0.0.1 as client IP and fires
    # CHAIN_WARN bogon-ip-as-client — proving the bogon injection detection works.

    # sentinel log format: appends $remote_addr as the 9th field so CombinedParser
    # can ingest the log. With real_ip_header configured, $remote_addr here is the
    # resolved real IP (10.0.0.1 from XFF), which is what bogon-victim sentinel checks.
    # log_format must be in the http{} block — not inside server{}.
    log_format bogon_sentinel '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" "$remote_addr"';

    server {
        listen 80;
        root  /var/www/html;
        index index.html;

        # Trust XFF from Docker bridge subnet (covers bogon-injector container IP).
        set_real_ip_from  172.16.0.0/12;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        access_log /var/log/nginx/access.log bogon_sentinel;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
