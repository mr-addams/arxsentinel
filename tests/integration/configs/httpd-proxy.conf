ServerRoot "/usr/local/apache2"
Listen 80

LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule unixd_module       modules/mod_unixd.so
# mod_remoteip: replaces %h (client IP in logs) with the real IP from the
# trusted X-Forwarded-For header. Without this, %h = proxy container IP.
LoadModule remoteip_module    modules/mod_remoteip.so

User www-data
Group www-data

ErrorLog /proc/1/fd/2
LogLevel warn

# RemoteIPHeader: which header carries the real client IP.
# RemoteIPInternalProxy: treat Docker compose network (172.16.0.0/12) as internal.
# Internal proxies have their XFF headers fully trusted; %h reflects the forwarded IP.
RemoteIPHeader         X-Forwarded-For
RemoteIPInternalProxy  172.16.0.0/12

# combined format: %h resolves to real client IP after mod_remoteip processing.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /var/log/apache2/access.log combined

DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>
