events {}

http {
    # nginx-cf-sim: simulates Cloudflare edge node behavior for integration tests.
    #
    # Key difference from a normal proxy:
    #   Cloudflare REPLACES X-Forwarded-For with $remote_addr (the browser's real IP),
    #   rather than appending to an existing XFF chain. This is intentional — Cloudflare
    #   is always the first proxy and does not trust any prior XFF value.
    #
    # Also adds CF-Connecting-IP — the canonical Cloudflare header for the real client IP.
    # Backends behind Cloudflare should use CF-Connecting-IP (or real_ip_header CF-Connecting-IP)
    # rather than X-Forwarded-For to get the real visitor IP.
    #
    # Routes:
    #   Case 1: CF -> product directly (backends receive requests with CF headers set)
    #   Case 2: CF -> our proxy (proxy adds its own XFF on top of CF's replacement)
    #   Case 3A: CF -> nginx-bare (no real_ip extraction — logs cloudflare-sim IP)

    server {
        listen 80;

        # Cloudflare replaces XFF with the real client IP — does not append.
        # All routes share these header overrides so every upstream sees CF headers.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header Host             $host;

        # ── Case 1: CF → product directly ────────────────────────────────────────────────
        # Each backend serves static content and logs access. Sentinels watching these
        # backends expect to see the cloudflare-sim container IP as client IP in
        # broken-chain scenarios (Case 3A). In correct-chain scenarios (Cases 1 and 2),
        # backends must be configured with real_ip_header CF-Connecting-IP.

        location /cf-nginx/ {
            proxy_pass http://nginx:8080/;
        }

        location /cf-apache/ {
            proxy_pass http://apache-proxy:80/;
        }

        location /cf-traefik/ {
            proxy_pass http://traefik-backend:80/;
        }

        location /cf-caddy/ {
            proxy_pass http://caddy-backend:80/;
        }

        location /cf-haproxy/ {
            proxy_pass http://haproxy-backend:80/;
        }

        location /cf-litespeed/ {
            proxy_pass http://litespeed-backend:80/;
        }

        # ── Case 2: CF → our proxy → product ─────────────────────────────────────────────
        # Traffic goes through an intermediate proxy (traefik/caddy/haproxy/nginx-rp).
        # The proxy adds its own forwarding headers on top of what CF sent.
        # Backends see a two-hop XFF chain: CF-client, proxy-IP.

        location /cf-chain-traefik/ {
            proxy_pass http://traefik:80/;
        }

        location /cf-chain-caddy/ {
            proxy_pass http://caddy:80/;
        }

        location /cf-chain-haproxy/ {
            proxy_pass http://haproxy:80/;
        }

        location /cf-chain-nginx-rp/ {
            proxy_pass http://nginx-rp:80/;
        }

        # ── Case 3A: CF → nginx-bare (broken chain) ───────────────────────────────────────
        # nginx-bare has no real_ip_header configuration — it logs $remote_addr from the
        # TCP connection, which is the cloudflare-sim container IP (a 172.16/12 address).
        # The cf-broken sentinel must detect this as cloudflare-ip-as-client.

        location /cf-bare/ {
            proxy_pass http://nginx-bare:80/;
        }
    }
}
