events {}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # nginx-bare: intentionally misconfigured nginx with no real_ip extraction.
    #
    # Purpose: simulates a server sitting behind Cloudflare that has NOT been configured
    # with real_ip_header CF-Connecting-IP. As a result, $remote_addr holds the
    # cloudflare-sim container IP (172.16/12), not the real visitor IP.
    #
    # The cf-broken sentinel detects this: the logged IP falls within the Cloudflare
    # CIDR list → CHAIN_WARN cloudflare-ip-as-client fires.
    #
    # No set_real_ip_from, no real_ip_header — $remote_addr holds the TCP peer IP
    # (the cloudflare-sim container IP). The sentinel log format appends $remote_addr
    # as the 9th field (normally "$real_ip") so the CombinedParser can ingest the log.
    # Using $remote_addr as the 9th field is correct here: without real_ip_header
    # configured, the "real" client IP is the TCP peer — cloudflare-sim's IP.
    log_format sentinel '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" "$remote_addr"';

    access_log /var/log/nginx/access.log sentinel;

    server {
        listen 80;
        root  /var/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
