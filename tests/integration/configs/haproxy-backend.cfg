# HAProxy config for proxy-chain integration tests (backend role).
# Custom log-format: replaces %ci (direct client IP = proxy IP) with
# %[req.fhdr(X-Forwarded-For)] so the log records the real attacker IP.
# The port field (%cp) is kept so the format matches haproxy-http parser regex:
#   ^(?P<remote_addr>[^:]+):\d+ \[time\] ...

global
    log stdout len 8192 format raw local0 info
    maxconn 1000
    tune.http.logurilen 2048

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:80
    # Capture X-Forwarded-For into a txn variable at HTTP request phase.
    # Using a txn variable avoids the "req.fhdr in log-format" reliability error
    # in HAProxy 3.x — req.fhdr may not be available at logging time, but
    # txn variables set via http-request are always available.
    http-request set-var(txn.client_ip) req.fhdr(X-Forwarded-For)
    # Custom log-format: txn.client_ip (real attacker IP from XFF) replaces the
    # direct peer IP (%ci). Port (%cp) is kept so the format matches haproxy-http
    # parser regex: ^(?P<remote_addr>[^:]+):\d+ ...
    log-format "%[var(txn.client_ip)]:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}r"
    default_backend nginx-backend

backend nginx-backend
    option http-server-close
    server nginx nginx:80 check
