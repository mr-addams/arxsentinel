events {}

http {
    # nginx-bogon-injector: simulates a malicious or misconfigured upstream proxy
    # that injects a bogon (RFC 1918) IP address into X-Forwarded-For.
    #
    # In real attacks: an attacker controls a proxy upstream and sets XFF to a
    # private IP they choose. If the backend trusts XFF from this proxy, it logs
    # the bogon IP as the client — making all IP-based threat detection useless.
    #
    # The injector sets XFF to 10.0.0.1 (RFC 1918 — bogon). When nginx-bogon-victim
    # reads this via real_ip_header and logs it, the bogon-victim sentinel fires
    # CHAIN_WARN bogon-ip-as-client.

    server {
        listen 80;

        # Force XFF to a bogon address — overwrite any existing value from upstream.
        # 10.0.0.1 is RFC 1918 and will always match the bogon checker.
        proxy_set_header X-Forwarded-For 10.0.0.1;
        proxy_set_header X-Real-IP       10.0.0.1;
        proxy_set_header Host            $host;

        location / {
            proxy_pass http://nginx-bogon-victim:80/;
        }
    }
}
