# HAProxy config for integration tests.
# Logs to stdout using "format raw" — strips syslog framing so lines match
# the haproxy-http parser format exactly. run.sh captures stdout to a file.

global
    # len 8192: default log line limit is 1024 (syslog legacy). Overflow detector
    # needs URL > 2048 chars in the log — without this, the line is silently truncated.
    log stdout len 8192 format raw local0 info
    maxconn 1000
    # tune.http.logurilen controls how much of the request URI ends up in the log line.
    # Default is 1024; raise to 4096 so the full overflow URL survives.
    tune.http.logurilen 4096

defaults
    mode http
    log global
    # "option httplog" produces the format sentinel's haproxy-http profile expects.
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:80
    # forwardfor: append client IP to X-Forwarded-For before forwarding to backends.
    # Required for proxy-chain tests — without this, backends receive no XFF header.
    option forwardfor

    # Path-based routing for proxy-chain tests.
    # replace-path in each backend strips the prefix before forwarding.
    acl is_backend_nginx    path_beg /backend-nginx
    acl is_backend_apache   path_beg /backend-apache
    acl is_backend_traefik  path_beg /backend-traefik
    acl is_backend_caddy    path_beg /backend-caddy
    acl is_backend_haproxy  path_beg /backend-haproxy

    use_backend bk-nginx-backend    if is_backend_nginx
    use_backend bk-apache-proxy     if is_backend_apache
    use_backend bk-traefik-backend  if is_backend_traefik
    use_backend bk-caddy-backend    if is_backend_caddy
    use_backend bk-haproxy-backend  if is_backend_haproxy

    default_backend nginx-backend

# nginx backend — real 200/404 responses for direct (non-chain) tests.
backend nginx-backend
    option http-server-close
    server nginx nginx:80 check

# ── Proxy-chain backends ─────────────────────────────────────────────────────────────────
# replace-path strips /backend-<name>/ prefix before forwarding.

backend bk-nginx-backend
    http-request replace-path /backend-nginx/(.*)   /\1
    server nginx-back nginx:8080 check

backend bk-apache-proxy
    http-request replace-path /backend-apache/(.*)  /\1
    server apache-back apache-proxy:80 check

backend bk-traefik-backend
    http-request replace-path /backend-traefik/(.*) /\1
    server traefik-back traefik-backend:80 check

backend bk-caddy-backend
    http-request replace-path /backend-caddy/(.*)   /\1
    server caddy-back caddy-backend:80 check

backend bk-haproxy-backend
    http-request replace-path /backend-haproxy/(.*) /\1
    server haproxy-back haproxy-backend:80 check
