events {}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # combined + real_ip field — required by arxsentinel's CombinedParser.
    # Without ngx_realip, $remote_addr is repeated as the real_ip placeholder.
    log_format sentinel '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" "$remote_addr"';
    access_log /var/log/nginx/access.log sentinel;

    server {
        listen 80;
        root  /var/www/html;
        index index.html;

        # Static assets — real 200 responses.
        location ~* \.(css|js|json)$ {
            try_files $uri =404;
        }

        # PHP via php-fpm.
        location ~ \.php$ {
            try_files      $uri =404;
            fastcgi_pass   php-fpm:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        # Everything else: serve file or return real 404.
        # Probe paths (/.env, /wp-login.php, ...) land here and get 404.
        location / {
            try_files $uri $uri/ =404;
        }
    }

    # Proxy-trusted backend — listens on 8080 for proxy-chain integration tests.
    # ngx_http_realip_module restores the real client IP from X-Forwarded-For.
    # Only trusts the Docker compose network (172.16.0.0/12).
    server {
        listen 8080;
        root  /var/www/html;
        index index.html;

        set_real_ip_from  172.16.0.0/12;
        real_ip_header    X-Forwarded-For;
        real_ip_recursive on;

        # sentinel format: $remote_addr is replaced by ngx_realip with the real client IP
        # from X-Forwarded-For (proxy sets it, realip module resolves it).
        # $realip_remote_addr would be the proxy peer IP — wrong for threat detection.
        access_log /var/log/nginx/access-proxy.log sentinel;

        location ~* \.(css|js|json)$ {
            try_files $uri =404;
        }

        location ~ \.php$ {
            try_files      $uri =404;
            fastcgi_pass   php-fpm:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
