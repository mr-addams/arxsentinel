events {}

http {
    # nginx-rp: pure reverse proxy for proxy-chain integration tests.
    # Routes /backend-<name>/ prefixes to the corresponding backend service,
    # stripping the prefix via trailing slash in proxy_pass.
    # Sets X-Forwarded-For so backends can log the real attacker IP.

    server {
        listen 80;

        # Preserve (or append) the real client IP in X-Forwarded-For.
        # proxy_add_x_forwarded_for appends to any existing XFF chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host             $host;
        # Remove X-Real-IP — standardise on X-Forwarded-For only.
        proxy_set_header X-Real-IP        "";

        location /backend-nginx/ {
            proxy_pass http://nginx:8080/;
        }

        location /backend-apache/ {
            proxy_pass http://apache-proxy:80/;
        }

        location /backend-traefik/ {
            proxy_pass http://traefik-backend:80/;
        }

        location /backend-caddy/ {
            proxy_pass http://caddy-backend:80/;
        }

        location /backend-haproxy/ {
            proxy_pass http://haproxy-backend:80/;
        }
    }
}
