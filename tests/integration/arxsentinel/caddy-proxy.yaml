general:
  log_file: logs/caddy-proxy/access-proxy.log
  pid_file: /tmp/arxsentinel-caddy-proxy.pid
  tail_retry_interval: "2s"

parser:
  profile: caddy

output:
  threat_log: logs/threats/caddy-proxy.log
  operational_log: logs/threats/sentinel-caddy-proxy.log

logging:
  console_color: false

blocklist:
  storage: ""
  lists:
    - name: badbot-ua
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ua.list"
          format: plain_text
    - name: badbot-ref
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ref.list"
          format: plain_text
