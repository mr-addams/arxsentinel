general:
  log_file: logs/apache-proxy/access.log
  pid_file: /tmp/arxsentinel-apache-proxy.pid
  tail_retry_interval: "2s"

parser:
  profile: apache

output:
  threat_log: logs/threats/apache-proxy.log
  operational_log: logs/threats/sentinel-apache-proxy.log

logging:
  console_color: false

blocklist:
  storage: ""
  lists:
    - name: badbot-ua
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ua.list"
          format: plain_text
    - name: badbot-ref
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ref.list"
          format: plain_text
