general:
  log_file: logs/nginx/access-proxy.log
  pid_file: /tmp/arxsentinel-nginx-proxy.pid
  tail_retry_interval: "2s"

parser:
  log_format: combined

output:
  threat_log: logs/threats/nginx-proxy.log
  operational_log: logs/threats/sentinel-nginx-proxy.log

logging:
  console_color: false

blocklist:
  storage: ""
  lists:
    - name: badbot-ua
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ua.list"
          format: plain_text
    - name: badbot-ref
      refresh_interval: 24h
      sources:
        - url: "http://localhost:8090/badbot-ref.list"
          format: plain_text
