# tests/integration-freebsd/nginx/nginx.conf — minimal nginx config for
# Flow 089 integration-nginx job.
#
# Used by tests/integration-freebsd/nginx/run-nginx.sh (Phase 3 of
# Flow 089). The nginx container runs under FreeBSD's Linux emulation
# (`podman run --os=linux nginx:alpine` — per Flow 088 DECISIONS §"A.2"
# Linux compat path), with $WORK_DIR/nginx bind-mounted to
# /var/log/nginx so the host-native arxsentinel can tail
# /var/log/nginx/access.log via the bind mount.
#
# Format: the battle suite's "sentinel" 9-field format, NOT nginx's
# built-in 8-field "combined". CORRECTION (live run 28477392517 found
# this the hard way): despite its name, arxsentinel's CombinedParser
# (arx-core pkg/parser/combined.go) does NOT parse nginx's literal
# built-in "combined" log format. Its regex requires NINE quoted/
# bracketed fields, the ninth being a trailing "$real_ip":
#   ^(\S+) - (\S+) \[([^\]]+)\] "([^"]*)" (\d+) (\d+) "([^"]*)" "([^"]*)" "([^"]*)"$
# nginx's built-in "combined" only emits EIGHT fields (no trailing
# real_ip) — every line was rejected as "skipping malformed line" by
# the parser. The battle suite's tests/integration/configs/nginx.conf
# "sentinel" format already has the correct 9-field shape (it repeats
# $remote_addr as the real_ip placeholder, since ngx_realip is not
# configured here either) — this file now uses the same format string,
# named "sentinel" to avoid colliding with nginx's reserved "combined"
# name (see the access_log directive below for that earlier finding).
#
# Why minimal: we want the access log to be the only output of interest.
# No PHP, no proxy-chain, no realip module — those are battle-suite
# surface (Deferred 089.2 / 089.3 in Flow 089 DECISIONS), out of scope
# for this one-backend first iteration. A request to / returns 404
# (the try_files default), which is fine: the parser only needs the
# request line + UA + client IP, not the response code.
#
# error_log /dev/stderr: REQUIRED. The official nginx:alpine image
# normally symlinks /var/log/nginx/error.log -> /dev/stderr so
# `podman logs` / `docker logs` capture nginx's startup messages
# (including "start worker processes", which run-nginx.sh polls for
# readiness). Our bind-mount of $WORK_DIR/nginx over /var/log/nginx
# (run-nginx.sh step 3) REPLACES that directory, so the symlink is
# gone — without this explicit directive, nginx's compiled-in default
# error_log path writes to a real file under the bind-mounted host
# directory instead of stderr, and `podman logs nginx` shows nothing
# after "Configuration complete; ready for start up" even though nginx
# may have started fine (live run 28476695517 hit exactly this: no
# error, just silence — the readiness wait loop timed out for lack of
# log visibility, not because nginx failed).
error_log /dev/stderr notice;

events {}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Named "sentinel" (NOT "combined") — nginx reserves the name
    # "combined" for its built-in default and refuses to start with
    # "duplicate log_format name combined" if a config redefines it,
    # even with an identical format string (live run 28476458817 hit
    # this exact error). "sentinel" is a free name; verbatim copy of
    # the battle suite's tests/integration/configs/nginx.conf format
    # string (9 fields, trailing $remote_addr as the real_ip
    # placeholder — see the file header for why the parser needs this).
    log_format sentinel '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" "$remote_addr"';

    access_log /var/log/nginx/access.log sentinel;

    server {
        listen 80 default_server;
        server_name _;

        # tail-friendly: write-through on the access log so the host-side
        # sentinel (running natively on FreeBSD, not in a container — per
        # DECISIONS §2) sees the request line in the bind-mounted file
        # immediately, not after nginx's internal buffer flushes. This
        # matches the battle test's behaviour (tests/integration/run.sh
        # also relies on near-real-time flushes for its grader).
        # open_log_file_cache off is the simplest knob that disables any
        # cache; the access log file is a single file, no cache benefit.
        open_log_file_cache off;

        location / {
            # Return 404 for any path — we don't need real content; the
            # grader only inspects the access log line, not the response.
            return 404;
        }
    }
}
