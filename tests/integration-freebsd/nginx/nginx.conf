# tests/integration-freebsd/nginx/nginx.conf — minimal nginx config for
# Flow 089 integration-nginx job.
#
# Used by tests/integration-freebsd/nginx/run-nginx.sh (Phase 3 of
# Flow 089). The nginx container runs under FreeBSD's Linux emulation
# (`podman run --os=linux nginx:alpine` — per Flow 088 DECISIONS §"A.2"
# Linux compat path), with $WORK_DIR/nginx bind-mounted to
# /var/log/nginx so the host-native arxsentinel can tail
# /var/log/nginx/access.log via the bind mount.
#
# Format: nginx "combined" (the default). Matches the parser config in
# tests/integration/arxsentinel/nginx.yaml (parser.log_format: combined)
# — the battle suite's parser is the same code path the FreeBSD-native
# build uses, so the format must be identical. A custom log_format
# (e.g. the "sentinel" format the battle tests/integration/configs/
# nginx.conf uses) would not work here because that format adds a
# trailing $remote_addr that nginx's default "combined" parser doesn't
# model; sticking to the default keeps the parser contract.
#
# Why minimal: we want the access log to be the only output of interest.
# No PHP, no proxy-chain, no realip module — those are battle-suite
# surface (Deferred 089.2 / 089.3 in Flow 089 DECISIONS), out of scope
# for this one-backend first iteration. A request to / returns 404
# (the try_files default), which is fine: the parser only needs the
# request line + UA + client IP, not the response code.

events {}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Default nginx "combined" format — verbatim from the upstream
    # LogFormat directive. The arxsentinel parser (parser.log_format:
    # combined) is keyed on this exact field shape.
    log_format combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log combined;

    server {
        listen 80 default_server;
        server_name _;

        # tail-friendly: write-through on the access log so the host-side
        # sentinel (running natively on FreeBSD, not in a container — per
        # DECISIONS §2) sees the request line in the bind-mounted file
        # immediately, not after nginx's internal buffer flushes. This
        # matches the battle test's behaviour (tests/integration/run.sh
        # also relies on near-real-time flushes for its grader).
        # open_log_file_cache off is the simplest knob that disables any
        # cache; the access log file is a single file, no cache benefit.
        open_log_file_cache off;

        location / {
            # Return 404 for any path — we don't need real content; the
            # grader only inspects the access log line, not the response.
            return 404;
        }
    }
}
