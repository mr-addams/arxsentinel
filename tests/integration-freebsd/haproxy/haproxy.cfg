# tests/integration-freebsd/haproxy/haproxy.cfg — minimal HAProxy 2.x/3.x
# static config for Flow 091 integration-haproxy job.
#
# Used by tests/integration-freebsd/haproxy/integration.sh (Phase P4 of
# Flow 091). The haproxy container runs under FreeBSD's Linux emulation
# (`podman run --os=linux docker.io/library/haproxy:latest` — per Flow 088
# DECISIONS §"A.2" Linux compat path, same flag as Flow 089's nginx
# container, 091's caddy container, and 091's traefik container).
#
# Per Flow 091 DECISIONS §4 haproxy row: image haproxy:alpine (or
# docker.io/library/haproxy:latest — same image; the brief uses
# "docker.io/library/haproxy:latest" verbatim per G13 verification against
# tests/integration/docker-compose.yml:75-89), access-log path /dev/stdout
# (HAProxy logs to stdout by default, captured by the run-script via
# `podman logs --follow haproxy > $WORK_DIR/haproxy/access.log &`), UA
# capture via `http-request capture req.hdr(user-agent) len 200` and
# log-format directive that references the captured UA field.
#
# IMPORTANT — arx-core parser contract (verified against the source
# before this file was written — see arx-core v0.3.1
# pkg/parser/profiles.go:40-50, haproxyHTTPPattern):
#
#   The built-in "haproxy-http" parser profile in arx-core uses
#   NewRegexParser(haproxyHTTPPattern) — a custom regex that matches the
#   httplog-derived format. The pattern's structure is:
#       ^(?P<remote_addr>[^:]+):\d+ \[(?P<time>[^\]]+)\] \S+ \S+ \S+
#         (?P<status>\d+) (?P<bytes_sent>\d+) \S+ \S+ \S+ \S+ \S+
#         "(?P<request>[^"]*)"(?: "(?P<http_user_agent>[^"]*)")?
#
#   The optional trailing `"(?P<http_user_agent>[^"]*)"` only matches when
#   HAProxy is configured with BOTH:
#     (a) `http-request capture req.hdr(user-agent) len <N>` to capture
#         the UA header into a fetch slot, AND
#     (b) A `log-format` directive whose last field references the
#         captured UA, e.g. `%[capture.req.hdr(0)]` (which renders as
#         a quoted string in the log line).
#
#   Without either (a) or (b), the UA appears as the literal "-" in
#   the log line — and the parser silently drops the absent field
#   (the regex's `(?: ...)?` group is optional). That would break the
#   badbot/UA-scoring assertions in integration.sh step 7, which grep
#   the threat log for the sqlmap UA string.
#
# Therefore: this haproxy.cfg mirrors the battle-suite config
# (tests/integration/configs/haproxy.cfg) VERBATIM in the global/
# defaults/frontend sections. The battle config has been verified to
# produce a correctly-formatted log line (tests/integration/run.sh
# passes assertions on it), so we copy that line-for-line — no
# improvisation, no reformatting. The proxy-chain backend sections
# (bk-*-backend, is_backend_* ACLs, default_backend) are OMITTED
# because the per-backend smoke does not need a real upstream: the
# frontend `http-request return status 404` short-circuits every
# request, which is the analogue of caddy's `respond / "*" 404` and
# traefik's "no providers, 404 default" (Decision 1: minimal
# per-backend scope, no premature proxy-chain in P4).
#
# Per Decision 4 haproxy row: HAProxy is badbot-testable AFTER the
# capture directive lands. The capture directive below enables the
# badbot scenario; the run-script (Phase P4.3) will drive 2 sqlmap-UA
# requests + 1 Mozilla-UA request and assert scoring per DECISIONS §5.
#
# Why bind-mount of /dev/stdout (NOT a file path):
#   HAProxy 2.x's `log` directive in the `global` section accepts
#   `stdout` as a target. With `log stdout len 8192 format raw local0
#   info`, the line is written to the process's stdout WITHOUT syslog
#   framing (the `format raw` keyword strips the priority/timestamp
#   prefix that would otherwise be prepended). This is essential
#   because the arx-core haproxy-http parser regex assumes the line
#   starts with the client IP — a syslog-prefixed line (e.g.
#   "<134>Oct 11 10:11:12 ... ...") would not match `^[^:]+:\d+`.
#   The run-script captures stdout via `podman logs --follow`, which
#   on the FreeBSD podman path returns the container's stdout stream
#   exactly as the process wrote it (verified for caddy in 091 P2 and
#   traefik in 091 P3 — same `podman logs` behaviour applies here).
#
# Why minimal — one frontend, no backends, direct 404 response:
#   We want HAProxy to accept HTTP on :8080, capture the UA, write a
#   log line, and return 404 to every request. No proxy-chain, no
#   TLS (HAProxy does not terminate TLS in this config), no real
#   upstream. The parser doesn't care about the response code, only
#   the request line + UA + client IP. A 404 response is the
#   analogue of caddy's "respond 404" and traefik's "no routes, 404
#   default" — proves the frontend is alive without needing a
#   second container-backend.
#
# Why len 8192 + tune.http.logurilen 4096 in `global`:
#   The battle suite's `tests/integration/configs/haproxy.cfg:6-12`
#   ships both values. Both are tested in the battle assertion
#   suite (overflow-detector scenario needs URL > 2048 chars to
#   survive in the log). We copy them verbatim so a future iteration
#   that re-uses this same haproxy.cfg for the overflow-detector
#   scenario does not need a second config file. NO FUNCTIONAL
#   IMPACT for the current P4 assertions (the smoke only sends
#   short UAs and short URLs), but it future-proofs the config.

global
    # len 8192: default log line limit is 1024 (syslog legacy). Verbatim
    # from tests/integration/configs/haproxy.cfg:8 — see header WHY-comment.
    log stdout len 8192 format raw local0 info
    maxconn 1000
    # tune.http.logurilen 4096: max URI length written to the log line.
    # Default is 1024; raise to 4096 so the full overflow URL survives.
    # Verbatim from tests/integration/configs/haproxy.cfg:12.
    tune.http.logurilen 4096

defaults
    mode http
    log global
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    # :8080, NOT :80 — the official haproxy image runs the worker as a
    # non-root user by default; binding a privileged port (<1024)
    # fails with "cannot bind socket (Permission denied)" (found live,
    # run 28556434720). We only reach this container via its CNI IP
    # inside the podman network (no host port-publish), so the port
    # number is arbitrary — 8080 avoids the privilege issue entirely.
    bind *:8080
    # forwardfor: append client IP to X-Forwarded-For before forwarding to backends.
    # Kept verbatim from the battle config (tests/integration/configs/haproxy.cfg:26)
    # for future proxy-chain scenarios; harmless for the current 404-direct smoke.
    option forwardfor
    # Capture User-Agent into slot 0 — available as %[capture.req.hdr(0)] in log-format.
    # http-request capture runs at request phase, so the header is always available.
    # Verbatim from tests/integration/configs/haproxy.cfg:29. This is the
    # ENABLING DIRECTIVE for the badbot/UA-scoring assertion in integration.sh
    # step 7 (DECISIONS §4 haproxy row, "UA capture via http-request capture"
    # + "badbot testable AFTER capture directive lands").
    http-request capture req.hdr(user-agent) len 200
    # Custom log-format: replicates "option httplog" fields and appends the captured UA.
    # The last field `%[capture.req.hdr(0)]` is a quoted string in the output.
    # haproxy-http sentinel profile expects this exact structure (the parser
    # regex's optional `"(?P<http_user_agent>[^"]*)"` group matches the
    # trailing quoted token).
    # Verbatim from tests/integration/configs/haproxy.cfg:32.
    log-format "%ci:%cp [%trl] %ft %b/%s %Tq/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %{+Q}r \"%[capture.req.hdr(0)]\""

    # Direct 404 response (analogue of caddy `respond / "*" 404` and
    # traefik "no providers, 404 default" — Decision 1: minimal per-
    # backend scope, no proxy-chain in P4). http-request return status
    # <code> is HAProxy 2.x's directive for a direct response from
    # the frontend without a backend round-trip — a 404 here is the
    # expected smoke response. The frontend's `default_backend` would
    # be used only if http-request return is absent; explicit is
    # better than implicit, and the 404 here also gives the parser
    # a real status code in the log line (status=404) — the assertion
    # in integration.sh step 7 does not check the status, but a real
    # numeric status is required by haproxyHTTPPattern's
    # `(?P<status>\d+)` group.
    http-request return status 404
