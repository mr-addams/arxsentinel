# tests/integration-freebsd/traefik/sentinel-traefik.yaml — arxsentinel
# config for Flow 091 integration-traefik job.
#
# Used by tests/integration-freebsd/traefik/integration.sh (Phase P3 of
# Flow 091). arxsentinel runs NATIVE on the FreeBSD VM host (per Flow
# 089 DECISIONS §2 — sentinel on host, NOT in a container), with its
# CWD set to $WORK_DIR by integration.sh's `cd $WORK_DIR && ./arxsentinel
# ...`. The paths below are RELATIVE to $WORK_DIR: logs/access.log is
# the bind-mounted traefik access log (host path = $WORK_DIR/logs/
# access.log = /logs/access.log inside the traefik container, per
# traefik.yml: filePath: "/logs/access.log" + the -v bind in
# integration.sh step 3); output/threats-traefik.log is the threat log
# the grader reads.
#
# Why this is a near-verbatim copy of sentinel-caddy.yaml (per Flow 091
# DECISIONS §2 — copy-then-adapt, no premature library extraction).
# The ONLY differences are:
#   1. general.log_file: log/access.log → logs/access.log
#      (traefik.yml writes to /logs/access.log = $WORK_DIR/logs/
#      access.log on host via the -v bind-mount of $WORK_DIR/logs onto
#      /logs, see traefik.yml header + integration.sh step 3 for why
#      /logs is the chosen in-container path).
#   2. parser.profile: caddy → traefik
#      (per Decision 4 traefik row + arx-core contract — see the
#      parser.profile: block header below for the source-verified
#      reasoning).
#   3. output.threat_log: output/threats-caddy.log →
#      output/threats-traefik.log (per Decision 4 consequences:
#      per-backend threat-log suffix to avoid artifact upload
#      collision when multiple jobs run in the same workflow
#      dispatch).
# All other fields are kept identical to sentinel-caddy.yaml so the
# scorer/pipeline behaviour is byte-for-byte the same; the per-backend
# test is a true parity signal (same config, different upstream log
# path + parser profile).
#
# Why debug: true is REQUIRED (not a nice-to-have):
#   The integration.sh script polls the "watching started" log line
#   that TailReader emits immediately after seek(EOF). Without debug:
#   true, the TAIL log tag is suppressed and the polling loop in step
#   5 never sees the sync marker — it would time out at 30s on every
#   run. Same rationale as sentinel-nginx.yaml, sentinel-caddy.yaml
#   and tests/integration-freebsd/smoke.yaml header (Flow 088 G.1b).
#
# Why metrics.enabled: false:
#   The sentinel is a research-grade smoke component, not a production
#   service. Enabling the metrics endpoint (default :9117) would add
#   an open port in the VM for no useful measurement; the smoke's
#   PASS/FAIL signal is the threat log grader, not Prometheus. Matches
#   sentinel-nginx.yaml / sentinel-caddy.yaml precedent.
#
# Why pid_file: /tmp/arxsentinel.pid is kept for parity:
#   The pid file is harmless on FreeBSD (the sentinel writes it on
#   start, removes it on clean shutdown). It matches the
#   sentinel-nginx.yaml / sentinel-caddy.yaml pattern and gives
#   integration.sh a known file to read for sentinel liveness checks.
#   integration.sh does not depend on it but may use it in future
#   iterations.

general:
  # Host bind-mounted traefik access log (relative to $WORK_DIR, which
  # is the sentinel's CWD when integration.sh starts it).
  # traefik.yml writes to /logs/access.log (the path the arx-core
  # "traefik" parser profile expects — CLF format, see below). The
  # bind-mount in integration.sh maps $WORK_DIR/logs onto /logs, so
  # the host-side file is $WORK_DIR/logs/access.log = /logs/access.log
  # inside the container.
  log_file: logs/access.log
  pid_file: /tmp/arxsentinel.pid
  tail_retry_interval: "1s"

# parser.profile: traefik — built-in profile from arx-core
# (github.com/mr-addams/arx-core/pkg/parser/profiles.go:60,
# traefikProfile at :84-93) wraps NewRegexParser(apacheCLFPattern) —
# Apache CLF regex (text, 9-field form), same regex as caddy/apache/
# litespeed, but without the trailing $ end-anchor so Traefik's
# post-UA fields (duration_ms, router name, service name, retries)
# are silently ignored.
#
# Source-verified contract (NOT a guess from the brief):
#   - profiles.go:30-38 apacheCLFPattern comment is explicit:
#       "Also used for Caddy (configured to emit CLF), Traefik
#        (CLF default), and LiteSpeed / OpenLiteSpeed."
#   - profiles.go:60 Profiles map lists "traefik" as a key.
#   - profiles.go:84-93 traefikProfile returns
#     NewRegexParser(apacheCLFPattern) — the SAME regex as caddy.
#   - profiles.go:10-17 Design note records the
#     decision-2-deviation from the design document's plan: "DECISIONS
#     .md planned caddy and traefik as JSONParser profiles. In
#     practice, Caddy v2 JSON uses nested objects and Traefik JSON
#     splits the request into method/path/proto — neither maps
#     cleanly to JSONParser's single-field 'request' contract."
#
# Therefore: traefik.yml leaves accessLog `format` at its CLF
# default (no `format:` field). JSON would break this profile.
#
# The "traefik" profile has priority over parser.log_format in
# buildParserForInput (cmd/arxsentinel/builders.go:188-198, the
# `if cfg.Parser.Profile != ""` short-circuit), so log_format is
# NOT set here.
#
# Why profile: traefik and not log_format: combined:
#   The combined format uses parser.CombinedParser (the original
#   combined parser with its own regex anchored to $). Traefik's CLF
#   output appends extra fields after the User-Agent; the combined
#   parser's regex would NOT match. The traefik profile uses the
#   apacheCLFPattern regex WITHOUT the $ anchor, which matches the
#   9-field CLF prefix and silently ignores the trailing fields.
#   Same logic as for caddy (caddy profile uses apacheCLFPattern
#   verbatim, including the $ — caddy's transform-encoder writes
#   exactly 9 fields, so $ is safe there).
#
# Per Decision 4 traefik row: the 8th attack scenario (badbot)
# asserts that the badbot UA string appears in the threat log —
# this requires the UA to be in the parsed log line. The traefik
# profile's regex captures http_user_agent as the 9th quoted field;
# Traefik's default CLF output writes the UA there. Both ends are
# consistent.
parser:
  profile: traefik

logging:
  debug: true
  console_color: false

metrics:
  enabled: false
  listen_addr: ":9117"
  username: ""
  password_hash: ""

# output.threat_log: relative to $WORK_DIR. integration.sh copies
# this file (after assertions) to $TMPDIR/threats-traefik.log.smoke
# for the workflow artifact upload (P3.4 carry of 089 Task 3.6 +
# 4.3 pattern, with caddy per-backend naming applied to traefik).
output:
  threat_log: output/threats-traefik.log
  operational_log: sentinel-traefik.log
