# tests/integration-freebsd/apache/sentinel-apache.yaml — arxsentinel
# config for Flow 091 integration-apache job.
#
# Used by tests/integration-freebsd/apache/integration.sh (Phase P5 of
# Flow 091). arxsentinel runs NATIVE on the FreeBSD VM host (per Flow
# 089 DECISIONS §2 — sentinel on host, NOT in a container), with its
# CWD set to $WORK_DIR by integration.sh's `cd $WORK_DIR && ./arxsentinel
# ...`. The paths below are RELATIVE to $WORK_DIR: logs/access.log is
# the host-side file written by the httpd container's worker into the
# bind-mounted $WORK_DIR/logs/ directory (mirror of the nginx/caddy/
# traefik bind-mount pattern, NOT the haproxy stdout-capture pattern
# — see integration.sh header for the architectural choice rationale);
# output/threats-apache.log is the threat log the grader reads.
#
# Why this is a near-verbatim copy of sentinel-haproxy.yaml (per Flow
# 091 DECISIONS §2 — copy-then-adapt, no premature library extraction).
# The ONLY differences are:
#   1. general.log_file: haproxy/access.log → logs/access.log
#      (Apache writes to a file via CustomLog, which the bind-mount
#      surfaces at $WORK_DIR/logs/access.log. nginx/caddy/traefik use
#      the same /logs bind-mount path; HAProxy uses stdout-capture
#      into haproxy/access.log instead, which is the one divergence
#      in this field across the five per-backend yaml files.)
#   2. parser.profile: haproxy-http → apache
#      (apache profile is the source-verified built-in profile from
#      arx-core v0.3.1 — see "SOURCE-VERIFIED parser.profile
#      contract" below. The apacheCLFPattern regex matches the
#      LogFormat line in tests/integration-freebsd/apache/httpd.conf
#      byte-for-byte.)
#   3. output.threat_log: output/threats-haproxy.log →
#      output/threats-apache.log (per Decision 4 consequences:
#      per-backend threat-log suffix to avoid artifact upload
#      collision when multiple jobs run in the same workflow
#      dispatch).
# All other fields are kept identical to sentinel-haproxy.yaml so the
# scorer/pipeline behaviour is byte-for-byte the same; the per-backend
# test is a true parity signal (same config shape, different upstream
# log path + parser profile).
#
# Why debug: true is REQUIRED (not a nice-to-have):
#   The integration.sh script polls the "watching started" log line
#   that TailReader emits immediately after seek(EOF). Without debug:
#   true, the TAIL log tag is suppressed and the polling loop in step
#   5 never sees the sync marker — it would time out at 30s on every
#   run. Same rationale as sentinel-nginx.yaml, sentinel-caddy.yaml,
#   sentinel-traefik.yaml, sentinel-haproxy.yaml and
#   tests/integration-freebsd/smoke.yaml header (Flow 088 G.1b).
#
# Why metrics.enabled: false:
#   The sentinel is a research-grade smoke component, not a production
#   service. Enabling the metrics endpoint (default :9117) would add
#   an open port in the VM for no useful measurement; the smoke's
#   PASS/FAIL signal is the threat log grader, not Prometheus. Matches
#   sentinel-nginx.yaml / sentinel-caddy.yaml / sentinel-traefik.yaml /
#   sentinel-haproxy.yaml precedent.
#
# Why pid_file: /tmp/arxsentinel.pid is kept for parity:
#   The pid file is harmless on FreeBSD (the sentinel writes it on
#   start, removes it on clean shutdown). It matches the
#   sentinel-nginx.yaml / sentinel-caddy.yaml / sentinel-traefik.yaml /
#   sentinel-haproxy.yaml pattern and gives integration.sh a known file
#   to read for sentinel liveness checks. integration.sh does not
#   depend on it but may use it in future iterations.
#
# SOURCE-VERIFIED parser.profile contract (NOT a guess from the brief):
#   arx-core v0.3.1 pkg/parser/profiles.go (verified by reading the
#   source file directly before this yaml was written):
#     - Line 8 module header lists the five built-in profiles:
#       "apache, caddy, traefik, haproxy-http, litespeed".
#     - Line 30-40 apacheCLFPattern:
#         ^(?P<remote_addr>\S+) \S+ (?P<remote_user>\S+) \[(?P<time>[^\]]+)\]
#         "(?P<request>[^"]*)" (?P<status>\d+) (?P<bytes_sent>\S+)
#         (?: "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)")?
#     - Line 61 Profiles map key: "apache" → apacheProfile
#     - Line 80-86 apacheProfile returns NewRegexParser(apacheCLFPattern).
#   The pattern's optional trailing `"(?P<http_referer>[^"]*)"
#   "(?P<http_user_agent>[^"]*)"` groups REQUIRE the httpd config
#   to write the Referer and User-Agent headers in the LogFormat
#   (otherwise the trailing fields render as `"-"` and the regex's
#   optional non-capturing wrapper sees a " -" rather than quoted
#   strings — the regex still matches but captures the "-" as the
#   field value, which is harmless for the detection logic but
#   means the UA-scoring detector never fires). The verbatim
#   LogFormat in tests/integration-freebsd/apache/httpd.conf
#   includes both fields in the right order, so the regex captures
#   them correctly.

general:
  # Host-side access log (relative to $WORK_DIR, which is the sentinel's
  # CWD when integration.sh starts it). Written by the httpd worker's
  # CustomLog directive into /usr/local/apache2/logs/access.log, which
  # the bind-mount surfaces as $WORK_DIR/logs/access.log on the host.
  # The `logs/` subdir name matches the nginx/caddy/traefik precedent
  # (the only divergence is haproxy's `haproxy/` subdir, mandated by
  # the stdout-capture pattern that httpd does NOT use).
  log_file: logs/access.log
  pid_file: /tmp/arxsentinel.pid
  tail_retry_interval: "1s"

# parser.profile: apache — built-in profile from arx-core
# (github.com/mr-addams/arx-core/pkg/parser/profiles.go:61,
# apacheProfile at :80-86) wraps NewRegexParser(apacheCLFPattern).
# This is the SAME profile the battle suite uses
# (tests/integration/arxsentinel/apache.yaml — see the
# tests/integration/configs/httpd.conf referenced in the profile's
# source comments). The LogFormat in
# tests/integration-freebsd/apache/httpd.conf emits lines that
# match apacheCLFPattern's structure EXACTLY (verified line-by-line
# in the httpd.conf file's header).
#
# The "apache" profile has priority over parser.log_format in
# buildParserForInput, so log_format is NOT set here.
#
# Per Decision 4 apache row: the 8th attack scenario (badbot)
# asserts that the badbot UA string appears in the threat log —
# this requires the UA to be in the parsed log line. The apache
# profile's regex captures http_user_agent as the OPTIONAL trailing
# quoted field; the httpd.conf's `LogFormat "... \"%{User-Agent}i\""`
# ensures the optional group is present in the output. Both ends
# are consistent.
parser:
  profile: apache

logging:
  debug: true
  console_color: false

metrics:
  enabled: false
  listen_addr: ":9117"
  username: ""
  password_hash: ""

# output.threat_log: relative to $WORK_DIR. integration.sh copies
# this file (after assertions) to $TMPDIR/threats-apache.log.smoke
# for the workflow artifact upload (P5.4 carry of 089 Task 3.6 +
# 4.3 pattern, with per-backend naming).
output:
  threat_log: output/threats-apache.log
  operational_log: sentinel-apache.log
