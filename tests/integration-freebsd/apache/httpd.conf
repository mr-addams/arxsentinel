# tests/integration-freebsd/apache/httpd.conf — Flow 091 integration
# Apache (httpd) config for the FreeBSD/podman apache backend.
#
# Source of truth: tests/integration/configs/httpd.conf (the battle-suite
# config the FreeBSD run is benchmarked against per Flow 091 DECISIONS §1
# + §4 apache row). This FreeBSD config is a SURGICAL ADAPTATION of the
# battle config: same LogFormat (verbatim — that's the contract that the
# arx-core "apache" parser profile / apacheCLFPattern expects), same
# DocumentRoot, but the CustomLog target and the Listen port diverge
# to match the bind-mount / port-8080 / non-root patterns established
# by run-haproxy.sh (Decision 4 haproxy row: bind :8080 to avoid the
# privileged-port bind failure that the official httpd image hits
# as a non-root worker — verified in P4 first live dispatch and
# inferred to be the same risk surface for httpd).
#
# Bind-mount contract with run-apache.sh:
#   tests/integration-freebsd/apache/run-apache.sh bind-mounts this
#   file over the container's /usr/local/apache2/conf/httpd.conf and
#   bind-mounts $WORK_DIR/logs over /usr/local/apache2/logs/ — so
#   CustomLog MUST target /usr/local/apache2/logs/access.log (the
#   default install prefix of the official httpd image, which
#   already exists and is writable by the worker). The haproxy
#   custom-target /var/log/apache2/ path is NOT used here (that was
#   battle suite's choice; the battle config lives under
#   tests/integration/configs/, this one is a FreeBSD-specific
#   adaptation and the bind-mount paths are independent).
#
# NOT loaded (per 091.1 deferral — out of scope for the P5 first
# dispatch): mod_remoteip. The battle httpd-proxy.conf carries
# mod_remoteip configuration; that's a separate file in the battle
# suite for the proxy-chain case. P5 tests the direct-server
# (front-of-house) case only; mod_remoteip is irrelevant to the
# badbot / direct-module detectors that Decision 9 exercises.
#
# Verbatim LogFormat (per Flow 091 DECISIONS §4 apache row + brief
# directive: "LogFormat-СТРОКУ из battle httpd.conf дословно"). The
# trailing \"%{User-Agent}i\" is what enables the badbot scenario
# (Decision 9 condition: backend must capture UA). Without that
# field the arx-core apacheCLFPattern would parse the line with
# http_user_agent absent and the UA-scoring detector would never
# fire on sqlmap/1.7.11.

ServerRoot "/usr/local/apache2"
Listen 8080

# Minimal LoadModule set: mpm_event (the default MPM in the official
# image; no fork model needed for the smoke), authz_core (Require
# directive), log_config (LogFormat / CustomLog — without this
# module loaded the LogFormat directive is silently ignored and
# CustomLog falls back to the compile-time default CLF without UA),
# unixd (User/Group directives — switch away from the master
# process's user so the worker can write to the bind-mounted log
# directory; see comment on the User/Group block below). Mirrors
# the battle httpd.conf's LoadModule list.
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule unixd_module modules/mod_unixd.so

# Run workers as www-data (matches the battle httpd.conf, matches
# the user the official httpd image ships /etc/passwd with). The
# master process still runs as root and binds :8080; the worker
# inherits root's bind and writes the access log as www-data. The
# bind-mounted /usr/local/apache2/logs/ is owned by the host user
# (the FreeBSD VM's root in the vmactions context); the host
# 0755 + www-data's umask means writes succeed. (If a future run
# hits a permission-denied on the access log, the first thing to
# check is whether the host-side $WORK_DIR/logs is writable by
# the in-container www-data — the bind mount passes through the
# host's UID/GID ownership, not the container's.)
User www-data
Group www-data

# ErrorLog to /dev/stderr, NOT /proc/1/fd/2 (found live, run
# 28559031208): "AH02291: Cannot access directory '/proc/1/fd/' for
# main error log" — FreeBSD's linprocfs (Linux /proc emulation) does
# not populate /proc/1/fd/ the way a native Linux kernel does, so the
# procfs-symlink-to-stdout trick some container images use fails
# outright, and httpd's own config check aborts before startup.
# /dev/stderr is a plain device-node symlink (no /proc dependency)
# and lands in the same place — podman's log capture reads the
# container's stderr just like its stdout. The readiness check in
# run-apache.sh polls `podman logs apache` DIRECTLY (not a host-side
# log file), so the stdout-buffering gotcha from the haproxy lesson
# does not apply here either way.
ErrorLog /dev/stderr
LogLevel warn

# VERBATIM from battle httpd.conf:9 (per DECISIONS §4 apache row).
# This is the standard Combined Log Format. The arx-core
# apacheCLFPattern regex in pkg/parser/profiles.go matches this
# string exactly (verified — see sentinel-apache.yaml header for
# the source-verified reasoning). Do NOT change the field order
# or the quoting style: the regex's named groups depend on
# "remote_addr remote_user [time] \"request\" status bytes
# \"referer\" \"user-agent\"" in that order with that exact
# quoting.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

# Bind-mount target: $WORK_DIR/logs/ (host) is bind-mounted over
# /usr/local/apache2/logs/ (container) by run-apache.sh, so the
# file the worker writes here lands at $WORK_DIR/logs/access.log
# on the host. The host-native sentinel (Decision §2) tails that
# file in step 4 of run-apache.sh.
CustomLog /usr/local/apache2/logs/access.log combined

# Default DocumentRoot from the official image — the curl
# attacker in run-apache.sh step 6 hits "/" which lands here.
# 404 is the expected response (the battle suite has no real
# content under this DocumentRoot, just as P5 has no real
# content under it — the smoke is testing the access-log
# pipeline, not the web content).
DocumentRoot "/usr/local/apache2/htdocs"

<Directory "/usr/local/apache2/htdocs">
    Require all granted
</Directory>
