# ========================== config.fail2ban-example.yaml ================================
#
#   Quick-start config for nginx + fail2ban (or file-based threat log).
#   Streams format: single nginx access.log -> threat detection -> file output.
#   Installed as /etc/arxsentinel/config.yaml.example -- copy to config.yaml to use.
#
#   Use case: single nginx host, no automated bans, log-based alerting only.
#   For automated Cloudflare bans: see config.cloudflare-example.yaml
#   For all configuration options: see config.reference.yaml
#
#   Changes are applied on SIGHUP without restarting the daemon.
#
# ========================================================================================

# ── scoring: when to act ──────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50
  ban_threshold: 80
  observation_window: 300s
  decay: linear

# ── streams: nginx log source -> threat detection -> fail2ban output ──────────────────
streams:
  - name: main
    inputs:
      - type: file
        path: /var/log/nginx/access.log   # adjust to your nginx access log path
        parser: combined
    outputs:
      - type: file
        path: /var/log/arxsentinel/threats.log
        format: fail2ban