# ========================== ArxSentinel — container defaults ==============================
#
#   This file is baked into the Docker image at /etc/arxsentinel/config.yaml.
#   Override it by bind-mounting your own config:
#
#     docker run -v ./my-config.yaml:/etc/arxsentinel/config.yaml:ro ...
#   or:
#     ARXSENTINEL_CONFIG=/custom/path/config.yaml arxsentinel
#
#   Differences from bare-metal defaults:
#     - pid_file:        /tmp/arxsentinel.pid  (distroless:nonroot uid=65532 cannot write /var/run)
#     - console_color:   false                 (no terminal in container, avoid ANSI noise)
#     - metrics.enabled: true                  (primary value-add in container mode)
#     - output paths:    /var/log/arxsentinel/ (mount writable volume here for Fail2Ban)
#
# =========================================================================================

# ── general ───────────────────────────────────────────────────────────────────────────────
general:
  log_file: /var/log/nginx/access.log   # bind-mount nginx log here (read-only)
  pid_file: /tmp/arxsentinel.pid        # /var/run not writable for nonroot uid=65532

  lines_buf_size: 1000
  tail_retry_interval: "5s"
  stats_interval: "300s"

# ── logging ───────────────────────────────────────────────────────────────────────────────
logging:
  debug: false
  console_color: false   # no terminal — plain text for log drivers (journald, fluentd, etc.)

# ── parser ────────────────────────────────────────────────────────────────────────────────
parser:
  log_format: combined
  timezone: UTC

# ── scoring ───────────────────────────────────────────────────────────────────────────────
scoring:
  alert_threshold: 50
  ban_threshold: 80
  observation_window: "300s"
  decay: "linear"

# ── state ─────────────────────────────────────────────────────────────────────────────────
state:
  gc_interval: "60s"
  max_tracked_ips: 100000

# ── detectors ──────────────────────────────────────────────────────────────────────────────
detectors:
  probe:
    enabled: true
    score: 25
    paths:
      - "/.env"
      - "/.env.backup"
      - "/.env.local"
      - "/.env.production"
      - "/.env.staging"
      - "/config.yml"
      - "/config.yaml"
      - "/config.json"
      - "/application.properties"
      - "/settings.py"
      - "/local_settings.py"
      - "/database.yml"
      - "/web.config"
      - "/.git/config"
      - "/.git/HEAD"
      - "/.gitignore"
      - "/.svn/entries"
      - "/.hg/"
      - "/.aws/credentials"
      - "/.docker/config.json"
      - "/aws-exports.json"
      - "/wp-config.php"
      - "/wp-config.php.bak"
      - "/wp-login.php"
      - "/xmlrpc.php"
      - "/wp-admin/"
      - "/administrator/"
      - "/admin/"
      - "/phpmyadmin/"
      - "/pma/"
      - "/backup.zip"
      - "/backup.tar.gz"
      - "/backup.sql"
      - "/db.dump"
      - "/database.sql"
      - "/dump.sql"
      - "/server-status"
      - "/server-info"
      - "/phpinfo.php"
      - "/info.php"
      - "/actuator/"
      - "/actuator/env"
      - "/actuator/health"
      - "/metrics"
      - "/.debug"
      - "/trace"
      - "/console"
      - "/graphql"
      - "/graphiql"
      - "/api/graphql"

  bruteforce:
    enabled: true
    min_requests: 10
    ratio_threshold: 0.6
    score: 30

  crawler:
    enabled: true
    min_sequential: 5
    score: 20

  noasset:
    enabled: true
    min_page_requests: 3
    asset_ratio_threshold: 0.1
    asset_extensions:
      - ".css"
      - ".js"
      - ".png"
      - ".jpg"
      - ".jpeg"
      - ".gif"
      - ".svg"
      - ".woff"
      - ".woff2"
      - ".ttf"
      - ".ico"
      - ".webp"
    score: 20

  rate:
    enabled: true
    window: "60s"
    threshold: 100
    score: 25

  useragent:
    enabled: true
    scanner_score: 40
    grabber_score: 20
    automation_score: 15
    empty_ua_score: 30
    extra_scanner_patterns: []
    extra_grabber_patterns: []
    extra_automation_patterns: []

  overflow:
    enabled: true
    max_url_length: 2048
    suspicious_params:
      - "bypass"
      - "shell"
      - "cmd"
      - "exec"
      - "eval"
      - "system"
      - "passthru"
    score: 30

  badbot:
    enabled: true
    score: 60
    check_ua: true
    check_referrer: false

# ── blocklist ────────────────────────────────────────────────────────────────────────────
blocklist:
  storage: ""
  lists:
    - name: badbot-ua
      enabled: true
      refresh_interval: 24h
      sources:
        - url: "https://raw.githubusercontent.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker/master/_generator_lists/bad-user-agents.list"
          format: plain_text
    - name: badbot-ref
      enabled: true
      refresh_interval: 24h
      sources:
        - url: "https://raw.githubusercontent.com/mitchellkrogza/nginx-ultimate-bad-bot-blocker/master/_generator_lists/bad-referrers.list"
          format: plain_text

# ── chain_guard ────────────────────────────────────────────────────────────────────────────
chain_guard:
  enabled: false
  warnings_log: ""
  cloudflare:
    enabled: true
    refresh_interval: 24h
    sources:
      - https://www.cloudflare.com/ips-v4/
      - https://www.cloudflare.com/ips-v6/
  bogon:
    enabled: true

# ── whitelist ──────────────────────────────────────────────────────────────────────────────
whitelist:
  fake_bot_score: 35
  dns_verify_timeout: "2s"
  bots:
    - name: google
      ua_patterns: ["Googlebot", "Google-InspectionTool", "GoogleOther", "AdsBot-Google"]
      rdns_domains: [".googlebot.com", ".google.com"]
      verify_method: rdns_ipjson
    - name: bing
      ua_patterns: ["bingbot", "BingPreview", "msnbot", "adidxbot"]
      rdns_domains: [".search.msn.com"]
      verify_method: rdns
    - name: yandex
      ua_patterns: ["YandexBot", "YandexImages", "YandexMetrika", "YandexDirect"]
      rdns_domains: [".yandex.ru", ".yandex.net", ".yandex.com"]
      verify_method: rdns
    - name: duckduckgo
      ua_patterns: ["DuckDuckBot"]
      rdns_domains: [".duckduckgo.com"]
      verify_method: rdns
    - name: baidu
      ua_patterns: ["Baiduspider", "BaiduMobaider"]
      rdns_domains: [".baidu.com", ".baidu.jp"]
      verify_method: rdns
    - name: apple
      ua_patterns: ["Applebot"]
      rdns_domains: [".applebot.apple.com"]
      verify_method: rdns
    - name: facebook
      ua_patterns: ["facebookexternalhit", "Facebot"]
      rdns_domains: []
      verify_method: ip_ranges
    - name: twitter
      ua_patterns: ["Twitterbot"]
      rdns_domains: []
      verify_method: ip_ranges
    - name: telegram
      ua_patterns: ["TelegramBot"]
      rdns_domains: []
      verify_method: ip_ranges
    - name: gptbot
      ua_patterns: ["GPTBot"]
      rdns_domains: [".openai.com"]
      verify_method: rdns
    - name: claudebot
      ua_patterns: ["ClaudeBot", "Claude-Web", "anthropic-ai"]
      rdns_domains: [".anthropic.com"]
      verify_method: rdns
  custom:
    ips: []
    cidrs: []
    ua_substrings: []
  dns_cache:
    positive_ttl: "24h"
    negative_ttl: "1h"
    ip_list_refresh: "24h"

# ── metrics ───────────────────────────────────────────────────────────────────────────────
# Enabled by default in container mode — expose port 9117 for Prometheus scraping.
# Set metrics.username + metrics.password_hash to enable basic auth.
metrics:
  enabled: true
  listen_addr: ":9117"
  username: ""
  password_hash: ""

# ── pipeline ──────────────────────────────────────────────────────────────────────────────
# Bounded channel between log-source readers and the processing pipeline.
# Increase buffer_size for burst traffic (e.g. 16384 for high-load nginx).
# shutdown_timeout: max drain time on SIGTERM before forced close.
pipeline:
  buffer_size: 8192
  shutdown_timeout: "15s"

# ── output ────────────────────────────────────────────────────────────────────────────────
# Mount /var/log/arxsentinel as a writable volume.
# For Fail2Ban integration: host Fail2Ban reads threats.log via bind-mount or hostPath.
output:
  threat_log: /var/log/arxsentinel/threats.log
  operational_log: /var/log/arxsentinel/sentinel.log

# ── Advanced / YAML-only features (reference — uncomment to enable) ───────────────────────
#
# These sections have no env var equivalents and are configured by editing this file.
# Full copy-paste-ready examples: /etc/arxsentinel/config.yaml.example
#
# ── streams: multi-source monitoring ──────────────────────────────────────────────────────
# Remove general.log_file above and uncomment streams: to monitor multiple log sources.
#
# streams:
#   - name: main
#     ...
#     outputs:
#       - type: sentinel-threat
#         name: sentinel-cf
#       - type: file
#         path: /threats.log
#
# ── executors: automated threat response ───────────────────────────────────────────────────
# Executors run after every THREAT event. See config.yaml.example for all options.
#
# executors:
#   - name: cloudflare-blocklist
#     type: cloudflare
#     sources:
#       - name: sentinel-cf              # matches sentinel-threat sink name in streams
#     config:
#       api_token: YOUR_CF_API_TOKEN     # via ARXSENTINEL secret or bind-mounted config
#       account_id: YOUR_CF_ACCOUNT_ID
#       list_name: arxsentinel-blocklist
#       min_level: THREAT
#       ttl: 24h
#       batch_size: 100
#       flush_interval: 10s
#       comment_extra: ""                # optional: "sentinel-<id> <extra>"
#
# ── inputs / outputs: universal I/O syntax ─────────────────────────────────────────────────
# Use instead of general.log_file / output.threat_log for multi-source or exec plugin I/O.
#
# inputs:
#   - type: file
#     path: /var/log/nginx/access.log
#     parser: combined
#   - type: stdin
#     parser: combined
#
# outputs:
#   - type: file
#     path: /var/log/arxsentinel/threats.log
#     format: fail2ban
#   - type: stdout
#     format: json
