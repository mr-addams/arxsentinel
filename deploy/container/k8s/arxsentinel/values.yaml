# ========================== ArxSentinel Helm values =====================================
#
#   DaemonSet topology: one pod per node, reads the node's access log via hostPath.
#   Each pod writes threats.log to a configurable hostPath for Fail2Ban on that node.
#
#   Minimal install:
#     helm install arxsentinel ./deploy/container/k8s/arxsentinel \
#       --set logVolume.hostPath=/var/log/nginx
#
#   Full install with Fail2Ban on bare-metal / k3s:
#     helm install arxsentinel ./deploy/container/k8s/arxsentinel \
#       --set logVolume.hostPath=/var/log/nginx \
#       --set threatLog.hostPath=/var/log/arxsentinel
#
# =========================================================================================

image:
  repository: ghcr.io/mr-addams/arxsentinel
  tag: ""          # defaults to Chart.AppVersion when empty
  pullPolicy: IfNotPresent

# ── Log volume (required) ─────────────────────────────────────────────────────────────────
# hostPath directory on each node containing the access log.
# Mounted read-only into the container at /var/log/nginx.
logVolume:
  hostPath: /var/log/nginx   # override with actual log directory on your nodes

# Access log filename inside logVolume.hostPath.
# Combined with logVolume.hostPath to form the full path for general.log_file.
logFile: access.log

# ── Threat log (optional) ─────────────────────────────────────────────────────────────────
# hostPath for the threat log directory. When set, ArxSentinel writes threats.log here
# and the host's Fail2Ban can read it.
# Leave empty in managed cloud environments where Fail2Ban is not available.
# See README.helm.md for cloud-native alternatives (future Output Plugins).
threatLog:
  hostPath: ""   # e.g. /var/log/arxsentinel for bare-metal / k3s setups

# ── Metrics ───────────────────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  port: 9117

# ── Prometheus Operator ServiceMonitor ────────────────────────────────────────────────────
serviceMonitor:
  enabled: false
  namespace: monitoring    # namespace where the Prometheus Operator is installed
  interval: 30s
  scrapeTimeout: 10s
  # Additional labels to add to the ServiceMonitor (for Prometheus label selectors).
  additionalLabels: {}
  # release: prometheus

# ── Service ───────────────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 9117

# ── Security context ──────────────────────────────────────────────────────────────────────
# Matches the distroless:nonroot image uid/gid.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Resources ─────────────────────────────────────────────────────────────────────────────
# ArxSentinel is designed to run within these limits on a busy server.
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 20m
    memory: 32Mi

# ── Service account ───────────────────────────────────────────────────────────────────────
serviceAccount:
  create: true
  annotations: {}
  name: ""

# ── Node scheduling ───────────────────────────────────────────────────────────────────────
# Add tolerations to watch control-plane nodes as well:
#   tolerations:
#     - key: node-role.kubernetes.io/control-plane
#       operator: Exists
#       effect: NoSchedule
tolerations: []
nodeSelector: {}
affinity: {}

# ── ArxSentinel config overrides via env vars ─────────────────────────────────────────────
# These map to ARXSENTINEL_* environment variables (highest priority — override config.yaml).
# See README.helm.md for the full list of available variables.
# Scalar fields only — arrays (probe.paths, whitelist.bots, extra patterns) require custom
# config.yaml override via ConfigMap editing or a separate rendered config file.
env:
  # ── General ─────────────────────────────────────────────────────────────────────────
  ARXSENTINEL_GENERAL_PID_FILE: /tmp/arxsentinel.pid

  # ── Logging ────────────────────────────────────────────────────────────────────────
  ARXSENTINEL_LOGGING_DEBUG: "false"

  # ── Parser ─────────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_PARSER_PROFILE: "apache"
  # ARXSENTINEL_PARSER_LOG_FORMAT: "combined"

  # ── Scoring ────────────────────────────────────────────────────────────────────────
  ARXSENTINEL_SCORING_ALERT_THRESHOLD: "50"
  ARXSENTINEL_SCORING_BAN_THRESHOLD: "80"
  # ARXSENTINEL_SCORING_OBSERVATION_WINDOW: "300s"

  # ── State ──────────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_STATE_GC_INTERVAL: "60s"
  # ARXSENTINEL_STATE_MAX_TRACKED_IPS: "100000"

  # ── Detectors ──────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_DETECTORS_PROBE_ENABLED: "true"
  # ARXSENTINEL_DETECTORS_RATE_THRESHOLD: "100"
  # ARXSENTINEL_DETECTORS_BRUTEFORCE_RATIO_THRESHOLD: "0.6"
  # ARXSENTINEL_DETECTORS_USERAGENT_SCANNER_SCORE: "40"

  # ── Chain Guard ────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_CHAIN_GUARD_ENABLED: "true"
  # ARXSENTINEL_CHAIN_GUARD_WARNINGS_LOG: "/tmp/warnings.log"

  # ── Whitelist ──────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_WHITELIST_FAKE_BOT_SCORE: "35"
  # ARXSENTINEL_WHITELIST_CUSTOM_IPS: "10.0.0.1,192.168.1.100"
  # ARXSENTINEL_WHITELIST_CUSTOM_CIDRS: "10.0.0.0/8"

  # ── Output ─────────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_OUTPUT_THREAT_LOG: /var/log/arxsentinel/threats.log
  # ARXSENTINEL_OUTPUT_OPERATIONAL_LOG: /var/log/arxsentinel/sentinel.log

  # ── Metrics ────────────────────────────────────────────────────────────────────────
  # ARXSENTINEL_METRICS_USERNAME: "prometheus"
  # ARXSENTINEL_METRICS_PASSWORD_HASH: "$2y$10$..."

# ── Extra env vars (arbitrary key/value pairs) ────────────────────────────────────────────
extraEnv: []
# - name: ARXSENTINEL_SCORING_OBSERVATION_WINDOW
#   value: "600s"

# ── Naming ────────────────────────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
