# nginx JSON log format examples for arxsentinel
#
# Drop one of the snippets below into your nginx.conf (http {} block),
# then restart nginx and switch sentinel to JSON mode:
#
#   parser:
#     log_format: "json"
#
# Field names here match the arxsentinel defaults — no json_fields
# override needed.  Change takes effect on the next SIGHUP:
#   kill -HUP $(cat /run/arxsentinel/arxsentinel.pid)

# ── Variant A: direct nginx (no reverse proxy) ────────────────────────────────
#
# Use this when clients connect directly to nginx.
# $remote_addr is the real client IP.

log_format sentinel_json_direct escape=json
    '{'
        '"remote_addr":"$remote_addr",'
        '"time_iso8601":"$time_iso8601",'
        '"request":"$request",'
        '"status":"$status",'
        '"bytes_sent":"$bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

# In your server {} block:
#   access_log /var/log/nginx/access.log sentinel_json_direct;


# ── Variant B: nginx behind a reverse proxy ───────────────────────────────────
#
# Use this when nginx sits behind HAProxy, Traefik, Caddy, or another nginx.
# $real_ip is populated by ngx_http_realip_module from the X-Real-IP /
# X-Forwarded-For header set by the upstream proxy.
#
# Required in the http {} or server {} block:
#   set_real_ip_from  <proxy-ip-or-cidr>;
#   real_ip_header    X-Real-IP;   # or X-Forwarded-For
#   real_ip_recursive on;
#
# See deploy/examples/reverse-proxy/ for per-proxy setup guides.

log_format sentinel_json_proxy escape=json
    '{'
        '"remote_addr":"$remote_addr",'
        '"real_ip":"$real_ip",'
        '"time_iso8601":"$time_iso8601",'
        '"request":"$request",'
        '"status":"$status",'
        '"bytes_sent":"$bytes_sent",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent"'
    '}';

# In your server {} block:
#   access_log /var/log/nginx/access.log sentinel_json_proxy;
