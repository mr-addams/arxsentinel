# HAProxy configuration for nginx-sentinel integration.
#
# nginx-sentinel's "haproxy-http" profile parses HAProxy HTTP log format
# produced by "option httplog". The log is written to a local file via rsyslog.
#
# Note: HAProxy timestamps include milliseconds (e.g., 14:30:00.123) which
# do not match nginx time format. Timestamp-based rate window detection will
# use a zero time value — all other detectors (probe, user-agent, bruteforce)
# work normally.

global
    log /dev/log local0 info
    maxconn 50000
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    # "option httplog" produces the format sentinel's haproxy-http profile expects.
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:80
    default_backend web-servers

backend web-servers
    balance roundrobin
    server web1 127.0.0.1:8080 check

# ── rsyslog configuration to write HAProxy logs to a file ─────────────────────────────
#
# Create /etc/rsyslog.d/49-haproxy.conf:
#
#   $AddUnixListenSocket /dev/log
#   if $programname == 'haproxy' then {
#       action(type="omfile" file="/var/log/haproxy/access.log"
#              fileCreateMode="0640" fileOwner="haproxy")
#       stop
#   }
#
# Then restart rsyslog: systemctl restart rsyslog
#
# The resulting log line format (no syslog prefix in the file):
#   10.0.0.1:54321 [01/Jun/2024:12:34:56.789] http-in~ backend/server 0/0/2/8/10
#                  200 1234 - - ---- 5/4/0/1/0 0/0 "GET /index.html HTTP/1.1"
#
# If your syslog config includes a timestamp prefix, use the "regex" profile
# with a custom pattern that accounts for the prefix.
