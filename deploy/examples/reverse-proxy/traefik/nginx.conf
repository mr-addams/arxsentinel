# nginx origin config for use behind Traefik.
#
# Traefik forwards the real client IP in X-Forwarded-For.
# ngx_http_realip_module reads the header and replaces $remote_addr with the
# real client IP. arxsentinel reads $remote_addr from the access log.

http {
    # Trust the Traefik container / host address.
    # Docker Compose network: use 172.16.0.0/12.
    # Same-host deployment: use 127.0.0.1.
    # Production: replace with your actual proxy IP/CIDR.
    set_real_ip_from  172.16.0.0/12;

    # Traefik uses X-Forwarded-For (not X-Real-IP).
    real_ip_header    X-Forwarded-For;

    # Traefik may append multiple IPs to X-Forwarded-For when chaining proxies.
    # recursive=on walks the list from right to left and picks the first
    # address NOT in a trusted range — the real client IP.
    real_ip_recursive on;

    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$remote_addr"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
