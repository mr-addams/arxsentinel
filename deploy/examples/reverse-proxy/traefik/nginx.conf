# nginx origin config for use behind Traefik.
#
# Traefik forwards the real client IP in X-Forwarded-For.
# ngx_http_realip_module reads the last trusted entry and exposes it as $real_ip.

http {
    # Trust only the Traefik container / host address.
    set_real_ip_from  127.0.0.1;
    # set_real_ip_from 172.17.0.0/16;  # Docker bridge network

    # Traefik uses X-Forwarded-For (not X-Real-IP).
    real_ip_header    X-Forwarded-For;

    # Traefik may append multiple IPs to X-Forwarded-For when chaining proxies.
    # recursive=on walks the list from right to left and picks the first
    # address NOT in a trusted range — the real client IP.
    real_ip_recursive on;

    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$real_ip"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
