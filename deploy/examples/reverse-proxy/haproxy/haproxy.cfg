#
# HAProxy example config for use with nginx-sentinel.
#
# Goal: pass the real client IP to nginx via the X-Real-IP header so that
# nginx's realip module can write it as $real_ip in the access log.
# nginx-sentinel then reads $real_ip — never the proxy's address.
#
# Tested with: HAProxy 2.6+
#

global
    log /dev/log local0
    maxconn 50000
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/

    # Append client IP to X-Forwarded-For (HAProxy built-in)
    option forwardfor

    # Overwrite (or set) X-Real-IP with the actual client address.
    # del-header prevents a client from injecting a spoofed X-Real-IP.
    http-request del-header X-Real-IP
    http-request set-header X-Real-IP %[src]

    default_backend nginx_backend

backend nginx_backend
    balance roundrobin
    server nginx1 127.0.0.1:8080 check
