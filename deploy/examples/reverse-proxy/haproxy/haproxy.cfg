#
# HAProxy example config for use with arxsentinel.
#
# Goal: pass the real client IP to the backend via X-Forwarded-For so that
# the backend's realip module writes it as $remote_addr in the access log.
# arxsentinel then reads $remote_addr — never the proxy's address.
#
# Tested with: HAProxy 2.6+
#

global
    log /dev/log local0
    maxconn 50000
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http_in
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/

    # Append client IP to X-Forwarded-For. The backend reads the real client IP
    # from this header via its native realip mechanism (nginx: ngx_http_realip_module,
    # Apache: mod_remoteip, Traefik: forwardedHeaders.trustedIPs, etc.).
    option forwardfor

    default_backend nginx_backend

backend nginx_backend
    balance roundrobin
    server nginx1 127.0.0.1:8080 check
