# nginx origin config for use behind HAProxy.
#
# ngx_http_realip_module reads X-Real-IP sent by HAProxy and exposes the
# real client address as $realip_remote_addr / $real_ip variable.
# nginx-sentinel parses $real_ip from the access log — not $remote_addr.

http {
    # Trust only the HAProxy address (adjust to your actual HAProxy IP/CIDR).
    set_real_ip_from  127.0.0.1;      # haproxy on the same host
    # set_real_ip_from 10.0.0.0/8;   # haproxy in a private network

    # HAProxy sets X-Real-IP to the client address.
    real_ip_header    X-Real-IP;

    # Do not recurse through X-Forwarded-For chains — X-Real-IP is authoritative.
    real_ip_recursive off;

    # Log format: combined fields + $real_ip appended as the last field.
    # nginx-sentinel expects exactly this format when log_format is "combined".
    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$real_ip"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            # Your application backend
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
