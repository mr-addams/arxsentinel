# nginx reverse-proxy (upstream) config for use with nginx-sentinel.
#
# This nginx instance sits in front of the origin nginx.
# It forwards the real client IP to the origin via X-Real-IP.

http {
    upstream origin {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name example.com;

        # ssl_certificate / ssl_certificate_key — configure as needed

        location / {
            proxy_pass http://origin;

            # Pass the real client IP — $remote_addr is the direct TCP peer.
            # del-header prevents clients from injecting a spoofed X-Real-IP.
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto $scheme;
            proxy_set_header  Host             $host;

            # Do not forward X-Real-IP from the client — only set it ourselves.
            proxy_hide_header X-Real-IP;
        }
    }
}
