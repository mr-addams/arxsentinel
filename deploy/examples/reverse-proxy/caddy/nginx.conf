# nginx origin config for use behind Caddy.
#
# Caddy sets X-Forwarded-For and X-Real-IP headers.
# ngx_http_realip_module reads X-Real-IP and exposes the real client as $real_ip.

http {
    # Trust only the Caddy host.
    set_real_ip_from  127.0.0.1;
    # set_real_ip_from 10.0.0.0/8;

    # Caddy sets X-Real-IP directly — simpler than parsing X-Forwarded-For chains.
    real_ip_header    X-Real-IP;
    real_ip_recursive off;

    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$real_ip"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
