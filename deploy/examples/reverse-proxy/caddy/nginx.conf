# nginx origin config for use behind Caddy.
#
# Caddy sets X-Forwarded-For automatically. ngx_http_realip_module reads
# the header and replaces $remote_addr with the real client IP.
# arxsentinel reads $remote_addr from the access log — the correct IP.

http {
    # Trust the Caddy host address.
    # Docker Compose network: use 172.16.0.0/12.
    # Same-host deployment: use 127.0.0.1.
    # Production: replace with your actual proxy IP/CIDR.
    set_real_ip_from  172.16.0.0/12;

    # Caddy sets X-Forwarded-For. Walk the chain to find the first
    # non-trusted address — the real client IP.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    log_format combined_realip
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_referer" "$http_user_agent" "$remote_addr"';

    server {
        listen 8080;
        server_name _;

        access_log /var/log/nginx/access.log combined_realip;

        location / {
            proxy_pass http://127.0.0.1:3000;
        }
    }
}
