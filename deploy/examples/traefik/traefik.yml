# Traefik v2/v3 static configuration for ArxSentinel integration.
#
# ArxSentinel's "traefik" profile expects Apache Combined Log Format (CLF with Referer
# and User-Agent fields). Traefik outputs these headers only when explicitly kept via
# fields.headers.names — without this block both fields default to "-".
#
# The badbot detector requires a real User-Agent value in the log to match blocklist
# patterns. All other detectors work regardless of header capture settings.
#
# Additional fields (duration, router, service) appended by Traefik after the UA field
# are silently ignored — the sentinel regex has no end anchor.

# ── Access log configuration ───────────────────────────────────────────────────────────

accessLog:
  filePath: /var/log/traefik/access.log
  # Default format is "common" (CLF) — compatible with sentinel's "traefik" profile.
  # Do NOT set format: json — the JSON format splits method/path/proto into separate
  # fields and is not supported by the traefik profile.
  bufferingSize: 100
  fields:
    headers:
      # Drop all headers by default; keep only those needed for threat detection.
      defaultMode: drop
      names:
        User-Agent: keep   # required for badbot detector
        Referer: keep      # used by badbot ref-match

# ── Example: Real client IP behind a cloud load balancer ──────────────────────────────
#
# If Traefik sits behind a trusted proxy (e.g., Cloudflare, AWS ALB):
#
#   entryPoints:
#     web:
#       address: ":80"
#       forwardedHeaders:
#         trustedIPs:
#           - 103.21.244.0/22  # Cloudflare CIDRs
#           - 103.22.200.0/22
#
# With trustedIPs set, Traefik uses X-Forwarded-For to determine the real client IP,
# and the CLF log line reflects the correct IP in the first field.

# ── Minimal entrypoints for reference ────────────────────────────────────────────────

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

api:
  dashboard: true
  insecure: false
