# arxsentinel config for Apache httpd.
# Uses the built-in "apache" profile (Apache Combined Log Format).

parser:
  profile: "apache"

general:
  log_file: /var/log/apache2/access.log

output:
  threat_log: /var/log/arxsentinel/threats.log

# All other settings use defaults.
# See the full reference: https://github.com/mr-addams/arxsentinel#configuration
