# arxsentinel config for Caddy v2.
# Uses the built-in "caddy" profile (Apache CLF format via transform-encoder).
# See Caddyfile in this directory for the required log format configuration.

parser:
  profile: "caddy"

general:
  log_file: /var/log/caddy/access.log

output:
  threat_log: /var/log/arxsentinel/threats.log
