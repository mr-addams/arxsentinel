[nginx-sentinel]
enabled  = true
filter   = nginx-sentinel
logpath  = /var/log/nginx-sentinel/threats.log
# maxretry=1: the scorer has already aggregated the score over the window and issued a THREAT verdict.
# Fail2Ban does not accumulate — it only executes the ban on the very first match.
maxretry = 1
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=nginx-sentinel, port="http,https", protocol=tcp]
