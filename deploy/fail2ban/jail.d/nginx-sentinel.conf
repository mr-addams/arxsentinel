[nginx-sentinel]
enabled  = true
filter   = nginx-sentinel
logpath  = /var/log/nginx-sentinel/threats.log
# maxretry=1: scorer уже агрегировал score по окну и вынес вердикт THREAT.
# Fail2Ban не накапливает — только исполняет бан при первом же вхождении.
maxretry = 1
findtime = 60
bantime  = 3600
action   = iptables-multiport[name=nginx-sentinel, port="http,https", protocol=tcp]
