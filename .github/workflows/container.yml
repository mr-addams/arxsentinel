name: Container

on:
  pull_request:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

# Minimal permissions — this workflow only builds and tests, never pushes.
permissions:
  contents: read

jobs:
  container-test:
    name: Build image & run container tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: arxsentinel:local
          load: true   # load into local docker daemon for tests

      - name: Run container integration tests
        run: go test -v -tags container ./tests/container/ -timeout 120s
