name: Integration Tests

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  container:
    name: Container build & tests
    uses: ./.github/workflows/container.yml

  queue-backends:
    name: Queue backends (bbolt + redis integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # redis-server запускается в виде service container — GitHub Actions
    # гарантирует, что host:port будут видны всем step'ам job'ы через
    # localhost. Используем redis:7 (LTS-compatible) с healthcheck'ом
    # через redis-cli ping, чтобы job не стартовала до готовности Redis.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run bbolt integration tests
        # bbolt использует локальные .db файлы в t.TempDir() — никаких
        # внешних сервисов не требуется. -tags integration активирует
        # bbolt_integration_test.go; -run фильтрует только bbolt-тесты.
        run: go test -tags integration -run TestBboltIntegration ./arx-core/pkg/executor/queue/ -v -count=1

      - name: Run redis integration tests
        # redis-тесты сами проверяют доступность Redis и t.Skip если
        # его нет, но service container гарантирует что REDIS_URL
        # реален. Тот же build tag и фильтр по имени теста.
        run: go test -tags integration -run TestRedisIntegration ./arx-core/pkg/executor/queue/ -v -count=1

  integration:
    name: Integration tests (135 checks — 6×7 direct + 6 badbot + 6 blocklist + 4×6 proxy-chain + 6 CF-direct + 4×6 CF-chain + 2 chain-guard + 16 HTTP-source + 6 syslog-source)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: bash tests/integration/run.sh

      - name: Record tested product versions
        if: always()
        run: |
          mkdir -p tests/integration/logs
          out="tests/integration/logs/tested-versions.md"
          # Images remain in the daemon after 'docker compose down' — docker run reuses the
          # cached layer, adds no pull time, and gives us the real product version string.
          {
            echo "## Tested product versions"
            echo ""
            echo "| Service | Product | Version | Image |"
            echo "| ------- | ------- | ------- | ----- |"

            v=$(docker run --rm nginx:latest nginx -v 2>&1 \
              | grep -oP '(?<=nginx/)[0-9.]+' || echo "?")
            echo "| nginx | nginx | $v | \`nginx:latest\` |"

            v=$(docker run --rm httpd:latest httpd -v 2>&1 \
              | grep -oP '(?<=Apache/)[0-9.]+' || echo "?")
            echo "| apache | Apache httpd | $v | \`httpd:latest\` |"

            v=$(docker run --rm --entrypoint traefik traefik:latest version 2>&1 \
              | awk '/^Version:/{print $2}' || echo "?")
            echo "| traefik | Traefik | $v | \`traefik:latest\` |"

            v=$(docker run --rm haproxy:latest haproxy -v 2>&1 \
              | grep -oP 'HAProxy version \K[0-9]+\.[0-9]+\.[0-9]+' || echo "?")
            echo "| haproxy | HAProxy | $v | \`haproxy:latest\` |"

            # caddy: custom build — query the locally built image directly.
            v=$(docker run --rm integration-caddy caddy version 2>&1 \
              | grep -oP 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "?")
            echo "| caddy | Caddy | $v | \`caddy:latest\` (custom build) |"

            v=$(docker run --rm --entrypoint="" litespeedtech/openlitespeed:latest \
              /usr/local/lsws/bin/lshttpd -v 2>&1 \
              | grep -oP 'LiteSpeed[/ ]\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "?")
            echo "| litespeed | OpenLiteSpeed | $v | \`litespeedtech/openlitespeed:latest\` |"

          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"

      - name: Classify failures
        if: failure()
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          verify="tests/integration/logs/verify-output.txt"

          echo "## Failure analysis" >> "$summary"
          echo "" >> "$summary"

          # Run unit tests to separate our code regressions from upstream product changes.
          # A passing unit test suite means the Go binary is correct — failures are then
          # almost certainly caused by a product image update breaking our integration.
          if go test -race -count=1 ./... > /tmp/unit-tests.txt 2>&1; then
            echo "**Unit tests:** ✅ PASS — binary is intact" >> "$summary"
            echo "" >> "$summary"
            echo "> Integration failures are likely caused by upstream product changes." >> "$summary"
          else
            echo "**Unit tests:** ❌ FAIL — code regression" >> "$summary"
            echo "" >> "$summary"
            echo '```' >> "$summary"
            cat /tmp/unit-tests.txt >> "$summary"
            echo '```' >> "$summary"
            echo "" >> "$summary"
            echo "> Fix unit tests before investigating integration failures." >> "$summary"
          fi
          echo "" >> "$summary"

          [ -f "$verify" ] || { echo "_verify-output.txt not found — test runner crashed before verification_" >> "$summary"; exit 0; }

          fail_count=$(grep -c "^FAIL" "$verify" 2>/dev/null || echo 0)
          echo "**Integration failures: $fail_count**" >> "$summary"
          echo "" >> "$summary"

          # Class summary table — each class maps to a specific component to fix.
          echo "| Class | Count | Component to investigate |" >> "$summary"
          echo "| ----- | ----- | ------------------------ |" >> "$summary"
          declare -A CLASS_MEANING=(
            [server-silent]="server container: startup failure or log path/volume changed"
            [parser-miss]="sentinel: parser regex does not match current log format"
            [detector-miss]="sentinel: specific detector logic or threshold"
            [backend-silent]="proxy config: routing for /backend-X/ broken or XFF not forwarded"
            [chain-parser-miss]="sentinel: proxy-chain backend log format not matched"
            [ip-leak]="backend config: trusted_proxies/RemoteIPInternalProxy not covering proxy CIDR"
            [cf-ip-leak]="backend config: CF-Connecting-IP / X-Forwarded-For not configured for Cloudflare"
            [warnings-file-missing]="chain_guard sentinel: process did not start or warnings_log path wrong"
            [warnings-file-empty]="chain_guard sentinel: chain_guard.enabled=false or checker disabled"
            [chain-warn-missing]="chain_guard sentinel: CIDR/bogon ranges do not cover the test IP"
          )
          for cls in server-silent parser-miss detector-miss backend-silent chain-parser-miss ip-leak cf-ip-leak warnings-file-missing warnings-file-empty chain-warn-missing; do
            cnt=$(grep -c "class=$cls" "$verify" 2>/dev/null || echo 0)
            [ "$cnt" -gt 0 ] && echo "| \`$cls\` | $cnt | ${CLASS_MEANING[$cls]} |" >> "$summary"
          done
          echo "" >> "$summary"

          # Failures grouped by product — all-product-X failures strongly suggest upstream change.
          echo "### Failures by product" >> "$summary"
          echo "" >> "$summary"
          for product in nginx apache traefik caddy haproxy litespeed; do
            direct=$(grep -cE "^FAIL \[$product/" "$verify" 2>/dev/null || echo 0)
            chain=$(grep -cE "^FAIL \[chain/[^]]+→$product\]" "$verify" 2>/dev/null || echo 0)
            [ "$((direct + chain))" -gt 0 ] && \
              echo "- **$product**: $direct direct, $chain chain-backend" >> "$summary"
          done
          echo "" >> "$summary"

          # Full failure details with diagnostic context (strip PASS lines for brevity).
          echo "### Failure details" >> "$summary"
          echo '```' >> "$summary"
          grep -v "^PASS" "$verify" >> "$summary" || true
          echo '```' >> "$summary"

      - name: Upload tested versions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-versions
          path: tests/integration/logs/tested-versions.md
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: tests/integration/logs/
          retention-days: 30
          # OLS containers write stderr.log owned by root — skip to avoid EACCES.
          exclude: |
            tests/integration/logs/**/stderr.log

  validate-cookbook:
    name: Validate cookbook configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o /tmp/arxsentinel ./cmd/arxsentinel

      - name: Validate cookbook and root templates
        run: |
          find cookbook/ -name "*.yaml" | sort | while read -r f; do
            /tmp/arxsentinel validate --config "$f" || { echo "INVALID: $f"; exit 1; }
          done
          echo "all configs valid"

  # ────────────────────── Build profiles (Flow 075, ADR-003) ───────────────────
  # Static verifier runs once for all profiles; build/test jobs depend on it
  # so profile builds are skipped entirely if the verifier fails. The full
  # profile is already covered by `queue-backends`/`integration`/`validate-cookbook`
  # (default build, no tags) — not duplicated here.

  build-profiles-verify:
    name: Build profiles static verifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run check-build-profiles.sh
        run: bash scripts/check-build-profiles.sh

  build-minimal:
    name: Build & test (minimal profile)
    needs: [build-profiles-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build (minimal)
        run: go build -tags "arx_tag minimal" ./...
      - name: Test (minimal)
        run: go test -tags "arx_tag minimal" ./... -timeout 120s

  build-iot:
    name: Build & test (iot profile)
    needs: [build-profiles-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build (iot)
        run: go build -tags "arx_tag iot" ./...
      - name: Test (iot)
        run: go test -tags "arx_tag iot" ./... -timeout 120s
