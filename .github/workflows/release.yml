name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'VERSION'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.2.0). Overrides dev-tag-based calculation.'
        required: true

# contents:write — create tag and GitHub Release.
# pull-requests:write — open auto VERSION-bump PR to dev after stable release.
# packages:write — push Docker images to ghcr.io.
# actions:write — explicitly trigger the Pages deploy workflow (see last step).
permissions:
  contents: write
  pull-requests: write
  packages: write
  actions: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  # ─── freebsd-integration-gate ────────────────────────────────────────────
  # Added 2026-07-03 — mirrors dev-release.yml's job of the same name
  # (added 2026-07-02, gating tightened same day after a live gap was
  # found: see release-tag's comment below). Ported here because
  # release.yml previously had NO FreeBSD coverage at all — a stable
  # release could publish with FreeBSD support silently broken. Same
  # reusable-workflow call, same 6-backend suite.
  freebsd-integration-gate:
    name: FreeBSD integration gate (gates release-tag)
    uses: ./.github/workflows/freebsd-integration.yml

  # ─── release-tag ──────────────────────────────────────────────────────────
  # Split out of `release` 2026-07-03, mirroring dev-release.yml's dev-tag
  # split (2026-07-02): `release` (Linux publish) and freebsd-container-image
  # run in parallel as siblings, both consuming this job's tag output —
  # neither waits on the other, and neither runs at all unless BOTH
  # `integration` and `freebsd-integration-gate` passed on this commit.
  # Before this existed, release.yml had no FreeBSD gating whatsoever —
  # a stable release could tag and publish even with FreeBSD support
  # completely broken, the exact gap dev-release.yml closed on 2026-07-02
  # (live run 28617320029: fbsd-integration-litespeed failed, yet a dev
  # pre-release still published normally) but that fix was never ported
  # to this file until now.
  #
  # No `go test` step here, matching dev-tag's same fix: it would
  # duplicate `integration.yml:88`'s identical `go test -race -count=1
  # ./...`, which `integration` (a hard `needs:` prerequisite) already ran.
  release-tag:
    name: Resolve stable version and create tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      skip: ${{ steps.tag.outputs.skip }}
    runs-on: ubuntu-latest
    needs: [integration, freebsd-integration-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is required by goreleaser to read the full tag history for the changelog.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve stable version from last dev tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="v${INPUT_VERSION}"
          else
            LAST_DEV=$(git tag --list 'v*-dev.*' --sort=-version:refname | head -1)
            if [ -z "$LAST_DEV" ]; then
              echo "No dev tags found — cannot determine stable version" >&2
              exit 1
            fi
            TAG="${LAST_DEV%-dev.*}"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # Tag exists — skip only if a real GitHub Release is already published.
            # An orphaned tag (goreleaser failed mid-run) must be removed so goreleaser
            # can start clean; otherwise it would skip and leave the release unpublished.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already published — nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Orphaned tag $TAG found (no GitHub Release) — deleting and re-creating"
            git push origin --delete "$TAG"
            git tag -d "$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Build & publish stable release
    runs-on: ubuntu-latest
    needs: release-tag
    if: needs.release-tag.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 is required by goreleaser to read the full tag history for the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # docker-container driver is required for multi-platform builds with SBOM attestation.
          # GoReleaser v2 dockers_v2 passes --attest=type=sbom by default; the default docker
          # driver does not support attestation and fails with "Attestation is not supported".
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested versions
        uses: actions/download-artifact@v8
        with:
          name: integration-versions
          path: .
        continue-on-error: true

      - name: Append tested versions to release notes
        if: success()
        run: |
          tag="${{ needs.release-tag.outputs.tag }}"
          if [ -f tested-versions.md ]; then
            current=$(gh release view "$tag" --json body -q '.body')
            gh release edit "$tag" \
              --notes "$(printf '%s\n\n---\n\n%s' "$current" "$(cat tested-versions.md)")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── post-release ─────────────────────────────────────────────────────────
  # Split out of `release` (2026-07-03) so release housekeeping is
  # RETRYABLE IN ISOLATION. When the VERSION bump failed on live run
  # 28649765331 (missing git identity), the only recovery was manual git
  # surgery: re-running the `release` job would have re-run goreleaser
  # against the already-published tag+Release. With bump + Pages trigger in
  # their own job, "Re-run failed jobs" re-executes just this job and never
  # touches goreleaser. The bump script itself is idempotent (skips when
  # dev is already at next) and resilient to partial previous attempts
  # (force-push over a stale bump branch, reuses an already-open bump PR).
  post-release:
    name: Bump dev VERSION & trigger Pages
    runs-on: ubuntu-latest
    needs: [release-tag, release]
    if: needs.release-tag.outputs.skip != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        # Fresh runner — git identity never carries over from other jobs.
        # This exact gap (identity configured only in release-tag) is what
        # killed the bump step on run 28649765331 with "fatal: empty ident
        # name ... not allowed".
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump VERSION for next development cycle
        run: |
          released="${{ needs.release-tag.outputs.tag }}"
          released="${released#v}"
          IFS='.' read -r major minor patch <<< "$released"
          next="${major}.${minor}.$((patch + 1))"

          git fetch origin dev
          dev_version=$(git show origin/dev:VERSION 2>/dev/null || echo "")
          if [ "$dev_version" = "$next" ]; then
            echo "dev already at $next — skipping bump"
            exit 0
          fi

          branch="chore/bump-version-${next}"
          # -B (not -b): tolerate a leftover local branch from any earlier
          # step in a re-run of this job.
          git checkout -B "$branch" origin/dev
          git merge -X ours --no-edit origin/main
          echo "$next" > VERSION

          # Sync all version strings in landing pages to the just-released stable version.
          sed -i -E "s|(softwareVersion\": \")[0-9]+\.[0-9]+\.[0-9]+(\")|\\1${released}\\2|g" docs/*.html
          sed -i -E "s|(badge-version\">v)[0-9]+\.[0-9]+\.[0-9]+(<)|\\1${released}\\2|g" docs/*.html
          sed -i -E "s|(section-tag\">[^v<]*v)[0-9]+\.[0-9]+\.[0-9]+|\\1${released}|g" docs/*.html

          git add VERSION docs/*.html
          git commit -m "chore: bump VERSION to ${next}"
          # --force: a stale remote branch left by a previously interrupted
          # bump attempt must not block the retry — this job is designed to
          # be safely re-runnable.
          git push --force origin "$branch"

          # Reuse an already-open bump PR from a previous attempt — `gh pr
          # create` fails outright when one already exists for this head.
          pr_url=$(gh pr list --head "$branch" --base dev --state open \
            --json url -q '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create \
              --title "chore: bump VERSION to ${next}" \
              --body "Automatic version bump after stable release v${released}. Next dev cycle: v${next}-dev.1" \
              --base dev)
          fi

          # --squash is load-bearing, not stylistic: the single squash
          # commit is created (and signed) server-side by GitHub, satisfying
          # dev's required_signatures ruleset even though the underlying bot
          # commit is unsigned AND the bump branch carries main's historical
          # unsigned merge commits (16 of them, pre-ruleset era — they block
          # any true merge-commit into dev, proven live on PR #268).
          # --admin bypasses the CLI's BLOCKED pre-flight for those same
          # unverified underlying commits.
          gh pr merge "$pr_url" --squash --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pages does not auto-deploy after a workflow_dispatch release: the
      # workflow_run trigger in pages.yml does not fire in the dispatch→run chain.
      # Trigger the deploy explicitly so the landing page always reflects the new
      # stable version (pages.yml self-patches version strings via gh release list).
      # Runs AFTER the bump (order matters: if this trigger hiccups, the bump
      # is already committed — the reverse order could lose the bump).
      #
      # !cancelled(): a FAILED bump step must not skip this deploy — the
      # landing page's version comes from `gh release list` inside pages.yml,
      # not from the bump. On the v2.2.2 release (run 28649765331) the old
      # in-release-job layout skipped this exact step after the bump failure,
      # leaving the live landing on v2.2.1 until the bump was completed
      # manually ~30 minutes later.
      - name: Trigger Pages deploy
        if: ${{ !cancelled() }}
        run: gh workflow run pages.yml --ref dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── freebsd-container-image ─────────────────────────────────────────────
  # Added 2026-07-03 — ported from dev-release.yml's proven job of the same
  # name (Flow 090 Decision 7, arch-matrix + host-cross-compile additions
  # 2026-07-02). release.yml previously had NO FreeBSD-native container at
  # all — only dev pre-releases got one. Runs IN PARALLEL with `release`
  # (Linux publish), both as siblings off release-tag; neither waits on
  # the other, and neither runs unless the FreeBSD integration gate passed.
  #
  # Why not in goreleaser dockers_v2: goreleaser uses docker buildx, which
  # does not support building FreeBSD images from a Linux host. The FreeBSD
  # image must be built inside a vmactions/freebsd-vm QEMU guest via podman
  # build.
  #
  # Arch matrix: amd64 (x86_64) + arm64 (aarch64) only — vmactions/
  # freebsd-vm's `arch:` input doesn't support 386 or 32-bit arm as a guest
  # architecture at all, and Go has no freebsd/riscv64 target. The base
  # image (Containerfile.freebsd) is pinned to the freebsd-static multi-arch
  # OCI index, so podman resolves the correct per-arch leaf automatically —
  # no per-arch FROM line needed.
  #
  # Binaries are cross-compiled on the plain Linux host BEFORE the VM boots
  # (not natively inside the VM): live run 28621885498 showed a native
  # in-VM arm64 build take 17m03s under QEMU emulation vs 3m05s for amd64;
  # cross-compiling here cut arm64 down to ~8m. vmactions/freebsd-vm mounts
  # the entire $GITHUB_WORKSPACE tree into the VM at the same path before
  # `run:` executes, so the host-built binary shows up inside the VM for
  # free.
  #
  # Tag scheme differs from dev-release.yml's floating tag on purpose:
  # dev-release.yml's freebsd-container-image job (2026-07-03 fix, same
  # commit as this job's addition) now pushes ONLY the version-pinned tag
  # (`<dev-tag>-freebsd-<arch>`) — no floating tag at all, matching
  # goreleaser's own Linux convention (`.goreleaser.yaml`:
  # `{{ if not .Prerelease }}latest{{ end }}` — prereleases never get
  # `latest`). This job, being the STABLE release path, is the only one
  # that pushes the floating `freebsd-<arch>-latest` tag. Before this fix,
  # dev-release.yml pushed that same floating tag on every dev push,
  # meaning any stable "latest" would have been overwritten by the very
  # next dev pre-release.
  freebsd-container-image:
    name: FreeBSD container image (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: release-tag
    if: needs.release-tag.outputs.skip != 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            vmarch: x86_64
          - goarch: arm64
            vmarch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Cross-compile FreeBSD binaries (host, no emulation)
        run: |
          mkdir -p .ci-freebsd-build
          CGO_ENABLED=0 GOOS=freebsd GOARCH="${{ matrix.goarch }}" \
              go build -o .ci-freebsd-build/arxsentinel ./cmd/arxsentinel
          CGO_ENABLED=0 GOOS=freebsd GOARCH="${{ matrix.goarch }}" \
              go build -o .ci-freebsd-build/healthcheck ./cmd/healthcheck || \
              echo "::notice::cmd/healthcheck build failed — image will skip healthcheck"
          ls -la .ci-freebsd-build/

      - name: Build FreeBSD image and push to ghcr.io
        id: freebsd_image
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          arch: ${{ matrix.vmarch }}
          release: "14.3"
          usesh: true
          copyback: true
          # RELEASE_TAG/GOARCH are custom (non-GITHUB_-prefixed) env vars -
          # they do NOT match a GITHUB_* glob and must be listed
          # explicitly, unlike GITHUB_TOKEN/GITHUB_ACTOR which vmactions
          # forwards by name here.
          envs: 'GITHUB_TOKEN GITHUB_ACTOR RELEASE_TAG GOARCH'
          run: |
            set -eu

            # Pass through the tag from the release-tag job. The job's
            # `needs: release-tag` guarantees this is non-empty by the
            # time we run. GOARCH comes from the matrix (amd64/arm64) via
            # the envs: directive above.
            TAG="${RELEASE_TAG}"
            if [ -z "${TAG}" ]; then
              echo "::error::RELEASE_TAG env var not set; cannot derive image tag" >&2
              exit 1
            fi
            IMAGE_TAG="ghcr.io/mr-addams/arxsentinel:${TAG}-freebsd-${GOARCH}"
            # Stable-only floating tag (see job header comment for why
            # this differs from dev-release.yml's version-pinned-only push).
            IMAGE_LATEST="ghcr.io/mr-addams/arxsentinel:freebsd-${GOARCH}-latest"
            echo "Target images:"
            echo "  version-tagged: ${IMAGE_TAG}"
            echo "  floating-latest: ${IMAGE_LATEST}"

            # ── Unblock chain (verbatim from 088 Decision E.2b + F.1) ──────────
            # Each vmactions/freebsd-vm step is a FRESH FreeBSD VM. Storage
            # defaults to driver=zfs which fails in the QEMU/UFS VM (no zpool),
            # and pf kernel module required for CNI bridge is not loaded by
            # default. Both must be fixed before any `podman build`/`podman run`.

            echo "::group::pkg install podman"
            # No `go` here — binaries are cross-compiled on the Linux host
            # before this VM even boots (see the "Cross-compile FreeBSD
            # binaries" step above). This VM only needs podman to
            # build/push/smoke-test the image.
            pkg install -y sysutils/podman jq
            echo "::endgroup::"

            echo "::group::storage fix (zfs→vfs)"
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            echo "Effective storage driver:"
            podman info --format '{{.Store.GraphDriverName}}'
            echo "::endgroup::"

            echo "::group::pf kernel module + egress interface"
            kldload pf || true
            if [ ! -f /etc/pf.conf ]; then
              cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf
            fi
            EGRESS_IF=$(ifconfig -l | awk '{print $1}')
            echo "Detected interfaces: $(ifconfig -l)"
            echo "Using egress interface: ${EGRESS_IF:-vtnet0}"
            sed -I .bak -e "s/^v4egress_if=.*/v4egress_if=${EGRESS_IF:-vtnet0}/" \
                -e "s/^v6egress_if=.*/v6egress_if=${EGRESS_IF:-vtnet0}/" /etc/pf.conf
            sysrc pf_enable=YES
            service pf start || service pf restart
            sysctl net.pf.filter_local=1
            echo "::endgroup::"

            # ── Stage the host-cross-compiled binaries ───────────────────────
            echo "::group::stage host-built binaries (cmd/arxsentinel + cmd/healthcheck)"
            cd "$GITHUB_WORKSPACE"
            mkdir -p /tmp/build
            cp .ci-freebsd-build/arxsentinel /tmp/build/arxsentinel
            if [ -f .ci-freebsd-build/healthcheck ]; then
              cp .ci-freebsd-build/healthcheck /tmp/build/healthcheck
            else
              echo "::notice::cmd/healthcheck build failed on host — image will skip healthcheck"
            fi
            ls -la /tmp/build/
            echo "::endgroup::"

            echo "::group::stage config.docker.yaml into build context"
            cp "$GITHUB_WORKSPACE/deploy/container/docker/config.docker.yaml" \
               /tmp/build/config.docker.yaml
            echo "::endgroup::"

            # ── podman build against Containerfile.freebsd ───────────────────────
            echo "::group::podman build arxsentinel:freebsd-local"
            podman build \
                -t arxsentinel:freebsd-local \
                -f "$GITHUB_WORKSPACE/deploy/container/freebsd/Containerfile.freebsd" \
                /tmp/build/
            echo "[debug] podman build finished, exit $?"
            echo "::endgroup::"

            echo "::group::smoke test podman run --version"
            set +e
            podman run --rm arxsentinel:freebsd-local --version
            SMOKE_RC=$?
            set -e
            if [ "$SMOKE_RC" -ne 0 ]; then
                echo "::error::smoke test failed with exit code ${SMOKE_RC}"
                exit "$SMOKE_RC"
            fi
            echo "::endgroup::"

            # ── podman login + push to ghcr with both tag variants ───────────────
            echo "::group::podman login + push"
            echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            podman tag arxsentinel:freebsd-local "${IMAGE_TAG}"
            podman tag arxsentinel:freebsd-local "${IMAGE_LATEST}"
            podman push "${IMAGE_TAG}"
            podman push "${IMAGE_LATEST}"
            echo "::endgroup::"

            echo "::group::finalize"
            echo "Pushed: ${IMAGE_TAG}"
            echo "Pushed: ${IMAGE_LATEST}"
            echo "::endgroup::"
        env:
          RELEASE_TAG: ${{ needs.release-tag.outputs.tag }}
          GOARCH: ${{ matrix.goarch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
