name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/**'

# contents:write — create tag and GitHub Release.
# pull-requests:write — open auto VERSION-bump PR to dev after stable release.
# packages:write — push Docker images to ghcr.io.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  release:
    name: Build & publish stable release
    runs-on: ubuntu-latest
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required by goreleaser to read the full tag history for the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve stable version from last dev tag
        id: tag
        run: |
          LAST_DEV=$(git tag --list 'v*-dev.*' --sort=-version:refname | head -1)
          if [ -z "$LAST_DEV" ]; then
            echo "No dev tags found — cannot determine stable version" >&2
            exit 1
          fi
          TAG="${LAST_DEV%-dev.*}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            # Tag exists — skip only if a real GitHub Release is already published.
            # An orphaned tag (goreleaser failed mid-run) must be removed so goreleaser
            # can start clean; otherwise it would skip and leave the release unpublished.
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already published — nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Orphaned tag $TAG found (no GitHub Release) — deleting and re-creating"
            git push origin --delete "$TAG"
            git tag -d "$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.tag.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          # docker-container driver is required for multi-platform builds with SBOM attestation.
          # GoReleaser v2 dockers_v2 passes --attest=type=sbom by default; the default docker
          # driver does not support attestation and fails with "Attestation is not supported".
          driver: docker-container

      - name: Login to GitHub Container Registry
        if: steps.tag.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        if: steps.tag.outputs.skip != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested versions
        if: steps.tag.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: integration-versions
          path: .
        continue-on-error: true

      - name: Append tested versions to release notes
        if: success() && steps.tag.outputs.skip != 'true'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ -f tested-versions.md ]; then
            current=$(gh release view "$tag" --json body -q '.body')
            gh release edit "$tag" \
              --notes "$(printf '%s\n\n---\n\n%s' "$current" "$(cat tested-versions.md)")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION for next development cycle
        if: success() && steps.tag.outputs.skip != 'true'
        run: |
          current=$(cat VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"

          branch="chore/bump-version-${next}"
          git fetch origin dev
          git checkout -b "$branch" origin/dev
          git merge -X ours --no-edit origin/main
          echo "$next" > VERSION

          # Sync all version strings in landing pages to the just-released stable version.
          sed -i -E "s|(softwareVersion\": \")[0-9]+\.[0-9]+\.[0-9]+(\")|\\1${current}\\2|g" docs/*.html
          sed -i -E "s|(badge-version\">v)[0-9]+\.[0-9]+\.[0-9]+(<)|\\1${current}\\2|g" docs/*.html
          sed -i -E "s|(section-tag\">[^v<]*v)[0-9]+\.[0-9]+\.[0-9]+|\\1${current}|g" docs/*.html

          git add VERSION docs/*.html
          git commit -m "chore: bump VERSION to ${next}"
          git push origin "$branch"

          pr_url=$(gh pr create \
            --title "chore: bump VERSION to ${next}" \
            --body "Automatic version bump after stable release v${current}. Next dev cycle: v${next}-dev.1" \
            --base dev)

          # --admin bypasses required_signatures ruleset — bot commits are unsigned.
          gh pr merge "$pr_url" --squash --delete-branch --admin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
