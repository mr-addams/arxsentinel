                echo "[integration-traefik] WARN: Linux emul may need a reboot the VM can't do; podman run --os=linux may fail"
            fi

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
