            # sed -i '' is the in-place edit syntax on FreeBSD (BSD
            # sed). v4egress_if / v6egress_if are top-level shell
            # assignments in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-traefik] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-traefik] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-traefik] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-traefik] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here,
            # NOT inside a container. CGO_ENABLED=0 produces a fully-
            # static binary (drop-in compatible with the Linux
            # distroless / FreeBSD freebsd-static final stages).
            # -trimpath + -ldflags="-s -w -X main.version=$(cat VERSION)"
            # mirrors the Linux Dockerfile's build args so the
            # binary's --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # integration.sh (P3.4) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-traefik] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-traefik] arxsentinel build FAILED"
            # version-check: --version is a supported flag
            # (cmd/arxsentinel/main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-traefik] arxsentinel --version FAILED"

            # Marker for the log artifact's last line (Phase P3 will
            # append the integration.sh output below this block — kept
            # for the cat-after-write emit point).
            echo
            echo "=== integration-traefik unblock chain end @ $(date -u +%FT%TZ) ==="
            echo

            # ----------------------------------------------------------------
            # P3.4 — invoke integration.sh with SCOPED TMPDIR (per
            # Flow 088 Decision G.1e).
            # ----------------------------------------------------------------
            # CRITICAL: `TMPDIR="$GITHUB_WORKSPACE"` is a per-command
            # environment assignment — POSIX single-command form, NOT
            # `export TMPDIR="$GITHUB_WORKSPACE"`. The exported form
            # poisons Go module-mode detection for any `go build` that
            # runs AFTER it: Go sees cwd == TMPDIR and refuses to use
            # the go.mod there ("ignoring go.mod in system temp root").
            # The 088 G.1 first run (Actions run 28462048606) hit this
            # cascade — `export TMPDIR` at the top of the run block
            # silently broke the integration-smoke's native `go build`,
            # which then cascaded to a misleading "no local image"
            # error from the smoke. 088 DECISIONS.md §"Decision G.1e"
            # documents the full postmortem and the scoped-per-command
            # fix. We invoke the same pattern verbatim here.
            #
            # Why this matters even though the go build runs BEFORE
            # the integration.sh invocation: defensively, the scoped
            # form also protects any future step added below this
            # point (e.g. a follow-up integration-traefik iteration
            # adding a `go test` after the smoke). 088 G.1e says
            # "any future VM-action job that mixes go build with a
            # script using TMPDIR MUST scope TMPDIR per-command,
            # not export it" — we obey unconditionally.
            #
            # The integration.sh exit code is recorded but not
            # short-circuited to a workflow failure: the job runs
            # with continue-on-error: true (DECISIONS §6 research-
            # grade). A red run is a recorded finding in the
            # downloadable smoke-log.txt, not a flow-blocker.
            # ----------------------------------------------------------------
            echo "[integration-traefik] invoking integration.sh with scoped TMPDIR=\$GITHUB_WORKSPACE"
            TMPDIR="$GITHUB_WORKSPACE" sh tests/integration-freebsd/traefik/integration.sh \
                && echo "[integration-traefik] integration.sh exit: 0 (3 assertions green)" \
                || echo "[integration-traefik] integration.sh exit: non-zero (recorded in smoke-log; DECISIONS §6 — research-grade, not a flow-blocker)"

            echo
            echo "=== integration-traefik integration.sh end @ $(date -u +%FT%TZ) ==="
            } > "$GITHUB_WORKSPACE/smoke-log.txt" 2>&1

            # Flow 088 TD-13 cat-after-write pattern: re-emit the log
            # inline in the Actions run-log (collapsible group) AND
            # keep it downloadable as the artifact. Without this the
            # log is artifact-only-debug, requiring a download to
            # triage. See Flow 088 TECH_DEBT.md TD-13.
            echo "::group::Full smoke log (also in the uploaded smoke-log.txt artifact)"
            cat "$GITHUB_WORKSPACE/smoke-log.txt"
            echo "::endgroup::"
            echo "smoke-log written to $GITHUB_WORKSPACE/smoke-log.txt"
            ls -l "$GITHUB_WORKSPACE/smoke-log.txt"

            # ----------------------------------------------------------------
            # P3.4 — inline ::group:: + cat for the threat log and
            # the traefik access log. Both are also uploaded as
            # artifacts by the `Upload integration-traefik artifacts`
            # step below (P3.4 — if: always() + if-no-files-found:
            # warn so red runs still produce the artifact for
            # triage). The ::group:: blocks here are for INLINE
            # run-log visibility — without them the threat log and
            # access log are artifact-only-debug, requiring a download
            # to triage the run. Same Flow 088 TD-13 cat-after-write
            # pattern as the smoke-log block above.
            #
            # DECISIONS: §5 (UA-based grader — three assertions on the
            # threat log; inline visibility is what makes the
            # assertion output visible in the Actions run-log, not
            # just in the downloaded artifact); §6 (continue-on-error
            # — the cat commands are best-effort, missing files just
            # print an ls-not-found message inline, no abort).
            # ----------------------------------------------------------------
            echo "::group::threats-traefik.log (also in uploaded artifact integration-traefik/threats-traefik.log.smoke)"
            if [ -s "$GITHUB_WORKSPACE/threats-traefik.log.smoke" ]; then
                cat "$GITHUB_WORKSPACE/threats-traefik.log.smoke"
            else
                echo "[integration-traefik] threats-traefik.log.smoke missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "threats-traefik.log.smoke size: $(wc -c < "$GITHUB_WORKSPACE/threats-traefik.log.smoke" 2>/dev/null || echo 0) bytes"

            echo "::group::traefik access log (also in uploaded artifact integration-traefik/traefik-access.log)"
            if [ -s "$GITHUB_WORKSPACE/traefik-access.log" ]; then
                cat "$GITHUB_WORKSPACE/traefik-access.log"
            else
                echo "[integration-traefik] traefik-access.log missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "traefik-access.log size: $(wc -c < "$GITHUB_WORKSPACE/traefik-access.log" 2>/dev/null || echo 0) bytes"

      - name: Upload integration-traefik artifacts
        # smoke-log.txt: the full VM run log (P3.4)
        # threats-traefik.log.smoke: the sentinel threat log (P3.4
        #   copy, mirrored to $GITHUB_WORKSPACE so copyback returns it)
        # traefik-access.log: the raw traefik access log the sentinel
        #   read (P3.4 copy, same path; lets the user cross-reference
        #   threat log entries with the access-log line that triggered
        #   them during triage)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-traefik
          path: |
            smoke-log.txt
            threats-traefik.log.smoke
            traefik-access.log
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # integration-haproxy — Flow 091 P4 (DECISIONS §1: haproxy third, log-
  # format engineering needed — `capture request header User-Agent` in
  # the frontend block for badbot testability per Decision 4 matrix).
  # -------------------------------------------------------------------
  integration-haproxy:
    # Promoted (Task P4.8): continue-on-error dropped after 2 consecutive
    # green live dispatches (runs 28557166919, 28557311294 — both
    # "[haproxy] PASS: all 3 assertions green", exit 0) per DECISIONS
    # section 6's promotion criterion. HAProxy logs to stdout, captured
    # via `podman logs --follow` instead of a -v bind-mount; the
    # `capture request header User-Agent` directive lives in
    # haproxy.cfg, NOT the run-script.
    name: integration-haproxy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run haproxy integration smoke inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          copyback: true
          envs: 'GITHUB_*'
          # Phase P4 fills in the unblock chain (storage sed + pf setup
          # + native go build) + tests/integration-freebsd/haproxy/
          # integration.sh invocation. The body below is verbatim from
          # the traefik job (P3 already promoted, P3.4 wrap of unblock
          # chain + scoped TMPDIR + cat-after-write + upload-artifact)
          # with two textual substitutions:
          #   1. "[integration-traefik]" → "[integration-haproxy]" in
          #      the leading run-script log tag (P4.6 triage scoping).
          #   2. "traefik" → "haproxy" in:
          #      - the run-script path (tests/integration-freebsd/haproxy/
          #        integration.sh)
          #      - the threat-log copy (threats-haproxy.log.smoke)
          #      - the access-log copy (haproxy-access.log)
          #      - the artifact name (integration-haproxy, unchanged)
          #   No other divergences — the unblock chain is identical
          #   (same podman pkg, same storage.conf fix, same pf setup,
          #   same go build). haproxy uses the upstream
          #   docker.io/library/haproxy:latest image (G13, verified
          #   against tests/integration/docker-compose.yml:75-89),
          #   so no host-side docker build / podman load step is
          #   needed (caddy needed that for transform-encoder; traefik
          #   and haproxy use the upstream image directly).
          run: |
            # NO `set -e`: this job is exploratory (DECISIONS §6 —
            # research-grade on first iterations). A red haproxy
            # integration is a recorded finding in the downloadable
            # smoke-log.txt, not a flow-blocker. `set -o pipefail` only,
            # so any individual command can fail and the log captures
            # the failure context.

            # P4.4 — wrap the whole run block in a single FD redirect
            # to $GITHUB_WORKSPACE/smoke-log.txt. The block below
            # (Task 2.2 storage sed + 2.3 pf + 2.4 go build + Phase P4
            # haproxy integration + P4.4 wire-up) lives INSIDE this
            # { ... } group. Whatever the VM prints (success OR
            # failure) lands in smoke-log.txt and is then re-emitted
            # inline + uploaded as an artifact — Flow 088 TD-13
            # cat-after-write pattern.
            {
            # Marker for the log artifact's first line.
            echo "=== integration-haproxy run @ $(date -u +%FT%TZ) ==="
            echo "=== host: $(uname -a) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.1 — podman install + Linux compat layer enable.
            # ----------------------------------------------------------------
            # `docker.io/library/haproxy:latest` (used by
            # tests/integration-freebsd/haproxy/integration.sh step 3)
            # is a Linux OCI image. FreeBSD's sysutils/podman pulls
            # Linux images under the Linux compatibility layer, which
            # must be enabled BEFORE the first `podman run --os=linux`.
            # Per the FreeBSD podman pkg-message (quoted verbatim in
            # Flow 088 DECISIONS.md §"Group B" / "B.3 step 2") the
            # recipe is:
            #   sysrc linux_enable=YES
            #   service linux start
            # The service start is BEST-EFFORT: the vmactions VM has
            # no reboot, and on first boot the linux.ko module may not
            # be loadable until after a reboot we cannot perform. The
            # 088 alpine-spike B.3 step 2 carries the same caveat
            # (DECISIONS §"A.2" "Linux compat may need a reboot we
            # can't do in-CI"). We log the failure to smoke-log.txt
            # but do not abort: the native FreeBSD run-smoke.sh case
            # doesn't need Linux compat, and the integration.sh
            # haproxy pull may still succeed on a VM where linux.ko
            # was already loaded by the vmactions image's first-boot
            # rc sequence.
            #
            # `pkg install -y sysutils/podman` MUST run before the
            # sed storage.conf fix in Task 2.2 (the file
            # /usr/local/etc/containers/storage.conf is installed by
            # the sysutils/podman pkg). The FreeBSD pkg cache is empty
            # in a fresh vmactions VM, so this pulls the binary pkg
            # from FreeBSD's pkg mirror; expect ~30-60s on first run.
            # ----------------------------------------------------------------
            pkg install -y sysutils/podman || \
                echo "[integration-haproxy] pkg install podman FAILED"
            podman --version || \
                echo "[integration-haproxy] podman --version FAILED"
            sysrc linux_enable=YES || \
                echo "[integration-haproxy] sysrc linux_enable=YES FAILED"
            # service linux start: best-effort, log failure but do not
            # abort. The 088 §B.3 spike step 2 has the same
            # disposition. A red run here is a finding for the
            # triage-haproxy-1.md (when it gets written), not a
            # flow-blocker (DECISIONS.md §6).
            if service linux start; then
                echo "[integration-haproxy] service linux start: ok"
            else
                echo "[integration-haproxy] WARN: service linux start failed" >&2
                echo "[integration-haproxy] WARN: Linux emul may need a reboot the VM can't do; podman run --os=linux may fail"
            fi

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
            # /usr/local/etc/containers/storage.conf with `driver = "zfs"`.
            # Correct on real FreeBSD ZFS installs; WRONG inside the
            # vmactions/freebsd-vm QEMU VM whose rootfs has no zpool
            # (UFS/RAW). Without this fix, every `podman run` hard-fails
            # with "no zfs dataset found for rootdir". Switch to vfs
            # (file-backed, works in any filesystem). MUST run BEFORE
            # any `podman run` / `podman build` later in this run block.
            #
            # Why this is repeated here (not shared with another job):
            # each vmactions/freebsd-vm step spawns a fresh VM that
            # ships the default zfs storage.conf; the file lives at
            # /usr/local/etc/containers/storage.conf on the VM (NOT
            # under the synced $GITHUB_WORKSPACE), so a host-side
            # pre-step cannot deduplicate it. Same rationale as Flow
            # 088 DECISIONS §"Decision E.2b" (storage-driver sed fix
            # must repeat in every VM-action step).
            # ----------------------------------------------------------------
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            # Reaffirm effective driver — should now print "vfs".
            podman info --format '{{.Store.GraphDriverName}}' || \
                echo "[integration-haproxy] post-storage-sed podman info FAILED"

            # ----------------------------------------------------------------
            # Task 2.3 — pf kernel module setup.
            # ----------------------------------------------------------------
            # After the storage fix, the NEXT blocker is the pf kernel
            # module. Live Actions run 28457774103 (Flow 088) showed
            # every `podman run` hard-fails at network initialisation
            # with:
            #   Error: plugin type="bridge" failed (add): cni plugin
            #   bridge failed: The pf kernel module must be loaded to
            #   support ipMasq networks
            # The FreeBSD podman pkg-message documents the fix verbatim.
            # This block is INSIDE the run: block (NOT a workflow-level
            # composite action) for the same reason as Task 2.2: each
            # vmactions/freebsd-vm step = a fresh VM with no pf loaded
            # and no /etc/pf.conf (system file, not under the synced
            # $GITHUB_WORKSPACE). See Flow 088 DECISIONS §"Group F"
            # Decision F.1 (the single blocker is pf) + Decision F.2
            # (egress interface detect with ifconfig -l diagnostic +
            # vtnet0 default).
            #
            # Order matters: storage sed (2.2) → pf setup (2.3) →
            # first `podman run` later in this run block. If pf is not
            # loaded before the first CNI bridge use, the first podman
            # run dies at network init.
            # ----------------------------------------------------------------
            # Diagnostic: capture the actual interface list. vtnet0 is
            # the QEMU/virtio default that vmactions/freebsd-vm uses;
            # if the guess is wrong, the ifconfig -l output above shows
            # the real name in the downloadable smoke-log.txt without a
            # second CI run.
            ifconfig -l
            cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf || \
                echo "[integration-haproxy] pf.conf.sample copy FAILED"
            # sed -i '' is the in-place edit syntax on FreeBSD (BSD
            # sed). v4egress_if / v6egress_if are top-level shell
            # assignments in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-haproxy] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-haproxy] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-haproxy] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-haproxy] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here,
            # NOT inside a container. CGO_ENABLED=0 produces a fully-
            # static binary (drop-in compatible with the Linux
            # distroless / FreeBSD freebsd-static final stages).
            # -trimpath + -ldflags="-s -w -X main.version=$(cat VERSION)"
            # mirrors the Linux Dockerfile's build args so the
            # binary's --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # integration.sh (P4.4) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-haproxy] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-haproxy] arxsentinel build FAILED"
            # version-check: --version is a supported flag
            # (cmd/arxsentinel/main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-haproxy] arxsentinel --version FAILED"

            # Marker for the log artifact's last line (Phase P4 will
            # append the integration.sh output below this block — kept
            # for the cat-after-write emit point).
            echo
            echo "=== integration-haproxy unblock chain end @ $(date -u +%FT%TZ) ==="
            echo

            # ----------------------------------------------------------------
            # P4.4 — invoke integration.sh with SCOPED TMPDIR (per
            # Flow 088 Decision G.1e).
            # ----------------------------------------------------------------
            # CRITICAL: `TMPDIR="$GITHUB_WORKSPACE"` is a per-command
            # environment assignment — POSIX single-command form, NOT
            # `export TMPDIR="$GITHUB_WORKSPACE"`. The exported form
            # poisons Go module-mode detection for any `go build` that
            # runs AFTER it: Go sees cwd == TMPDIR and refuses to use
            # the go.mod there ("ignoring go.mod in system temp root").
            # The 088 G.1 first run (Actions run 28462048606) hit this
            # cascade — `export TMPDIR` at the top of the run block
            # silently broke the integration-smoke's native `go build`,
            # which then cascaded to a misleading "no local image"
            # error from the smoke. 088 DECISIONS.md §"Decision G.1e"
            # documents the full postmortem and the scoped-per-command
            # fix. We invoke the same pattern verbatim here.
            #
            # Why this matters even though the go build runs BEFORE
            # the integration.sh invocation: defensively, the scoped
            # form also protects any future step added below this
            # point (e.g. a follow-up integration-haproxy iteration
            # adding a `go test` after the smoke). 088 G.1e says
            # "any future VM-action job that mixes go build with a
            # script using TMPDIR MUST scope TMPDIR per-command,
            # not export it" — we obey unconditionally.
            #
            # The integration.sh exit code is recorded but not
            # short-circuited to a workflow failure: the job runs
            # with continue-on-error: true (DECISIONS §6 research-
            # grade). A red run is a recorded finding in the
            # downloadable smoke-log.txt, not a flow-blocker.
            # ----------------------------------------------------------------
            echo "[integration-haproxy] invoking integration.sh with scoped TMPDIR=\$GITHUB_WORKSPACE"
            TMPDIR="$GITHUB_WORKSPACE" sh tests/integration-freebsd/haproxy/integration.sh \
                && echo "[integration-haproxy] integration.sh exit: 0 (3 assertions green)" \
                || echo "[integration-haproxy] integration.sh exit: non-zero (recorded in smoke-log; DECISIONS §6 — research-grade, not a flow-blocker)"

            echo
            echo "=== integration-haproxy integration.sh end @ $(date -u +%FT%TZ) ==="
            } > "$GITHUB_WORKSPACE/smoke-log.txt" 2>&1

            # Flow 088 TD-13 cat-after-write pattern: re-emit the log
            # inline in the Actions run-log (collapsible group) AND
            # keep it downloadable as the artifact. Without this the
            # log is artifact-only-debug, requiring a download to
            # triage. See Flow 088 TECH_DEBT.md TD-13.
            echo "::group::Full smoke log (also in the uploaded smoke-log.txt artifact)"
            cat "$GITHUB_WORKSPACE/smoke-log.txt"
            echo "::endgroup::"
            echo "smoke-log written to $GITHUB_WORKSPACE/smoke-log.txt"
            ls -l "$GITHUB_WORKSPACE/smoke-log.txt"

            # ----------------------------------------------------------------
            # P4.4 — inline ::group:: + cat for the threat log and
            # the haproxy access log. Both are also uploaded as
            # artifacts by the `Upload integration-haproxy artifacts`
            # step below (P4.4 — if: always() + if-no-files-found:
            # warn so red runs still produce the artifact for
            # triage). The ::group:: blocks here are for INLINE
            # run-log visibility — without them the threat log and
            # access log are artifact-only-debug, requiring a download
            # to triage the run. Same Flow 088 TD-13 cat-after-write
            # pattern as the smoke-log block above.
            #
            # DECISIONS: §5 (UA-based grader — three assertions on the
            # threat log; inline visibility is what makes the
            # assertion output visible in the Actions run-log, not
            # just in the downloaded artifact); §6 (continue-on-error
            # — the cat commands are best-effort, missing files just
            # print an ls-not-found message inline, no abort).
            # ----------------------------------------------------------------
            echo "::group::threats-haproxy.log (also in uploaded artifact integration-haproxy/threats-haproxy.log.smoke)"
            if [ -s "$GITHUB_WORKSPACE/threats-haproxy.log.smoke" ]; then
                cat "$GITHUB_WORKSPACE/threats-haproxy.log.smoke"
            else
                echo "[integration-haproxy] threats-haproxy.log.smoke missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "threats-haproxy.log.smoke size: $(wc -c < "$GITHUB_WORKSPACE/threats-haproxy.log.smoke" 2>/dev/null || echo 0) bytes"

            echo "::group::haproxy access log (also in uploaded artifact integration-haproxy/haproxy-access.log)"
            if [ -s "$GITHUB_WORKSPACE/haproxy-access.log" ]; then
                cat "$GITHUB_WORKSPACE/haproxy-access.log"
            else
                echo "[integration-haproxy] haproxy-access.log missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "haproxy-access.log size: $(wc -c < "$GITHUB_WORKSPACE/haproxy-access.log" 2>/dev/null || echo 0) bytes"

      - name: Upload integration-haproxy artifacts
        # smoke-log.txt: the full VM run log (P4.4)
        # threats-haproxy.log.smoke: the sentinel threat log (P4.4
        #   copy, mirrored to $GITHUB_WORKSPACE so copyback returns it)
        # haproxy-access.log: the raw haproxy access log the sentinel
        #   read (P4.4 copy, same path; lets the user cross-reference
        #   threat log entries with the access-log line that triggered
        #   them during triage)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-haproxy
          path: |
            smoke-log.txt
            threats-haproxy.log.smoke
            haproxy-access.log
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # integration-apache — Flow 091 P5 (DECISIONS §1: apache fourth, mod_
  # log_config most config-heavy of the five, deferred to mid-suite so
  # its complexity doesn't gate early stability feedback).
  #
  # The body below is verbatim from the haproxy job (P4 already
  # promoted, P4.4 wrap of unblock chain + scoped TMPDIR +
  # cat-after-write + upload-artifact) with five textual substitutions:
  #   1. "[integration-haproxy]" → "[integration-apache]" in the
  #      leading run-script log tag (P5.6 triage scoping).
  #   2. "haproxy" → "apache" in:
  #      - the run-script path (tests/integration-freebsd/apache/
  #        integration.sh)
  #      - the threat-log copy (threats-apache.log.smoke)
  #      - the access-log copy (apache-access.log)
  #      - the artifact name (integration-apache, unchanged)
  #   3. "haproxy.cfg" → "httpd.conf" in the in-line comment about
  #      upstream image (commented-out reference; no semantic effect).
  #   4. "haproxy" → "httpd" in the docker.io/library/ image comment
  #      (clarifies the upstream image the run-script actually uses;
  #      image tag verified against tests/integration/docker-compose.yml:35
  #      per G13).
  #   5. The cat-after-write ::group:: blocks at the bottom reference
  #      threats-apache.log + apache-access.log (mirroring the
  #      haproxy job's threats-haproxy.log + haproxy-access.log).
  #   No other divergences — the unblock chain is identical (same
  #   podman pkg, same storage.conf fix, same pf setup, same go
  #   build). httpd uses the upstream docker.io/library/httpd:latest
  #   image (G13, verified against tests/integration/docker-compose
  #   .yml:35), so no host-side docker build / podman load step is
  #   needed (caddy needed that for transform-encoder; haproxy and
  #   httpd use the upstream image directly).
  # -------------------------------------------------------------------
  integration-apache:
    # Promoted (Task P5.8): continue-on-error dropped after 2 consecutive
    # green live dispatches (runs 28559336031, 28559509626 — both
    # "[apache] PASS: all 3 assertions green", exit 0) per DECISIONS
    # section 6's promotion criterion.
    name: integration-apache
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run apache integration smoke inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          copyback: true
          envs: 'GITHUB_*'
          run: |
            # NO `set -e`: this job is exploratory (DECISIONS §6 —
            # research-grade on first iterations). A red apache
            # integration is a recorded finding in the downloadable
            # smoke-log.txt, not a flow-blocker. `set -o pipefail` only,
            # so any individual command can fail and the log captures
            # the failure context.

            # P5.4 — wrap the whole run block in a single FD redirect
            # to $GITHUB_WORKSPACE/smoke-log.txt. The block below
            # (Task 2.2 storage sed + 2.3 pf + 2.4 go build + Phase P5
            # apache integration + P5.4 wire-up) lives INSIDE this
            # { ... } group. Whatever the VM prints (success OR
            # failure) lands in smoke-log.txt and is then re-emitted
            # inline + uploaded as an artifact — Flow 088 TD-13
            # cat-after-write pattern.
            {
            # Marker for the log artifact's first line.
            echo "=== integration-apache run @ $(date -u +%FT%TZ) ==="
            echo "=== host: $(uname -a) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.1 — podman install + Linux compat layer enable.
            # ----------------------------------------------------------------
            # `docker.io/library/httpd:latest` (used by
            # tests/integration-freebsd/apache/integration.sh step 3)
            # is a Linux OCI image. FreeBSD's sysutils/podman pulls
            # Linux images under the Linux compatibility layer, which
            # must be enabled BEFORE the first `podman run --os=linux`.
            # Per the FreeBSD podman pkg-message (quoted verbatim in
            # Flow 088 DECISIONS.md §"Group B" / "B.3 step 2") the
            # recipe is:
            #   sysrc linux_enable=YES
            #   service linux start
            # The service start is BEST-EFFORT: the vmactions VM has
            # no reboot, and on first boot the linux.ko module may not
            # be loadable until after a reboot we cannot perform. The
            # 088 alpine-spike B.3 step 2 carries the same caveat
            # (DECISIONS §"A.2" "Linux compat may need a reboot we
            # can't do in-CI"). We log the failure to smoke-log.txt
            # but do not abort: the native FreeBSD run-smoke.sh case
            # doesn't need Linux compat, and the integration.sh
            # httpd pull may still succeed on a VM where linux.ko was
            # already loaded by the vmactions image's first-boot
            # rc sequence.
            #
            # `pkg install -y sysutils/podman` MUST run before the
            # sed storage.conf fix in Task 2.2 (the file
            # /usr/local/etc/containers/storage.conf is installed by
            # the sysutils/podman pkg). The FreeBSD pkg cache is empty
            # in a fresh vmactions VM, so this pulls the binary pkg
            # from FreeBSD's pkg mirror; expect ~30-60s on first run.
            # ----------------------------------------------------------------
            pkg install -y sysutils/podman || \
                echo "[integration-apache] pkg install podman FAILED"
            podman --version || \
                echo "[integration-apache] podman --version FAILED"
            sysrc linux_enable=YES || \
                echo "[integration-apache] sysrc linux_enable=YES FAILED"
            # service linux start: best-effort, log failure but do not
            # abort. The 088 §B.3 spike step 2 has the same
            # disposition. A red run here is a finding for the
            # triage-apache-1.md (when it gets written), not a
            # flow-blocker (DECISIONS.md §6).
            if service linux start; then
                echo "[integration-apache] service linux start: ok"
            else
                echo "[integration-apache] WARN: service linux start failed" >&2
                echo "[integration-apache] WARN: Linux emul may need a reboot the VM can't do; podman run --os=linux may fail"
            fi

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
            # /usr/local/etc/containers/storage.conf with `driver = "zfs"`.
            # Correct on real FreeBSD ZFS installs; WRONG inside the
            # vmactions/freebsd-vm QEMU VM whose rootfs has no zpool
            # (UFS/RAW). Without this fix, every `podman run` hard-fails
            # with "no zfs dataset found for rootdir". Switch to vfs
            # (file-backed, works in any filesystem). MUST run BEFORE
            # any `podman run` / `podman build` later in this run block.
            #
            # Why this is repeated here (not shared with another job):
            # each vmactions/freebsd-vm step spawns a fresh VM that
            # ships the default zfs storage.conf; the file lives at
            # /usr/local/etc/containers/storage.conf on the VM (NOT
            # under the synced $GITHUB_WORKSPACE), so a host-side
            # pre-step cannot deduplicate it. Same rationale as Flow
            # 088 DECISIONS §"Decision E.2b" (storage-driver sed fix
            # must repeat in every VM-action step).
            # ----------------------------------------------------------------
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            # Reaffirm effective driver — should now print "vfs".
            podman info --format '{{.Store.GraphDriverName}}' || \
                echo "[integration-apache] post-storage-sed podman info FAILED"

            # ----------------------------------------------------------------
            # Task 2.3 — pf kernel module setup.
            # ----------------------------------------------------------------
            # After the storage fix, the NEXT blocker is the pf kernel
            # module. Live Actions run 28457774103 (Flow 088) showed
            # every `podman run` hard-fails at network initialisation
            # with:
            #   Error: plugin type="bridge" failed (add): cni plugin
            #   bridge failed: The pf kernel module must be loaded to
            #   support ipMasq networks
            # The FreeBSD podman pkg-message documents the fix verbatim.
            # This block is INSIDE the run: block (NOT a workflow-level
            # composite action) for the same reason as Task 2.2: each
            # vmactions/freebsd-vm step = a fresh VM with no pf loaded
            # and no /etc/pf.conf (system file, not under the synced
            # $GITHUB_WORKSPACE). See Flow 088 DECISIONS §"Group F"
            # Decision F.1 (the single blocker is pf) + Decision F.2
            # (egress interface detect with ifconfig -l diagnostic +
            # vtnet0 default).
            #
            # Order matters: storage sed (2.2) → pf setup (2.3) →
            # first `podman run` later in this run block. If pf is not
            # loaded before the first CNI bridge use, the first podman
            # run dies at network init.
            # ----------------------------------------------------------------
            # Diagnostic: capture the actual interface list. vtnet0 is
            # the QEMU/virtio default that vmactions/freebsd-vm uses;
            # if the guess is wrong, the ifconfig -l output above shows
            # the real name in the downloadable smoke-log.txt without a
            # second CI run.
            ifconfig -l
            cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf || \
                echo "[integration-apache] pf.conf.sample copy FAILED"
            # sed -i '' is the in-place edit syntax on FreeBSD (BSD
            # sed). v4egress_if / v6egress_if are top-level shell
            # assignments in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-apache] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-apache] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-apache] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-apache] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here,
            # NOT inside a container. CGO_ENABLED=0 produces a fully-
            # static binary (drop-in compatible with the Linux
            # distroless / FreeBSD freebsd-static final stages).
            # -trimpath + -ldflags="-s -w -X main.version=$(cat VERSION)"
            # mirrors the Linux Dockerfile's build args so the
            # binary's --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # integration.sh (P5.4) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-apache] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-apache] arxsentinel build FAILED"
            # version-check: --version is a supported flag
            # (cmd/arxsentinel/main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-apache] arxsentinel --version FAILED"

            # Marker for the log artifact's last line (Phase P5 will
            # append the integration.sh output below this block — kept
            # for the cat-after-write emit point).
            echo
            echo "=== integration-apache unblock chain end @ $(date -u +%FT%TZ) ==="
            echo

            # ----------------------------------------------------------------
            # P5.4 — invoke integration.sh with SCOPED TMPDIR (per
            # Flow 088 Decision G.1e).
            # ----------------------------------------------------------------
            # CRITICAL: `TMPDIR="$GITHUB_WORKSPACE"` is a per-command
            # environment assignment — POSIX single-command form, NOT
            # `export TMPDIR="$GITHUB_WORKSPACE"`. The exported form
            # poisons Go module-mode detection for any `go build` that
            # runs AFTER it: Go sees cwd == TMPDIR and refuses to use
            # the go.mod there ("ignoring go.mod in system temp root").
            # The 088 G.1 first run (Actions run 28462048606) hit this
            # cascade — `export TMPDIR` at the top of the run block
            # silently broke the integration-smoke's native `go build`,
            # which then cascaded to a misleading "no local image"
            # error from the smoke. 088 DECISIONS.md §"Decision G.1e"
            # documents the full postmortem and the scoped-per-command
            # fix. We invoke the same pattern verbatim here.
            #
            # Why this matters even though the go build runs BEFORE
            # the integration.sh invocation: defensively, the scoped
            # form also protects any future step added below this
            # point (e.g. a follow-up integration-apache iteration
            # adding a `go test` after the smoke). 088 G.1e says
            # "any future VM-action job that mixes go build with a
            # script using TMPDIR MUST scope TMPDIR per-command,
            # not export it" — we obey unconditionally.
            #
            # The integration.sh exit code is recorded but not
            # short-circuited to a workflow failure: the job runs
            # with continue-on-error: true (DECISIONS §6 research-
            # grade). A red run is a recorded finding in the
            # downloadable smoke-log.txt, not a flow-blocker.
            # ----------------------------------------------------------------
            echo "[integration-apache] invoking integration.sh with scoped TMPDIR=\$GITHUB_WORKSPACE"
            TMPDIR="$GITHUB_WORKSPACE" sh tests/integration-freebsd/apache/integration.sh \
                && echo "[integration-apache] integration.sh exit: 0 (3 assertions green)" \
                || echo "[integration-apache] integration.sh exit: non-zero (recorded in smoke-log; DECISIONS §6 — research-grade, not a flow-blocker)"

            echo
            echo "=== integration-apache integration.sh end @ $(date -u +%FT%TZ) ==="
            } > "$GITHUB_WORKSPACE/smoke-log.txt" 2>&1

            # Flow 088 TD-13 cat-after-write pattern: re-emit the log
            # inline in the Actions run-log (collapsible group) AND
            # keep it downloadable as the artifact. Without this the
            # log is artifact-only-debug, requiring a download to
            # triage. See Flow 088 TECH_DEBT.md TD-13.
            echo "::group::Full smoke log (also in the uploaded smoke-log.txt artifact)"
            cat "$GITHUB_WORKSPACE/smoke-log.txt"
            echo "::endgroup::"
            echo "smoke-log written to $GITHUB_WORKSPACE/smoke-log.txt"
            ls -l "$GITHUB_WORKSPACE/smoke-log.txt"

            # ----------------------------------------------------------------
            # P5.4 — inline ::group:: + cat for the threat log and
            # the apache access log. Both are also uploaded as
            # artifacts by the `Upload integration-apache artifacts`
            # step below (P5.4 — if: always() + if-no-files-found:
            # warn so red runs still produce the artifact for
            # triage). The ::group:: blocks here are for INLINE
            # run-log visibility — without them the threat log and
            # access log are artifact-only-debug, requiring a download
            # to triage the run. Same Flow 088 TD-13 cat-after-write
            # pattern as the smoke-log block above.
            #
            # DECISIONS: §5 (UA-based grader — three assertions on the
            # threat log; inline visibility is what makes the
            # assertion output visible in the Actions run-log, not
            # just in the downloaded artifact); §6 (continue-on-error
            # — the cat commands are best-effort, missing files just
            # print an ls-not-found message inline, no abort).
            # ----------------------------------------------------------------
            echo "::group::threats-apache.log (also in uploaded artifact integration-apache/threats-apache.log.smoke)"
            if [ -s "$GITHUB_WORKSPACE/threats-apache.log.smoke" ]; then
                cat "$GITHUB_WORKSPACE/threats-apache.log.smoke"
            else
                echo "[integration-apache] threats-apache.log.smoke missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "threats-apache.log.smoke size: $(wc -c < "$GITHUB_WORKSPACE/threats-apache.log.smoke" 2>/dev/null || echo 0) bytes"

            echo "::group::apache access log (also in uploaded artifact integration-apache/apache-access.log)"
            if [ -s "$GITHUB_WORKSPACE/apache-access.log" ]; then
                cat "$GITHUB_WORKSPACE/apache-access.log"
            else
                echo "[integration-apache] apache-access.log missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "apache-access.log size: $(wc -c < "$GITHUB_WORKSPACE/apache-access.log" 2>/dev/null || echo 0) bytes"

      - name: Upload integration-apache artifacts
        # smoke-log.txt: the full VM run log (P5.4)
        # threats-apache.log.smoke: the sentinel threat log (P5.4
        #   copy, mirrored to $GITHUB_WORKSPACE so copyback returns it)
        # apache-access.log: the raw httpd access log the sentinel
        #   read (P5.4 copy, same path; lets the user cross-reference
        #   threat log entries with the access-log line that triggered
        #   them during triage)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-apache
          path: |
            smoke-log.txt
            threats-apache.log.smoke
            apache-access.log
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # integration-litespeed — Flow 091 P6 (DECISIONS §1: litespeed last,
  # highest Linux-emulation risk per 089's Deferred 089.1 prediction;
  # saved for last so its risk doesn't gate the other four).
  #
  # P6 KEY DESIGN CHOICE — STOCK image, NO custom build, NO
  # patch-ols-logformat.py:
  #   Per DECISIONS §4 litespeed row + arx-core
  #   pkg/parser/profiles.go:103-117, OLS by default emits Apache CLF
  #   with User-Agent — exactly what the `litespeed` parser profile
  #   (apacheCLFPattern) expects. The brief explicitly recommends
  #   this path (the G11-avoidance pattern, see DECISIONS §4 Revised
  #   + G11): using the stock image avoids the entire class of
  #   risks G11 enumerates (Go-toolchain / network-in-build-container
  #   bugs that cost 5 iterations on the caddy backend). This job
  #   therefore has NO host-build step (no `docker build` before the
  #   vmactions/freebsd-vm step) and the integration.sh script
  #   invokes the stock image with a plain `podman run --os=linux
  #   docker.io/litespeedtech/openlitespeed:latest` — no build,
  #   no patched variant, no log-format patch (the patch script
  #   from tests/integration/dockerfiles/ is for the proxy-chain
  #   XFF scenario in Deferred 091.1, out of P6 scope).
