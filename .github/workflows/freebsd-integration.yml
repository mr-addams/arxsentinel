# FreeBSD integration suite (nginx-first backend)
# =================================================
# This workflow is the Flow 089 deliverable: a NEW FreeBSD integration
# suite, isolated from the six battle workflow files (container.yml /
# integration.yml / release.yml / dev-release.yml / nightly.yml /
# pages.yml) and from Flow 088's freebsd-ci.yml (which lives on the
# unmerged branch feat/088-freebsd-ci-harness, NOT on dev).
#
# Triggers: only workflow_dispatch + push to the flow branch
# feat/089-freebsd-integration-suite. NO pull_request, NO schedule,
# NO release. Branch protection on dev/main is unaffected by this file.
#
# Source of truth: .opencode/flows/089_2026-06-30_freebsd-integration-suite/
# DECISIONS.md — esp. §1 (separate workflow file, not in freebsd-ci.yml),
# §6 (continue-on-error: true on first iterations), §8 (uses: version
# hygiene), §9 (commit policy --no-verify, no push from CI).
#
# Exit criteria: TASKS.md Phase 1-4 (this file's skeleton + unblock chain
# + nginx integration suite + wire-up). Phase 5 (live run + triage) is
# the user's gate, not the implementer's.

name: FreeBSD integration suite (nginx)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/089-freebsd-integration-suite

# One concurrent run per ref; cancel stale runs on the same branch.
concurrency:
  group: freebsd-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job set is filled in by Phase 2-4. Skeleton keeps `jobs:` empty
# so the workflow parses cleanly and shows up in the Actions UI as a
# runnable workflow (the Actions UI surfaces workflows with at least
# one job — see Task 2.1 for the first real job).
jobs:
  # -------------------------------------------------------------------
  # integration-nginx — Phase 2-4 deliverable: real-HTTP-source test
  # under FreeBSD/podman. nginx runs in a Linux-emulated nginx:alpine
  # container; native arxsentinel (built in the same VM) tails the
  # bind-mounted access log; a curl attacker container drives sqlmap
  # UA requests; three assertions verify the threat log.
  #
  # DECISIONS: §2 (sentinel NATIVE on host, not in container), §3
  # (native CNI `podman network create`, no podman-compose), §6
  # (continue-on-error: true on first iterations — research-grade).
  # -------------------------------------------------------------------
  integration-nginx:
    name: integration-nginx (exploratory, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run nginx integration smoke inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          copyback: true
          envs: 'GITHUB_*'
          # Phase 2 fills in the unblock chain (storage sed + pf setup +
          # native go build) starting at Task 2.2. Phase 3 invokes
          # tests/integration-freebsd/nginx/run-nginx.sh. Phase 4 wraps
          # it with scoped TMPDIR + artifact upload. The empty `run: |`
          # placeholder below is replaced across Tasks 2.2-4.3.
          run: |
            # NO `set -e`: this job is exploratory (DECISIONS §6 — research
            # grade on first iterations). A red nginx integration is a
            # recorded finding in the downloadable smoke-log.txt, not a
            # flow-blocker. `set -o pipefail` only, so any individual
            # command can fail and the log captures the failure context.
            set -o pipefail

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
            # /usr/local/etc/containers/storage.conf with `driver = "zfs"`.
            # Correct on real FreeBSD ZFS installs; WRONG inside the
            # vmactions/freebsd-vm QEMU VM whose rootfs has no zpool
            # (UFS/RAW). Without this fix, every `podman run` hard-fails
            # with "no zfs dataset found for rootdir". Switch to vfs
            # (file-backed, works in any filesystem). MUST run BEFORE
            # any `podman run` / `podman build` later in this run block.
            #
            # Why this is repeated here (not shared with another job):
            # each vmactions/freebsd-vm step spawns a fresh VM that
            # ships the default zfs storage.conf; the file lives at
            # /usr/local/etc/containers/storage.conf on the VM (NOT under
            # the synced $GITHUB_WORKSPACE), so a host-side pre-step
            # cannot deduplicate it. Same rationale as Flow 088
            # DECISIONS §"Decision E.2b" (storage-driver sed fix must
            # repeat in every VM-action step).
            # ----------------------------------------------------------------
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            # Reaffirm effective driver — should now print "vfs".
            podman info --format '{{.Store.GraphDriverName}}' || \
                echo "[integration-nginx] post-storage-sed podman info FAILED"

            # ----------------------------------------------------------------
            # Task 2.3 — pf kernel module setup.
            # ----------------------------------------------------------------
            # After the storage fix, the NEXT blocker is the pf kernel
            # module. Live Actions run 28457774103 (Flow 088) showed
            # every `podman run` hard-fails at network initialisation
            # with:
            #   Error: plugin type="bridge" failed (add): cni plugin
            #   bridge failed: The pf kernel module must be loaded to
            #   support ipMasq networks
            # The FreeBSD podman pkg-message documents the fix verbatim.
            # This block is INSIDE the run: block (NOT a workflow-level
            # composite action) for the same reason as Task 2.2: each
            # vmactions/freebsd-vm step = a fresh VM with no pf loaded
            # and no /etc/pf.conf (system file, not under the synced
            # $GITHUB_WORKSPACE). See Flow 088 DECISIONS §"Group F"
            # Decision F.1 (the single blocker is pf) + Decision F.2
            # (egress interface detect with ifconfig -l diagnostic +
            # vtnet0 default).
            #
            # Order matters: storage sed (2.2) → pf setup (2.3) → first
            # `podman run` later in this run block. If pf is not loaded
            # before the first CNI bridge use, the first podman run
            # dies at network init.
            # ----------------------------------------------------------------
            # Diagnostic: capture the actual interface list. vtnet0 is
            # the QEMU/virtio default that vmactions/freebsd-vm uses; if
            # the guess is wrong, the ifconfig -l output above shows the
            # real name in the downloadable smoke-log.txt without a
            # second CI run.
            ifconfig -l
            cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf || \
                echo "[integration-nginx] pf.conf.sample copy FAILED"
            # sed -i '' is the in-place edit syntax on FreeBSD (BSD sed).
            # v4egress_if / v6egress_if are top-level shell assignments
            # in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-nginx] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-nginx] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-nginx] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-nginx] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here, NOT
            # inside a container. CGO_ENABLED=0 produces a fully-static
            # binary (drop-in compatible with the Linux distroless /
            # FreeBSD freebsd-static final stages). -trimpath +
            # -ldflags="-s -w -X main.version=$(cat VERSION)" mirrors
            # the Linux Dockerfile's build args so the binary's
            # --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # run-nginx.sh (Task 4.2) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-nginx] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-nginx] arxsentinel build FAILED"
            # version-check: --version is a supported flag (cmd/arxsentinel/
            # main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-nginx] arxsentinel --version FAILED"
