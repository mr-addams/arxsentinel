# FreeBSD integration suite (nginx-first backend)
# =================================================
# This workflow is the Flow 089 deliverable: a NEW FreeBSD integration
# suite, isolated from the six battle workflow files (container.yml /
# integration.yml / release.yml / dev-release.yml / nightly.yml /
# pages.yml) and from Flow 088's freebsd-ci.yml (which lives on the
# unmerged branch feat/088-freebsd-ci-harness, NOT on dev).
#
# Triggers: workflow_dispatch + push to the flow base + five sub-branches,
# + workflow_call (Flow 090 P5+).
#
# NO pull_request on dev/main (branch protection on dev/main is unaffected
# by this file). The pull_request trigger is scoped to inner PRs (sub-branch
# → flow base branch feat/091-freebsd-integration-parity) only — it makes
# the inner PR a real CI gate per the user's brief requirement 2 and Flow
# 091 DECISIONS.md §3 + §5. It does NOT fire on PRs into dev/main, keeping
# the dev PR CI surface unchanged (integration.yml, release.yml, dev-
# release.yml remain the dev gates; FreeBSD jobs are NOT promoted to dev-
# gate — Deferred 091.6).
#
# Source of truth: .opencode/flows/089_2026-06-30_freebsd-integration-suite/
# DECISIONS.md — esp. §1 (separate workflow file, not in freebsd-ci.yml),
# §6 (continue-on-error: true on first iterations), §8 (uses: version
# hygiene), §9 (commit policy --no-verify, no push from CI).
#
# Exit criteria: TASKS.md Phase 1-4 (this file's skeleton + unblock chain
# + nginx integration suite + wire-up). Phase 5 (live run + triage) is
# the user's gate, not the implementer's.

name: FreeBSD integration suite (nginx)

on:
  workflow_dispatch:
  push:
    branches:
      # Flow 089 carry-over (single-backend spike). Lives on its own
      # historical branch, not on the 091 flow base.
      - feat/089-freebsd-integration-suite
      # Flow 091 base + five per-backend sub-branches (DECISIONS §3 + §5).
      # Each sub-branch is cut from the flow base; its PR target is the
      # flow base (inner PR), not dev. push: triggers fire on every
      # commit pushed to any of these refs; the pull_request: trigger
      # below gates the inner merge.
      - feat/091-freebsd-integration-parity
      - feat/091-caddy-freebsd
      - feat/091-traefik-freebsd
      - feat/091-haproxy-freebsd
      - feat/091-apache-freebsd
      - feat/091-litespeed-freebsd
  # pull_request: scoped to inner PRs only (sub-branch → flow base branch
  # feat/091-freebsd-integration-parity) per DECISIONS §5. NOT on dev/main:
  # the dev PR CI surface stays integration.yml + release.yml + dev-release.yml,
  # FreeBSD jobs are NOT promoted to dev-gate (Deferred 091.6, carries 089
  # Deferred 089.7). This trigger makes the inner PR a real CI gate — the
  # sub-branch must be green before merge into the flow base.
  pull_request:
    branches:
      - feat/091-freebsd-integration-parity
  # Flow 090 P5+ (DECISIONS.md Decision 9 Revised 2026-07-01): allows
  # this workflow to be called from .github/workflows/dev-release.yml via
  # `uses: ./.github/workflows/freebsd-integration.yml` from the new
  # freebsd-integration-gate job. ADDITIVE trigger — workflow_dispatch
  # and push: still fire this workflow exactly as before; workflow_call:
  # is a separate trigger that exposes the workflow as a reusable
  # callee. Pattern matches .github/workflows/integration.yml line 7.
  workflow_call:

# One concurrent run per ref; cancel stale runs on the same branch.
concurrency:
  group: freebsd-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The job set is filled in by Phase 2-4. Skeleton keeps `jobs:` empty
# so the workflow parses cleanly and shows up in the Actions UI as a
# runnable workflow (the Actions UI surfaces workflows with at least
# one job — see Task 2.1 for the first real job).
jobs:
  # -------------------------------------------------------------------
  # integration-nginx — Phase 2-4 deliverable: real-HTTP-source test
  # under FreeBSD/podman. nginx runs in a Linux-emulated nginx:alpine
  # container; native arxsentinel (built in the same VM) tails the
  # bind-mounted access log; a curl attacker container drives sqlmap
  # UA requests; three assertions verify the threat log.
  #
  # DECISIONS: §2 (sentinel NATIVE on host, not in container), §3
  # (native CNI `podman network create`, no podman-compose), §6
  # (continue-on-error: true on first iterations — research-grade).
  # -------------------------------------------------------------------
  integration-nginx:
    # Direct-scenario promotion (Task 5.4, superseded by Flow 092 below):
    # continue-on-error dropped after 2 consecutive green live dispatches
    # (runs 28478529310, 28478698670 - both "[nginx] PASS: all 3 assertions
    # green", exit 0) per Flow 089 DECISIONS section 6's promotion criterion.
    #
    # Flow 092: integration.sh now also runs a NEW proxy-chain scenario
    # (Steps 10-15, being actively debugged as of this commit). Deliberately
    # NOT using continue-on-error: true during this active debug loop — live
    # run 28583294976 showed continue-on-error masks a real script failure
    # (exit 1) as a job-level "success" in the Actions UI, forcing a manual
    # log-grep every dispatch instead of reading the job status directly.
    # This branch does not gate dev/main (feature branch, no PR open yet),
    # so there is nothing continue-on-error would protect here — accurate
    # red/green on every dispatch is strictly more useful while iterating.
    # Once the chain scenario proves 2 consecutive green dispatches, this
    # job's true state IS "promoted" already (no re-add/re-drop dance
    # needed) — a Revised note will still record the promoting run IDs
    # here per Flow 091/092's Decision 6 discipline.
    name: integration-nginx
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run nginx integration smoke inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          copyback: true
          envs: 'GITHUB_*'
          # Phase 2 fills in the unblock chain (storage sed + pf setup +
          # native go build) starting at Task 2.2. Phase 3 invokes
          # tests/integration-freebsd/nginx/integration.sh. Phase 4 wraps
          # it with scoped TMPDIR + artifact upload. The empty `run: |`
          # placeholder below is replaced across Tasks 2.2-4.3.
          run: |
            # NO `set -e`: this job is exploratory (DECISIONS §6 — research
            # grade on first iterations). A red nginx integration is a
            # recorded finding in the downloadable smoke-log.txt, not a
            # flow-blocker. `set -o pipefail` only, so any individual
            # command can fail and the log captures the failure context.

            # Task 2.5 — wrap the whole run block in a single FD redirect
            # to $GITHUB_WORKSPACE/smoke-log.txt. The block below (Task
            # 2.2 storage sed + 2.3 pf + 2.4 go build + Phase 3 nginx
            # integration + Phase 4 wire-up) lives INSIDE this { ... }
            # group. Whatever the VM prints (success OR failure) lands in
            # smoke-log.txt and is then re-emitted inline + uploaded as
            # an artifact — Flow 088 TD-13 cat-after-write pattern.
            {
            # Marker for the log artifact's first line.
            echo "=== integration-nginx run @ $(date -u +%FT%TZ) ==="
            echo "=== host: $(uname -a) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.1 — podman install + Linux compat layer enable.
            # ----------------------------------------------------------------
            # `nginx:alpine` (used by tests/integration-freebsd/nginx/
            # integration.sh step 3) is a Linux OCI image. FreeBSD's
            # sysutils/podman pulls Linux images under the Linux
            # compatibility layer, which must be enabled BEFORE the
            # first `podman run --os=linux`. Per the FreeBSD podman
            # pkg-message (quoted verbatim in Flow 088 DECISIONS.md
            # §"Group B" / "B.3 step 2") the recipe is:
            #   sysrc linux_enable=YES
            #   service linux start
            # The service start is BEST-EFFORT: the vmactions VM has
            # no reboot, and on first boot the linux.ko module may not
            # be loadable until after a reboot we cannot perform. The
            # 088 alpine-spike B.3 step 2 carries the same caveat
            # (DECISIONS §"A.2" "Linux compat may need a reboot we
            # can't do in-CI"). We log the failure to smoke-log.txt
            # but do not abort: the native FreeBSD run-smoke.sh case
            # doesn't need Linux compat, and the integration.sh nginx
            # pull may still succeed on a VM where linux.ko was
            # already loaded by the vmactions image's first-boot
            # rc sequence.
            #
            # `pkg install -y sysutils/podman` MUST run before the
            # sed storage.conf fix in Task 2.2 (the file
            # /usr/local/etc/containers/storage.conf is installed by
            # the sysutils/podman pkg). The FreeBSD pkg cache is empty
            # in a fresh vmactions VM, so this pulls the binary pkg
            # from FreeBSD's pkg mirror; expect ~30-60s on first run.
            # ----------------------------------------------------------------
            pkg install -y sysutils/podman || \
                echo "[integration-nginx] pkg install podman FAILED"
            podman --version || \
                echo "[integration-nginx] podman --version FAILED"
            sysrc linux_enable=YES || \
                echo "[integration-nginx] sysrc linux_enable=YES FAILED"
            # service linux start: best-effort, log failure but do not
            # abort. The 088 §B.3 spike step 2 has the same
            # disposition. A red run here is a finding for the
            # triage-run-1.md, not a flow-blocker (DECISIONS.md §6).
            if service linux start; then
                echo "[integration-nginx] service linux start: ok"
            else
                echo "[integration-nginx] WARN: service linux start failed" >&2
                echo "[integration-nginx] WARN: Linux emul may need a reboot the VM can't do; podman run --os=linux may fail"
            fi

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
            # /usr/local/etc/containers/storage.conf with `driver = "zfs"`.
            # Correct on real FreeBSD ZFS installs; WRONG inside the
            # vmactions/freebsd-vm QEMU VM whose rootfs has no zpool
            # (UFS/RAW). Without this fix, every `podman run` hard-fails
            # with "no zfs dataset found for rootdir". Switch to vfs
            # (file-backed, works in any filesystem). MUST run BEFORE
            # any `podman run` / `podman build` later in this run block.
            #
            # Why this is repeated here (not shared with another job):
            # each vmactions/freebsd-vm step spawns a fresh VM that
            # ships the default zfs storage.conf; the file lives at
            # /usr/local/etc/containers/storage.conf on the VM (NOT under
            # the synced $GITHUB_WORKSPACE), so a host-side pre-step
            # cannot deduplicate it. Same rationale as Flow 088
            # DECISIONS §"Decision E.2b" (storage-driver sed fix must
            # repeat in every VM-action step).
            # ----------------------------------------------------------------
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            # Reaffirm effective driver — should now print "vfs".
            podman info --format '{{.Store.GraphDriverName}}' || \
                echo "[integration-nginx] post-storage-sed podman info FAILED"

            # ----------------------------------------------------------------
            # Task 2.3 — pf kernel module setup.
            # ----------------------------------------------------------------
            # After the storage fix, the NEXT blocker is the pf kernel
            # module. Live Actions run 28457774103 (Flow 088) showed
            # every `podman run` hard-fails at network initialisation
            # with:
            #   Error: plugin type="bridge" failed (add): cni plugin
            #   bridge failed: The pf kernel module must be loaded to
            #   support ipMasq networks
            # The FreeBSD podman pkg-message documents the fix verbatim.
            # This block is INSIDE the run: block (NOT a workflow-level
            # composite action) for the same reason as Task 2.2: each
            # vmactions/freebsd-vm step = a fresh VM with no pf loaded
            # and no /etc/pf.conf (system file, not under the synced
            # $GITHUB_WORKSPACE). See Flow 088 DECISIONS §"Group F"
            # Decision F.1 (the single blocker is pf) + Decision F.2
            # (egress interface detect with ifconfig -l diagnostic +
            # vtnet0 default).
            #
            # Order matters: storage sed (2.2) → pf setup (2.3) → first
            # `podman run` later in this run block. If pf is not loaded
            # before the first CNI bridge use, the first podman run
            # dies at network init.
            # ----------------------------------------------------------------
            # Diagnostic: capture the actual interface list. vtnet0 is
            # the QEMU/virtio default that vmactions/freebsd-vm uses; if
            # the guess is wrong, the ifconfig -l output above shows the
            # real name in the downloadable smoke-log.txt without a
            # second CI run.
            ifconfig -l
            cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf || \
                echo "[integration-nginx] pf.conf.sample copy FAILED"
            # sed -i '' is the in-place edit syntax on FreeBSD (BSD sed).
            # v4egress_if / v6egress_if are top-level shell assignments
            # in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-nginx] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-nginx] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-nginx] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-nginx] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here, NOT
            # inside a container. CGO_ENABLED=0 produces a fully-static
            # binary (drop-in compatible with the Linux distroless /
            # FreeBSD freebsd-static final stages). -trimpath +
            # -ldflags="-s -w -X main.version=$(cat VERSION)" mirrors
            # the Linux Dockerfile's build args so the binary's
            # --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # integration.sh (Task 4.2) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-nginx] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-nginx] arxsentinel build FAILED"
            # version-check: --version is a supported flag (cmd/arxsentinel/
            # main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-nginx] arxsentinel --version FAILED"

            # Marker for the log artifact's last line (Phase 3-4 will
            # append the integration.sh output below this block — kept
            # for the cat-after-write emit point).
            echo
            echo "=== integration-nginx unblock chain end @ $(date -u +%FT%TZ) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.2 — invoke integration.sh with SCOPED TMPDIR (per
            # Flow 088 Decision G.1e).
            # ----------------------------------------------------------------
            # CRITICAL: `TMPDIR="$GITHUB_WORKSPACE"` is a per-command
            # environment assignment — POSIX single-command form, NOT
            # `export TMPDIR="$GITHUB_WORKSPACE"`. The exported form
            # poisons Go module-mode detection for any `go build` that
            # runs AFTER it: Go sees cwd == TMPDIR and refuses to use
            # the go.mod there ("ignoring go.mod in system temp root").
            # The 088 G.1 first run (Actions run 28462048606) hit this
            # cascade — `export TMPDIR` at the top of the run block
            # silently broke the integration-smoke's native `go build`,
            # which then cascaded to a misleading "no local image"
            # error from the smoke. 088 DECISIONS.md §"Decision G.1e"
            # documents the full postmortem and the scoped-per-command
            # fix. We invoke the same pattern verbatim here.
            #
            # Why this matters even though the go build runs BEFORE
            # the integration.sh invocation: defensively, the scoped
            # form also protects any future step added below this
            # point (e.g. a follow-up integration-nginx iteration
            # adding a `go test` after the smoke). 088 G.1e says
            # "any future VM-action job that mixes go build with a
            # script using TMPDIR MUST scope TMPDIR per-command,
            # not export it" — we obey unconditionally.
            #
            # The integration.sh exit code is recorded but not
            # short-circuited to a workflow failure: the job runs
            # with continue-on-error: true (DECISIONS §6 research-
            # grade). A red run is a recorded finding in the
            # downloadable smoke-log.txt, not a flow-blocker.
            # ----------------------------------------------------------------
            echo "[integration-nginx] invoking integration.sh with scoped TMPDIR=\$GITHUB_WORKSPACE"
            TMPDIR="$GITHUB_WORKSPACE" sh tests/integration-freebsd/nginx/integration.sh \
                && echo "[integration-nginx] integration.sh exit: 0 (3 assertions green)" \
                || echo "[integration-nginx] integration.sh exit: non-zero (recorded in smoke-log; DECISIONS §6 — research-grade, not a flow-blocker)"

            echo
            echo "=== integration-nginx integration.sh end @ $(date -u +%FT%TZ) ==="
            } > "$GITHUB_WORKSPACE/smoke-log.txt" 2>&1

            # Flow 088 TD-13 cat-after-write pattern: re-emit the log
            # inline in the Actions run-log (collapsible group) AND
            # keep it downloadable as the artifact. Without this the
            # log is artifact-only-debug, requiring a download to
            # triage. See Flow 088 TECH_DEBT.md TD-13.
            echo "::group::Full smoke log (also in the uploaded smoke-log.txt artifact)"
            cat "$GITHUB_WORKSPACE/smoke-log.txt"
            echo "::endgroup::"
            echo "smoke-log written to $GITHUB_WORKSPACE/smoke-log.txt"
            ls -l "$GITHUB_WORKSPACE/smoke-log.txt"

            # ----------------------------------------------------------------
            # Task 4.3 — inline ::group:: + cat for the threat log and
            # the nginx access log. Both are also uploaded as artifacts
            # by the `Upload integration-nginx artifacts` step below
            # (Task 3.6 — already in place, if: always() + if-no-files-
            # found: warn so red runs still produce the artifact for
            # triage). The ::group:: blocks here are for INLINE run-log
            # visibility — without them the threat log and access log
            # are artifact-only-debug, requiring a download to triage
            # the run. Same Flow 088 TD-13 cat-after-write pattern as
            # the smoke-log block above (Task 2.5).
            #
            # DECISIONS: §5 (UA-based grader — three assertions on the
            # threat log; inline visibility is what makes the assertion
            # output visible in the Actions run-log, not just in the
            # downloaded artifact); §6 (continue-on-error — the cat
            # commands are best-effort, missing files just print an
            # ls-not-found message inline, no abort).
            # ----------------------------------------------------------------
            echo "::group::threats-nginx.log (also in uploaded artifact integration-nginx/threats-nginx.log.smoke)"
            if [ -s "$GITHUB_WORKSPACE/threats-nginx.log.smoke" ]; then
                cat "$GITHUB_WORKSPACE/threats-nginx.log.smoke"
            else
                echo "[integration-nginx] threats-nginx.log.smoke missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "threats-nginx.log.smoke size: $(wc -c < "$GITHUB_WORKSPACE/threats-nginx.log.smoke" 2>/dev/null || echo 0) bytes"

            echo "::group::nginx access log (also in uploaded artifact integration-nginx/nginx-access.log)"
            if [ -s "$GITHUB_WORKSPACE/nginx-access.log" ]; then
                cat "$GITHUB_WORKSPACE/nginx-access.log"
            else
                echo "[integration-nginx] nginx-access.log missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "nginx-access.log size: $(wc -c < "$GITHUB_WORKSPACE/nginx-access.log" 2>/dev/null || echo 0) bytes"

      - name: Upload integration-nginx artifacts
        # smoke-log.txt: the full VM run log (Task 2.5)
        # threats-nginx.log.smoke: the sentinel threat log (Task 3.6
        #   copy, mirrored to $GITHUB_WORKSPACE so copyback returns it)
        # nginx-access.log: the raw nginx access log the sentinel read
        #   (Task 3.6 copy, same path; lets the user cross-reference
        #   threat log entries with the access-log line that triggered
        #   them during triage)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-nginx
          path: |
            smoke-log.txt
            threats-nginx.log.smoke
            nginx-access.log
          if-no-files-found: warn

  # =====================================================================
  # Flow 091 — five new backend jobs (caddy / traefik / haproxy / apache
  # / litespeed). Each stub ships its first commit with
  # continue-on-error: true (DECISIONS §6 — research-grade on first
  # dispatch, per-backend promotion to in-workflow gating after 2+
  # consecutive green live dispatches). The run: body is an empty
  # placeholder; Phase P{n} (P2=caddy, P3=traefik, P4=haproxy, P5=apache,
  # P6=litespeed) fills in the unblock chain + per-backend run-<backend>.sh
  # invocation + per-backend artifact upload.
  #
  # The stubs ARE NOT a no-op for Actions: each one dispatches a fresh
  # FreeBSD VM (vmactions/freebsd-vm@v1.5.0) on push to its sub-branch,
  # validates the trigger wiring (push: branches: + pull_request: branches:
  # on the flow base), and emits a smoke-log.txt artifact. The empty
  # run: makes the first dispatch trivially green, so the trigger wiring
  # is verified before Phase P2 invests in a real integration.sh body.
  # =====================================================================

  # -------------------------------------------------------------------
  # integration-caddy — Flow 091 P2 (DECISIONS §1: caddy first, cheapest
  # port — alpine-base single binary, access log format closest to
  # nginx's combined).
  # -------------------------------------------------------------------
  integration-caddy:
    # Promoted (Task P2.8): continue-on-error dropped after 2 consecutive
    # green live dispatches (runs 28551946529, 28552167223 — both
    # "[caddy] PASS: all 3 assertions green", exit 0) per DECISIONS
    # section 6's promotion criterion. Job-level blocking applies ONLY
    # within this isolated workflow — it does not gate dev/main branch
    # protection.
    name: integration-caddy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ---------------------------------------------------------------
      # P2.4 host build -- build caddy-arxsentinel on ubuntu-latest.
      # ---------------------------------------------------------------
      # WHY host build, not podman build inside the FreeBSD VM:
      #   triage-caddy-1.md recorded 5 independent bugs across 4
      #   live dispatches, all trying to compile caddy+xcaddy inside
      #   podman build under FreeBSD Linux-compat emulation (short-
      #   name image resolution, --platform linux/amd64, trimmed go
      #   binary unable to self-locate GOROOT via readlink /proc/self
      #   /exe under linprocfs, and DNS resolution to proxy.golang.org
      #   timing out from inside the podman build container -- which
      #   differs from podman run, which works fine for every other
      #   backend in this flow). Per Decision 4 Revised, the entire
      #   build is moved off the FreeBSD VM.
      #
      #   ubuntu-latest has native Docker with full internet access
      #   and no emulation layer -- the same well-trodden path every
      #   other Docker-based CI step in this project already uses.
      #   vmactions/freebsd-vm syncs the entire $GITHUB_WORKSPACE into
      #   the VM via rsync BEFORE the run: script executes (Decision 4
      #   Revised, citing index.js:911-922), so the saved tar lands
      #   inside the VM automatically -- podman load there is a pure
      #   local file-import operation with zero network/toolchain
      #   dependency, sidestepping every one of the 5 bugs.
      #
      #   This pattern is the precedent for any future backend that
      #   needs a custom image with Go-toolchain module fetches
      #   (G11 in DECISIONS.md gotchas checklist).
      #
      # docker is preinstalled on ubuntu-latest GitHub-hosted runners
      # (Docker Engine 24+, confirmed in GitHub Actions runner images
      # docs) -- no setup-docker step needed; bare docker build works.
      # Working directory defaults to $GITHUB_WORKSPACE, so the tar
      # lands at $GITHUB_WORKSPACE/caddy-arxsentinel.tar and is
      # rsync-synced into the VM by vmactions/freebsd-vm.
      # ---------------------------------------------------------------
      - name: Build caddy-arxsentinel image on host (native Docker, no FreeBSD Linux-emul)
        run: |
          docker build \
            -t caddy-arxsentinel:local \
            -f tests/integration/dockerfiles/Caddy.Dockerfile \
            tests/integration/
          docker save caddy-arxsentinel:local -o caddy-arxsentinel.tar
          ls -l caddy-arxsentinel.tar

      - name: Run caddy integration smoke inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          copyback: true
          envs: 'GITHUB_*'
          # Phase 2 fills in the unblock chain (storage sed + pf setup +
          # native go build) starting at Task 2.2. Phase 3 invokes
          # tests/integration-freebsd/caddy/integration.sh. Phase 4 wraps
          # it with scoped TMPDIR + artifact upload. The empty `run: |`
          # placeholder below is replaced across Tasks 2.2-4.3.
          run: |
            # NO `set -e`: this job is exploratory (DECISIONS §6 — research
            # grade on first iterations). A red caddy integration is a
            # recorded finding in the downloadable smoke-log.txt, not a
            # flow-blocker. `set -o pipefail` only, so any individual
            # command can fail and the log captures the failure context.

            # Task 2.5 — wrap the whole run block in a single FD redirect
            # to $GITHUB_WORKSPACE/smoke-log.txt. The block below (Task
            # 2.2 storage sed + 2.3 pf + 2.4 go build + Phase P2 caddy
            # integration + Phase 4 wire-up) lives INSIDE this { ... }
            # group. Whatever the VM prints (success OR failure) lands in
            # smoke-log.txt and is then re-emitted inline + uploaded as
            # an artifact — Flow 088 TD-13 cat-after-write pattern.
            {
            # Marker for the log artifact's first line.
            echo "=== integration-caddy run @ $(date -u +%FT%TZ) ==="
            echo "=== host: $(uname -a) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.1 — podman install + Linux compat layer enable.
            # ----------------------------------------------------------------
            # `caddy:2-alpine` (used by tests/integration-freebsd/caddy/
            # integration.sh step 3) is a Linux OCI image. FreeBSD's
            # sysutils/podman pulls Linux images under the Linux
            # compatibility layer, which must be enabled BEFORE the
            # first `podman run --os=linux`. Per the FreeBSD podman
            # pkg-message (quoted verbatim in Flow 088 DECISIONS.md
            # §"Group B" / "B.3 step 2") the recipe is:
            #   sysrc linux_enable=YES
            #   service linux start
            # The service start is BEST-EFFORT: the vmactions VM has
            # no reboot, and on first boot the linux.ko module may not
            # be loadable until after a reboot we cannot perform. The
            # 088 alpine-spike B.3 step 2 carries the same caveat
            # (DECISIONS §"A.2" "Linux compat may need a reboot we
            # can't do in-CI"). We log the failure to smoke-log.txt
            # but do not abort: the native FreeBSD run-smoke.sh case
            # doesn't need Linux compat, and the integration.sh caddy
            # pull may still succeed on a VM where linux.ko was
            # already loaded by the vmactions image's first-boot
            # rc sequence.
            #
            # `pkg install -y sysutils/podman` MUST run before the
            # sed storage.conf fix in Task 2.2 (the file
            # /usr/local/etc/containers/storage.conf is installed by
            # the sysutils/podman pkg). The FreeBSD pkg cache is empty
            # in a fresh vmactions VM, so this pulls the binary pkg
            # from FreeBSD's pkg mirror; expect ~30-60s on first run.
            # ----------------------------------------------------------------
            pkg install -y sysutils/podman || \
                echo "[integration-caddy] pkg install podman FAILED"
            podman --version || \
                echo "[integration-caddy] podman --version FAILED"
            sysrc linux_enable=YES || \
                echo "[integration-caddy] sysrc linux_enable=YES FAILED"
            # service linux start: best-effort, log failure but do not
            # abort. The 088 §B.3 spike step 2 has the same
            # disposition. A red run here is a finding for the
            # triage-run-1.md, not a flow-blocker (DECISIONS.md §6).
            if service linux start; then
                echo "[integration-caddy] service linux start: ok"
            else
                echo "[integration-caddy] WARN: service linux start failed" >&2
                echo "[integration-caddy] WARN: Linux emul may need a reboot the VM can't do; podman run --os=linux may fail"
            fi

            # ----------------------------------------------------------------
            # Task 2.2 — storage-driver sed fix.
            # ----------------------------------------------------------------
            # The FreeBSD podman pkg ships
            # /usr/local/etc/containers/storage.conf with `driver = "zfs"`.
            # Correct on real FreeBSD ZFS installs; WRONG inside the
            # vmactions/freebsd-vm QEMU VM whose rootfs has no zpool
            # (UFS/RAW). Without this fix, every `podman run` hard-fails
            # with "no zfs dataset found for rootdir". Switch to vfs
            # (file-backed, works in any filesystem). MUST run BEFORE
            # any `podman run` / `podman build` later in this run block.
            #
            # Why this is repeated here (not shared with another job):
            # each vmactions/freebsd-vm step spawns a fresh VM that
            # ships the default zfs storage.conf; the file lives at
            # /usr/local/etc/containers/storage.conf on the VM (NOT under
            # the synced $GITHUB_WORKSPACE), so a host-side pre-step
            # cannot deduplicate it. Same rationale as Flow 088
            # DECISIONS §"Decision E.2b" (storage-driver sed fix must
            # repeat in every VM-action step).
            # ----------------------------------------------------------------
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            # Reaffirm effective driver — should now print "vfs".
            podman info --format '{{.Store.GraphDriverName}}' || \
                echo "[integration-caddy] post-storage-sed podman info FAILED"

            # ----------------------------------------------------------------
            # Task 2.3 — pf kernel module setup.
            # ----------------------------------------------------------------
            # After the storage fix, the NEXT blocker is the pf kernel
            # module. Live Actions run 28457774103 (Flow 088) showed
            # every `podman run` hard-fails at network initialisation
            # with:
            #   Error: plugin type="bridge" failed (add): cni plugin
            #   bridge failed: The pf kernel module must be loaded to
            #   support ipMasq networks
            # The FreeBSD podman pkg-message documents the fix verbatim.
            # This block is INSIDE the run: block (NOT a workflow-level
            # composite action) for the same reason as Task 2.2: each
            # vmactions/freebsd-vm step = a fresh VM with no pf loaded
            # and no /etc/pf.conf (system file, not under the synced
            # $GITHUB_WORKSPACE). See Flow 088 DECISIONS §"Group F"
            # Decision F.1 (the single blocker is pf) + Decision F.2
            # (egress interface detect with ifconfig -l diagnostic +
            # vtnet0 default).
            #
            # Order matters: storage sed (2.2) → pf setup (2.3) → first
            # `podman run` later in this run block. If pf is not loaded
            # before the first CNI bridge use, the first podman run
            # dies at network init.
            # ----------------------------------------------------------------
            # Diagnostic: capture the actual interface list. vtnet0 is
            # the QEMU/virtio default that vmactions/freebsd-vm uses; if
            # the guess is wrong, the ifconfig -l output above shows the
            # real name in the downloadable smoke-log.txt without a
            # second CI run.
            ifconfig -l
            cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf || \
                echo "[integration-caddy] pf.conf.sample copy FAILED"
            # sed -i '' is the in-place edit syntax on FreeBSD (BSD sed).
            # v4egress_if / v6egress_if are top-level shell assignments
            # in the sample; substitute both to vtnet0.
            sed -i '' \
                -e 's/^v4egress_if=.*/v4egress_if="vtnet0"/' \
                -e 's/^v6egress_if=.*/v6egress_if="vtnet0"/' \
                /etc/pf.conf || \
                echo "[integration-caddy] pf.conf interface substitution FAILED"
            kldload pf || \
                echo "[integration-caddy] kldload pf FAILED (already loaded?)"
            # net.pf.filter_local=1 enables host↔container traffic
            # through pf. CNI bridge ipMasq uses pf for the SNAT; if
            # filter_local=0, host-sent packets are dropped. This is
            # the same sysctl the 088 F.1 block sets.
            sysctl net.pf.filter_local=1 || true
            sysrc pf_enable=YES
            service pf start || \
                echo "[integration-caddy] service pf start FAILED"
            # Restart to make filter_local=1 take effect on the running
            # service (sysctl alone does not re-evaluate an already-
            # running pf ruleset).
            service pf restart || \
                echo "[integration-caddy] service pf restart FAILED"

            # ----------------------------------------------------------------
            # Task 2.4 — native go build of arxsentinel.
            # ----------------------------------------------------------------
            # Sentinel runs NATIVE on the host (DECISIONS §2), so we
            # build cmd/arxsentinel natively on the FreeBSD VM here, NOT
            # inside a container. CGO_ENABLED=0 produces a fully-static
            # binary (drop-in compatible with the Linux distroless /
            # FreeBSD freebsd-static final stages). -trimpath +
            # -ldflags="-s -w -X main.version=$(cat VERSION)" mirrors
            # the Linux Dockerfile's build args so the binary's
            # --version output matches the published version.
            #
            # No scoped TMPDIR here: native `go build` does not need
            # TMPDIR for any step. Scoped TMPDIR is reserved for
            # integration.sh (Task 4.2) per Flow 088 DECISIONS §"Decision
            # G.1e" (exported TMPDIR poisons Go module-mode detection
            # for any go build that runs after it).
            # ----------------------------------------------------------------
            pkg install -y go || \
                echo "[integration-caddy] pkg install go FAILED"
            cd "$GITHUB_WORKSPACE"
            VERSION=$(cat VERSION 2>/dev/null || echo "dev")
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -trimpath \
                    -ldflags="-s -w -X main.version=${VERSION}" \
                    -o ./arxsentinel \
                    ./cmd/arxsentinel || \
                echo "[integration-caddy] arxsentinel build FAILED"
            # version-check: --version is a supported flag (cmd/arxsentinel/
            # main.go: flag.Bool("version", ...)).
            ./arxsentinel --version || \
                echo "[integration-caddy] arxsentinel --version FAILED"

            # ----------------------------------------------------------------
            # P2.4 -- load pre-built caddy-arxsentinel image (host build).
            # ----------------------------------------------------------------
            # Per Decision 4 Revised / G11: caddy-arxsentinel:local is
            # built NATIVELY on the ubuntu-latest host (docker build +
            # docker save in the previous workflow step), NOT compiled
            # inside the VM. The tar is synced into the VM via
            # vmactions/freebsd-vm's rsync of $GITHUB_WORKSPACE (the
            # tar lands at $GITHUB_WORKSPACE/caddy-arxsentinel.tar in
            # both host and VM). podman load here is a pure local
            # file-import with no network/toolchain dependency -- this
            # sidesteps all 5 bugs from triage-caddy-1.md (short-name,
            # platform, GOROOT under linprocfs, DNS in build container)
            # in one move. See Decision 4 Revised in DECISIONS.md for
            # the full rationale + bug history; G11 for the precedent
            # it sets for future backends.
            # ----------------------------------------------------------------
            echo "[integration-caddy] loading pre-built caddy-arxsentinel image (built on host, synced via rsync)..."
            podman load -i "$GITHUB_WORKSPACE/caddy-arxsentinel.tar" || \
                echo "[integration-caddy] podman load caddy-arxsentinel FAILED (integration.sh will fail to start the container)"

            # Marker for the log artifact's last line (Phase 3-4 will
            # append the integration.sh output below this block — kept
            # for the cat-after-write emit point).
            echo
            echo "=== integration-caddy unblock chain end @ $(date -u +%FT%TZ) ==="
            echo

            # ----------------------------------------------------------------
            # Task 4.2 — invoke integration.sh with SCOPED TMPDIR (per
            # Flow 088 Decision G.1e).
            # ----------------------------------------------------------------
            # CRITICAL: `TMPDIR="$GITHUB_WORKSPACE"` is a per-command
            # environment assignment — POSIX single-command form, NOT
            # `export TMPDIR="$GITHUB_WORKSPACE"`. The exported form
            # poisons Go module-mode detection for any `go build` that
            # runs AFTER it: Go sees cwd == TMPDIR and refuses to use
            # the go.mod there ("ignoring go.mod in system temp root").
            # The 088 G.1 first run (Actions run 28462048606) hit this
            # cascade — `export TMPDIR` at the top of the run block
            # silently broke the integration-smoke's native `go build`,
            # which then cascaded to a misleading "no local image"
            # error from the smoke. 088 DECISIONS.md §"Decision G.1e"
            # documents the full postmortem and the scoped-per-command
            # fix. We invoke the same pattern verbatim here.
            #
            # Why this matters even though the go build runs BEFORE
            # the integration.sh invocation: defensively, the scoped
            # form also protects any future step added below this
            # point (e.g. a follow-up integration-caddy iteration
            # adding a `go test` after the smoke). 088 G.1e says
            # "any future VM-action job that mixes go build with a
            # script using TMPDIR MUST scope TMPDIR per-command,
            # not export it" — we obey unconditionally.
            #
            # The integration.sh exit code is recorded but not
            # short-circuited to a workflow failure: the job runs
            # with continue-on-error: true (DECISIONS §6 research-
            # grade). A red run is a recorded finding in the
            # downloadable smoke-log.txt, not a flow-blocker.
            # ----------------------------------------------------------------
            echo "[integration-caddy] invoking integration.sh with scoped TMPDIR=\$GITHUB_WORKSPACE"
            TMPDIR="$GITHUB_WORKSPACE" sh tests/integration-freebsd/caddy/integration.sh \
                && echo "[integration-caddy] integration.sh exit: 0 (3 assertions green)" \
                || echo "[integration-caddy] integration.sh exit: non-zero (recorded in smoke-log; DECISIONS §6 — research-grade, not a flow-blocker)"

            echo
            echo "=== integration-caddy integration.sh end @ $(date -u +%FT%TZ) ==="
            } > "$GITHUB_WORKSPACE/smoke-log.txt" 2>&1

            # Flow 088 TD-13 cat-after-write pattern: re-emit the log
            # inline in the Actions run-log (collapsible group) AND
            # keep it downloadable as the artifact. Without this the
            # log is artifact-only-debug, requiring a download to
            # triage. See Flow 088 TECH_DEBT.md TD-13.
            echo "::group::Full smoke log (also in the uploaded smoke-log.txt artifact)"
            cat "$GITHUB_WORKSPACE/smoke-log.txt"
            echo "::endgroup::"
            echo "smoke-log written to $GITHUB_WORKSPACE/smoke-log.txt"
            ls -l "$GITHUB_WORKSPACE/smoke-log.txt"

            # ----------------------------------------------------------------
            # Task 4.3 — inline ::group:: + cat for the threat log and
            # the caddy access log. Both are also uploaded as artifacts
            # by the `Upload integration-caddy artifacts` step below
            # (Task 3.6 — already in place, if: always() + if-no-files-
            # found: warn so red runs still produce the artifact for
            # triage). The ::group:: blocks here are for INLINE run-log
            # visibility — without them the threat log and access log
            # are artifact-only-debug, requiring a download to triage
            # the run. Same Flow 088 TD-13 cat-after-write pattern as
            # the smoke-log block above (Task 2.5).
            #
            # DECISIONS: §5 (UA-based grader — three assertions on the
            # threat log; inline visibility is what makes the assertion
            # output visible in the Actions run-log, not just in the
            # downloaded artifact); §6 (continue-on-error — the cat
            # commands are best-effort, missing files just print an
            # ls-not-found message inline, no abort).
            # ----------------------------------------------------------------
            echo "::group::threats-caddy.log (also in uploaded artifact integration-caddy/threats-caddy.log.smoke)"
            if [ -s "$GITHUB_WORKSPACE/threats-caddy.log.smoke" ]; then
                cat "$GITHUB_WORKSPACE/threats-caddy.log.smoke"
            else
                echo "[integration-caddy] threats-caddy.log.smoke missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "threats-caddy.log.smoke size: $(wc -c < "$GITHUB_WORKSPACE/threats-caddy.log.smoke" 2>/dev/null || echo 0) bytes"

            echo "::group::caddy access log (also in uploaded artifact integration-caddy/caddy-access.log)"
            if [ -s "$GITHUB_WORKSPACE/caddy-access.log" ]; then
                cat "$GITHUB_WORKSPACE/caddy-access.log"
            else
                echo "[integration-caddy] caddy-access.log missing or empty (integration.sh likely did not reach the artifact-persist step)"
            fi
            echo "::endgroup::"
            echo "caddy-access.log size: $(wc -c < "$GITHUB_WORKSPACE/caddy-access.log" 2>/dev/null || echo 0) bytes"

      - name: Upload integration-caddy artifacts
        # smoke-log.txt: the full VM run log (Task 2.5)
        # threats-caddy.log.smoke: the sentinel threat log (Task 3.6
        #   copy, mirrored to $GITHUB_WORKSPACE so copyback returns it)
        # caddy-access.log: the raw caddy access log the sentinel read
        #   (Task 3.6 copy, same path; lets the user cross-reference
        #   threat log entries with the access-log line that triggered
        #   them during triage)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-caddy
          path: |
            smoke-log.txt
            threats-caddy.log.smoke
            caddy-access.log
          if-no-files-found: warn

  # -------------------------------------------------------------------
  # integration-traefik — Flow 091 P3 (DECISIONS §1: traefik second,
  # Go-static binary, runs under FreeBSD/podman Linux-emul with minimal
  # friction; access log configurable to CLF with full UA field).
  #
  # Unlike caddy (P2.4 host build, custom caddy-arxsentinel:local
  # image with transform-encoder plugin), traefik ships the binary
  # upstream — docker.io/library/traefik:v3-alpine — and emits CLF
  # by default (the arx-core "traefik" parser profile expects exactly
  # this format; see sentinel-traefik.yaml header for the source-
  # verified contract). No custom image build, no `podman build`,
  # no host-side `docker build` + `podman load` chain. The P3.4
  # unblock chain is therefore VERBATIM the 089 nginx pattern (the
  # 091 caddy host-build G11 precedent does not apply — G11 only
  # applies to backends that need a custom Go-toolchain-built
  # image, which traefik does not).
