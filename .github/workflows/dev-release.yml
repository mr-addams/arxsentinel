name: Dev Release

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  dev-release:
    name: Build & publish dev pre-release
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and create dev tag
        id: tag
        run: |
          BASE=$(cat VERSION)
          # Retry loop: multiple PRs merging simultaneously see the same tag count.
          # Fetch latest tags before each attempt so the counter is always current.
          for i in $(seq 1 10); do
            git fetch --tags --quiet
            N=$(git tag --list "v${BASE}-dev.*" | wc -l)
            TAG="v${BASE}-dev.$((N + 1))"
            git tag "$TAG" 2>/dev/null && git push origin "$TAG" && break
            echo "Tag $TAG already exists, retrying ($i/10)..."
            sleep 2
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
