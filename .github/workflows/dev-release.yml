name: Dev Release

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'VERSION'
      - '.github/workflows/**'
  # Manual trigger for workflow-only changes to this file: the push
  # trigger above excludes .github/workflows/** via paths-ignore, so a
  # commit that ONLY touches this file (e.g. a CI-fix like the
  # freebsd-container-image healthcheck-filename fix) does not
  # auto-dispatch a live run. workflow_dispatch lets an operator verify
  # such a fix on demand without needing an unrelated code change to
  # piggyback a push trigger.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  dev-release:
    name: Build & publish dev pre-release
    # Flow 090 (Decision 7): expose the dev-tag created in the `tag` step
    # below to downstream jobs (freebsd-container-image needs it to know
    # which tag to push the FreeBSD image under). Note: this `outputs:`
    # block is the ONE-AND-ONLY surgical modification to the existing
    # dev-release job — no step / trigger / permission is touched.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        # -race is mandatory under the Transformation Safety Protocol:
        # the telemetry pipeline moves concurrent code, and silent data races
        # would corrupt scoring state across module boundaries.
        # -count=1 disables Go's test-result cache so a regression cannot be masked.
        run: go test -race -count=1 ./...

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and create dev tag
        id: tag
        run: |
          BASE=$(cat VERSION)
          # Next dev counter = max(existing)+1 — robust to gaps, deleted/orphan tags from
          # failed runs, non-1 start, AND manual VERSION bumps (a fresh BASE has no dev tags
          # → max empty → 0 → starts at dev.1). Count-based numbering was fragile: it collided
          # with the existing max tag whenever the sequence did not start at dev.1.
          # Retry loop handles concurrent merges racing for the same counter
          # (re-fetch + recompute max each attempt; loser of the push race retries → next number).
          for i in $(seq 1 10); do
            git fetch --tags --quiet
            MAX=$(git tag --list "v${BASE}-dev.*" \
                  | sed -n "s/^v${BASE}-dev\.\([0-9]\{1,\}\)$/\1/p" \
                  | sort -n | tail -1)
            TAG="v${BASE}-dev.$(( ${MAX:-0} + 1 ))"
            if git tag "$TAG" 2>/dev/null && git push origin "$TAG"; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG race/exists, retrying ($i/10)..."
            sleep 2
          done
          echo "::error::failed to create dev tag after 10 attempts" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested versions
        uses: actions/download-artifact@v8
        with:
          name: integration-versions
          path: .
        continue-on-error: true

      - name: Append tested versions to release notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ -f tested-versions.md ]; then
            current=$(gh release view "$tag" --json body -q '.body')
            gh release edit "$tag" \
              --notes "$(printf '%s\n\n---\n\n%s' "$current" "$(cat tested-versions.md)")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Flow 090 (Decision 7) — FreeBSD container image ────────────────────────
  # Runs AFTER the existing dev-release job (Linux release) succeeds. Adds
  # the FreeBSD amd64 OCI image to the same ghcr.io repo with a -freebsd-amd64
  # tag suffix (Decision 6). The existing Linux dockers_v2 manifest-list is
  # untouched; this is a pure additive job.
  #
  # Why not in goreleaser dockers_v2: goreleaser uses docker buildx, which
  # does not support building FreeBSD images from a Linux host. The FreeBSD
  # image must be built inside a vmactions/freebsd-vm QEMU guest via
  # podman build — the same mechanism Flow 088 validated in container-build-freebsd.
  # Re-encodes the storage/pf unblock chain verbatim per 088 Decision E.2b
  # (fresh VM = fresh defaults requiring fresh unblock).
  #
  # First iteration: continue-on-error: true (Decision 7 + 088/089 Decision 6
  # first-iter discipline). Promotion to workflow-internal blocking is a
  # separate revisionist commit after 2+ consecutive green dispatches.
  # NEVER promoted to branch-protection gating on dev/main — only the live
  # dev-release job stays gating there; this FreeBSD job stays workflow-internal.
  freebsd-container-image:
    name: FreeBSD container image (amd64, parallel enrichment)
    runs-on: ubuntu-latest
    needs: dev-release
    # Decision 7 + 088/089 Decision 6: first iteration carries continue-on-error
    # so a FreeBSD-side failure does NOT block the Linux release pipeline that
    # has already published by the time this job dispatches (it's in `needs:
    # dev-release`, so by definition runs AFTER successful Linux release).
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go (host cache; VM installs its own go via pkg)
        # Same host-cache-then-VM-installs-go pattern as 088 freebsd-ci.yml
        # build-test job — go-version-file pins both to the same version.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build FreeBSD image and push to ghcr.io
        id: freebsd_image
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: "14.3"
          usesh: true
          # copyback: true (matches 088/089's proven-stable jobs, which use
          # the same podman run --version smoke test successfully many
          # times). copyback: false was tried first (the artifact IS the
          # image pushed to ghcr, no file needs copying back) but live runs
          # 28511957455 (both the original dispatch and a manual retry)
          # crashed with "ssh exited with code 134" (SIGABRT) immediately
          # after a fully successful `podman build`, before the smoke-test
          # step printed anything. copyback: false is the one config
          # difference vs. 088/089's identical smoke-test pattern; reverting
          # to true is the cheapest, most defensible next experiment.
          copyback: true
          # DEV_TAG is a custom (non-GITHUB_-prefixed) env var - it does NOT
          # match a GITHUB_* glob and must be listed explicitly, unlike
          # GITHUB_TOKEN/GITHUB_ACTOR which vmactions forwards by name here.
          envs: 'GITHUB_TOKEN GITHUB_ACTOR DEV_TAG'
          run: |
            set -eu

            # Pass through the tag from the dev-release job. The new job's
            # `needs: dev-release` guarantees this is non-empty by the time
            # we run.
            TAG="${DEV_TAG}"
            if [ -z "${TAG}" ]; then
              echo "::error::DEV_TAG env var not set; cannot derive image tag" >&2
              exit 1
            fi
            IMAGE_TAG="ghcr.io/mr-addams/arxsentinel:${TAG}-freebsd-amd64"
            IMAGE_LATEST="ghcr.io/mr-addams/arxsentinel:freebsd-amd64-latest"
            echo "Target images:"
            echo "  version-tagged: ${IMAGE_TAG}"
            echo "  floating-latest: ${IMAGE_LATEST}"

            # ── Unblock chain (verbatim from 088 Decision E.2b + F.1, the same
            # chain 088 container-build-freebsd job uses) ──────────────────────
            # Each vmactions/freebsd-vm step is a FRESH FreeBSD VM. Storage
            # defaults to driver=zfs which fails in the QEMU/UFS VM (no zpool),
            # and pf kernel module required for CNI bridge is not loaded by
            # default. Both must be fixed before any `podman build`/`podman run`.

            echo "::group::pkg install podman + go"
            pkg install -y sysutils/podman go jq
            echo "::endgroup::"

            echo "::group::storage fix (zfs→vfs)"
            # 088 Decision E.1: storage.conf ships with driver = "zfs" which
            # hard-fails inside the QEMU VM (no zpool available). Change to vfs.
            sed -I .bak -e 's/driver = "zfs"/driver = "vfs"/' \
                /usr/local/etc/containers/storage.conf
            echo "Effective storage driver:"
            podman info --format '{{.Store.GraphDriverName}}'
            echo "::endgroup::"

            echo "::group::pf kernel module + egress interface"
            # 088 Decision F.1: CNI bridge requires pf loaded + /etc/pf.conf
            # configured. Same block as 088 — see freebsd-ci.yml verbatim.
            kldload pf || true
            if [ ! -f /etc/pf.conf ]; then
              cp /usr/local/etc/containers/pf.conf.sample /etc/pf.conf
            fi
            # Detect egress interface at runtime; default vtnet0 (QEMU/virtio NIC).
            # If ifconfig -l output shows a different default, the diagnostic
            # in the log will show it (so a future fix is a one-line swap).
            EGRESS_IF=$(ifconfig -l | awk '{print $1}')
            echo "Detected interfaces: $(ifconfig -l)"
            echo "Using egress interface: ${EGRESS_IF:-vtnet0}"
            sed -I .bak -e "s/^v4egress_if=.*/v4egress_if=${EGRESS_IF:-vtnet0}/" \
                -e "s/^v6egress_if=.*/v6egress_if=${EGRESS_IF:-vtnet0}/" /etc/pf.conf
            sysrc pf_enable=YES
            service pf start || service pf restart
            sysctl net.pf.filter_local=1
            echo "::endgroup::"

            # ── Build the arxsentinel binary natively in the VM ─────────────────
            # Same approach as 088 build-test + container-build-freebsd jobs: the
            # FreeBSD VM has go installed via pkg, and a native build produces
            # the correct FreeBSD/amd64 binary. Cross-compile from a Linux host
            # would be possible, but running `go build` native on FreeBSD verifies
            # the toolchain + product code genuinely work on this platform, not
            # just that they cross-compile.
            echo "::group::native go build (cmd/arxsentinel + cmd/healthcheck)"
            cd "$GITHUB_WORKSPACE"
            # Stage binaries + config into a MINIMAL /tmp/build/ directory
            # (088's exact pattern), NOT $GITHUB_WORKSPACE. Live run
            # 28513793247 crashed with "ssh exited with code 134" (SIGABRT)
            # immediately after a fully successful `podman build .` when the
            # build context was the full repo checkout ($GITHUB_WORKSPACE,
            # includes .git/ and the whole source tree - much larger than
            # 088's 3-file /tmp/build/ context). A same-day dispatch of the
            # isolated 088 container-build-freebsd job (run 28514538119)
            # confirmed the identical smoke test succeeds today with the
            # small-context pattern, ruling out an environment regression -
            # the large build context was the actual difference.
            mkdir -p /tmp/build
            # CGO_ENABLED=0 is REQUIRED, not optional: without it, a FreeBSD
            # pkg go toolchain with a C compiler available may link
            # dynamically against libc. The Containerfile.freebsd base image
            # (ghcr.io/freebsd/freebsd-static:14.3) ships NO dynamic linker
            # or libc - it is a static-binaries-only image (the name says
            # so). A dynamically-linked binary exec'd there aborts in the
            # dynamic loader before main() runs - a silent SIGABRT with
            # ZERO stdout output, exit code 134, in well under a second.
            # This exact signature was captured via debug instrumentation
            # (#247) on live run 28516662994: `podman run --version`
            # returned exit 134 in 0.49s with no output at all. 088's
            # proven-stable container-build-freebsd job (freebsd-ci.yml)
            # always set CGO_ENABLED=0 explicitly; this job omitted it -
            # the actual root cause of every SIGABRT crash in this
            # investigation (#242-#247 fixed real but secondary bugs along
            # the way; none of them addressed this).
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -o /tmp/build/arxsentinel ./cmd/arxsentinel
            # healthcheck binary is needed by the Containerfile.freebsd (088
            # pattern: COPY both into the final-stage image). MUST be named
            # exactly "healthcheck" - Containerfile.freebsd's
            # "COPY --chmod=755 healthcheck /healthcheck" line references
            # this literal filename.
            CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64 \
                go build -o /tmp/build/healthcheck ./cmd/healthcheck || \
                echo "::notice::cmd/healthcheck build failed — image will skip healthcheck"
            ls -la /tmp/build/
            echo "::endgroup::"

            # Containerfile.freebsd's "COPY config.docker.yaml
            # /etc/arxsentinel/config.yaml" line (088 pattern) expects this
            # file at the build context root - stage it into /tmp/build/
            # alongside the binaries (same directory as the podman build
            # context below).
            echo "::group::stage config.docker.yaml into build context"
            cp "$GITHUB_WORKSPACE/deploy/container/docker/config.docker.yaml" \
               /tmp/build/config.docker.yaml
            echo "::endgroup::"

            # ── podman build against Containerfile.freebsd ───────────────────────
            # Containerfile.freebsd was added by Flow 088 PR #239 — it's a single
            # stage that COPY's pre-built binaries into the digest-pinned
            # ghcr.io/freebsd/freebsd-static:14.3 base. Single-arch (amd64 only —
            # the QEMU VM is amd64, no cross-arch buildx analogue for FreeBSD).
            # Context is /tmp/build/ (3 files: arxsentinel, healthcheck,
            # config.docker.yaml) - NOT $GITHUB_WORKSPACE - matching 088's
            # proven-stable container-build-freebsd job exactly.
            echo "::group::podman build arxsentinel:freebsd-local"
            podman build \
                -t arxsentinel:freebsd-local \
                -f "$GITHUB_WORKSPACE/deploy/container/freebsd/Containerfile.freebsd" \
                /tmp/build/
            echo "::endgroup::"

            # Smoke test: the SIGABRT that plagued live runs 28508814305 /
            # 28511957455 / 28513793247 / 28515335753 was root-caused (PR #248)
            # to a missing CGO_ENABLED=0 on the FreeBSD go build — the binary
            # linked dynamically against a libc that freebsd-static:14.3 does
            # not ship, aborting in the dynamic loader before main() ran.
            # Confirmed fixed on live run 28518101769 (exit 0, version printed).
            echo "::group::smoke test podman run --version"
            podman run --rm arxsentinel:freebsd-local --version
            echo "::endgroup::"

            # ── podman login + push to ghcr with both tag variants ───────────────
            # Decision 6: two tags per image push — :<full-tag>-freebsd-amd64
            # (version-pinned) and :freebsd-amd64-latest (floating). Both via
            # the same GITHUB_TOKEN secret that the existing dev-release job
            # uses for the Linux docker push (line 78-83).
            echo "::group::podman login + push"
            # The GITHUB_TOKEN env var is forwarded by the vmactions/freebsd-vm
            # action via the `envs:` directive above. echo mask before login
            # so the token never appears in plain text in logs.
            echo "${GITHUB_TOKEN}" | podman login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            # Tag the local image with both target names, then push each.
            podman tag arxsentinel:freebsd-local "${IMAGE_TAG}"
            podman tag arxsentinel:freebsd-local "${IMAGE_LATEST}"
            podman push "${IMAGE_TAG}"
            podman push "${IMAGE_LATEST}"
            echo "::endgroup::"

            echo "::group::finalize"
            echo "Pushed: ${IMAGE_TAG}"
            echo "Pushed: ${IMAGE_LATEST}"
            echo "::endgroup::"
        env:
          # Flow 090 Decision 7: pull the tag from the dev-release job's outputs
          # via the needs context. Env-vars passed into the VM are forwarded by
          # vmactions/freebsd-vm's `envs:` directive above.
          DEV_TAG: ${{ needs.dev-release.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # ─── Flow 090 P5+ (Decision 9 Revised) — FreeBSD integration gate ────────
  # Parallel-non-gating reusable-workflow caller for the Flow 089 nginx
  # integration suite. NOT in the needs: chain of dev-release — runs in
  # parallel with the existing `integration` Linux reusable-workflow caller
  # (line 17-18). This is the "со всеми интеграционными тестами" wiring
  # interpreted per Decision 9: surface the EXISTING FreeBSD integration
  # checks (089 nginx integration) on every dev push, NOT wait for backends
  # 2-6 (those remain deferred to Flow 091+ per TD-089-1 atomic-iteration
  # discipline).
  #
  # NOTE: `continue-on-error` is NOT available on a reusable-workflow-call
  # job (actionlint enforces this — only "name", "uses", "with", "secrets",
  # "needs", "if", "permissions" are allowed here). This means a red
  # freebsd-integration-gate DOES flip the overall dev-release workflow
  # RUN conclusion to "failure" in the Actions UI, even though it does not
  # block or fail the dev-release/freebsd-container-image jobs themselves
  # (no needs: dependency on this job). This is a known, accepted trade-off
  # for the first iteration — revisit if the false-alarm noise on dev-push
  # notifications becomes a problem (candidate fix: wrap the call in a
  # normal job with steps: gh workflow run + poll, trading directness for
  # continue-on-error support).
  freebsd-integration-gate:
    name: FreeBSD integration gate (parallel, non-gating first-iter)
    # Reusable-workflow call: uses: is a JOB-LEVEL field here, mutually
    # exclusive with runs-on:/steps: (GitHub Actions docs: "you call
    # reusable workflows directly within a job, and not from within job
    # steps"). Matches the existing `integration:` job's pattern (line 17).
    # freebsd-integration.yml was merged to dev in PR #240 (Flow 089); Edit
    # 1 above added the workflow_call: trigger that allows this call (089
    # originally shipped without it — oversight recorded in DECISIONS
    # Decision 9 Revised). The 089 workflow runs the nginx integration
    # smoke on its own vmactions/freebsd-vm step: builds arxsentinel
    # natively, runs nginx + curl attacker via podman, asserts
    # THREAT+attacker-IP+score+reason on the threats log.
    #
    # NOT needs: dev-release — this job runs in parallel with the existing
    # `integration` job (line 17); its own failure does not fail or block
    # the dev-release/freebsd-container-image jobs (no needs: chain to them).
    uses: ./.github/workflows/freebsd-integration.yml
