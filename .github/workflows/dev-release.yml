name: Dev Release

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'VERSION'
      - '.github/workflows/**'

permissions:
  contents: write
  packages: write

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  dev-release:
    name: Build & publish dev pre-release
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        # -race is mandatory under the Transformation Safety Protocol:
        # the telemetry pipeline moves concurrent code, and silent data races
        # would corrupt scoring state across module boundaries.
        # -count=1 disables Go's test-result cache so a regression cannot be masked.
        run: go test -race -count=1 ./...

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Calculate and create dev tag
        id: tag
        run: |
          BASE=$(cat VERSION)
          # Next dev counter = max(existing)+1 — robust to gaps, deleted/orphan tags from
          # failed runs, non-1 start, AND manual VERSION bumps (a fresh BASE has no dev tags
          # → max empty → 0 → starts at dev.1). Count-based numbering was fragile: it collided
          # with the existing max tag whenever the sequence did not start at dev.1.
          # Retry loop handles concurrent merges racing for the same counter
          # (re-fetch + recompute max each attempt; loser of the push race retries → next number).
          for i in $(seq 1 10); do
            git fetch --tags --quiet
            MAX=$(git tag --list "v${BASE}-dev.*" \
                  | sed -n "s/^v${BASE}-dev\.\([0-9]\{1,\}\)$/\1/p" \
                  | sort -n | tail -1)
            TAG="v${BASE}-dev.$(( ${MAX:-0} + 1 ))"
            if git tag "$TAG" 2>/dev/null && git push origin "$TAG"; then
              echo "tag=$TAG" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG race/exists, retrying ($i/10)..."
            sleep 2
          done
          echo "::error::failed to create dev tag after 10 attempts" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download tested versions
        uses: actions/download-artifact@v8
        with:
          name: integration-versions
          path: .
        continue-on-error: true

      - name: Append tested versions to release notes
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if [ -f tested-versions.md ]; then
            current=$(gh release view "$tag" --json body -q '.body')
            gh release edit "$tag" \
              --notes "$(printf '%s\n\n---\n\n%s' "$current" "$(cat tested-versions.md)")"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
