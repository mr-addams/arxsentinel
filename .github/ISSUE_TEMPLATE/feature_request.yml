name: Feature Request
description: Suggest a new detector, config option, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe what you need and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where the current behavior is insufficient
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New detector
        - Whitelist / scoring
        - Configuration
        - Packaging (deb/rpm/pacman)
        - Logging / output
        - Performance
        - Documentation
        - Other
    validations:
      required: true
