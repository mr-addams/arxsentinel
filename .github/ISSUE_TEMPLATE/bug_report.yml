name: Bug Report
description: Something is not working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: arxsentinel version
      description: Run `arxsentinel --version` or check the release tag
      placeholder: "v0.1.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Debian / Ubuntu
        - Fedora / RHEL / AlmaLinux / Rocky Linux
        - Arch Linux / Manjaro
        - Other Linux
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Config used: ...
        2. nginx log line that triggered the issue: ...
        3. Observed behavior: ...

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste relevant lines from `/var/log/arxsentinel/sentinel.log`
      render: text

  - type: textarea
    id: config
    attributes:
      label: Config (sanitized)
      description: Paste your `config.yaml` with any sensitive values removed
      render: yaml
